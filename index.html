<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - 50th Anniversary 3D Ceremonial Cauldron</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030101;
      color: #fff;
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', 'PingFang HK', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Broadcast Vignette & Subtle Arena Depth */
    .cinema-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 48%, transparent 52%, rgba(0, 0, 0, 0.78) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Grand Ceremonial Slogan Reveal Overlay */
    .banner-container {
      position: fixed;
      top: 4.5vh;
      left: 0;
      width: 100%;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5vw;
      opacity: 0;
      transform: translateY(-28px) scale(0.94);
      transition: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .banner-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .laurel {
      height: 14.5vh;
      min-height: 92px;
      filter: drop-shadow(0 0 18px rgba(255, 200, 60, 0.85));
    }

    .slogan-plaque {
      background: linear-gradient(180deg, rgba(28, 6, 6, 0.86) 0%, rgba(12, 3, 3, 0.92) 100%);
      border-top: 2px solid rgba(255, 218, 110, 0.85);
      border-bottom: 2px solid rgba(255, 218, 110, 0.85);
      padding: 1.6vh 4vw;
      box-shadow: 0 14px 45px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(255, 190, 50, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .slogan-title {
      font-size: 4.8vh;
      font-weight: 900;
      letter-spacing: 0.36em;
      margin-right: -0.36em;
      background: linear-gradient(180deg, #ffffff 0%, #ffe885 45%, #d69c24 85%, #fff5c2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(255, 180, 0, 0.9));
      line-height: 1.32;
    }

    #setup-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(18, 9, 9, 0.92);
      border: 1px solid rgba(255, 215, 0, 0.5);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    #setup-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <!-- Three.js & Post-Processing Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="setup-badge">
    <div>Press <b>F</b> for Fullscreen &bull; Press <b>H</b> to hide/show this box</div>
    <div>Backstage Control: <b>/backstage.html</b> &bull; Remote Sync ID: <b id="peer-id-display" style="color:#fff;">Loading...</b></div>
  </div>

  <div id="webgl-container"></div>
  <div class="cinema-vignette"></div>

  <!-- Ceremonial Slogan Reveal -->
  <div class="banner-container" id="ceremony-slogan">
    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>

    <div class="slogan-plaque">
      <h1 class="slogan-title">五十載耆康安老</h1>
      <h1 class="slogan-title">以初心關顧同行</h1>
    </div>

    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- State & Sync Setup ---
    let heatValue = 0;
    let targetHeat = 0;

    const sloganBanner = document.getElementById('ceremony-slogan');
    const setupBadge = document.getElementById('setup-badge');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setupBadge.classList.add('hidden');
      }
      if (e.key === 'h' || e.key === 'H') {
        setupBadge.classList.toggle('hidden');
      }
    });

    function handleCommand(data) {
      if (typeof data.heat === 'number') {
        targetHeat = Math.max(0, Math.min(100, data.heat));
      }
      if (data.hideBadge) setupBadge.classList.add('hidden');
    }

    try {
      const channel = new BroadcastChannel('cauldron_ceremony_sync');
      channel.onmessage = (event) => handleCommand(event.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'cauldron_state' && e.newValue) {
        handleCommand(JSON.parse(e.newValue));
      }
    });

    try {
      if (typeof Peer !== 'undefined') {
        const roomCode = 'cauldron-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomCode);
        peer.on('open', (id) => {
          document.getElementById('peer-id-display').textContent = id.replace('cauldron-', '');
        });
        peer.on('connection', (conn) => {
          setupBadge.classList.add('hidden');
          conn.on('data', (data) => handleCommand(data));
        });
        peer.on('error', () => {
          document.getElementById('peer-id-display').textContent = 'Local Mode';
        });
      }
    } catch (err) {
      document.getElementById('peer-id-display').textContent = 'Local Mode';
    }

    // --- Three.js Scene, Camera & Renderer ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040203);
    scene.fog = new THREE.FogExp2(0x060203, 0.032);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.6, 15.2);
    camera.lookAt(0, 3.3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- Post-Processing Bloom for Broadcast Glow ---
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.75, // bloom strength
      0.55, // radius
      0.78  // threshold so only fire, gold highlights & spotlights glow
    );
    composer.addPass(bloomPass);

    // --- Procedural High-Res Textures (Embossed Cloud Scrolls & Plaque) ---
    function createBowlTextures() {
      const w = 2048, h = 512;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = w; colorCanvas.height = h;
      const cCtx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = w; bumpCanvas.height = h;
      const bCtx = bumpCanvas.getContext('2d');

      // Imperial Crimson Lacquer Base
      const grad = cCtx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#9e1111');
      grad.addColorStop(0.5, '#c41818');
      grad.addColorStop(1, '#6b0707');
      cCtx.fillStyle = grad;
      cCtx.fillRect(0, 0, w, h);

      bCtx.fillStyle = '#404040';
      bCtx.fillRect(0, 0, w, h);

      // Gold Rim Bands
      cCtx.fillStyle = '#ffd666';
      cCtx.fillRect(0, 0, w, 28);
      cCtx.fillRect(0, h - 24, w, 24);
      bCtx.fillStyle = '#ffffff';
      bCtx.fillRect(0, 0, w, 28);
      bCtx.fillRect(0, h - 24, w, 24);

      // Repeating 3D Embossed Auspicious Cloud Scrolls (祥雲)
      const count = 16;
      const step = w / count;
      for (let i = 0; i < count; i++) {
        const cx = i * step + step * 0.5;
        const cy = h * 0.52;
        const flip = i % 2 === 0 ? 1 : -1;

        [cCtx, bCtx].forEach((ctx, idx) => {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(flip, 1);
          ctx.strokeStyle = idx === 0 ? '#ffdf73' : '#ffffff';
          ctx.lineCap = 'round';

          // Outer spiral
          ctx.lineWidth = idx === 0 ? 14 : 18;
          ctx.beginPath();
          ctx.arc(0, 0, 56, 0.15 * Math.PI, 1.85 * Math.PI);
          ctx.stroke();

          // Inner coil
          ctx.lineWidth = idx === 0 ? 10 : 14;
          ctx.beginPath();
          ctx.arc(6, 0, 28, 0, 1.7 * Math.PI);
          ctx.stroke();

          // Flowing cloud tail
          ctx.beginPath();
          ctx.moveTo(-56, 6);
          ctx.bezierCurveTo(-80, -35, -105, 35, -128, -4);
          ctx.stroke();
          ctx.restore();
        });
      }

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.wrapS = THREE.RepeatWrapping;
      colorTex.colorSpace = THREE.SRGBColorSpace;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.wrapS = THREE.RepeatWrapping;

      return { colorTex, bumpTex };
    }

    function createPlaqueTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 1024);
      grad.addColorStop(0, '#cf1919');
      grad.addColorStop(0.5, '#a80f0f');
      grad.addColorStop(1, '#730707');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 1024);

      // Gold Frame
      ctx.strokeStyle = '#ffd966';
      ctx.lineWidth = 14;
      ctx.strokeRect(24, 24, 464, 976);

      // Emblem Circle
      ctx.strokeStyle = '#ffe58f';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(256, 230, 78, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#fff3b8';
      ctx.font = 'bold 84px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('50', 256, 258);

      // Traditional Calligraphy
      ctx.fillStyle = '#ffe58f';
      ctx.font = 'bold 68px "Noto Serif TC", "Songti TC", "PingFang HK", serif';
      ctx.fillText('五十載', 256, 440);
      ctx.fillText('耆康安老', 256, 540);

      // Interlocking Rings Motif
      ctx.strokeStyle = 'rgba(255, 230, 140, 0.9)';
      ctx.lineWidth = 6;
      [-92, -46, 0, 46, 92].forEach((rx, idx) => {
        ctx.beginPath();
        ctx.arc(256 + rx, idx % 2 === 0 ? 730 : 755, 26, 0, Math.PI * 2);
        ctx.stroke();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // --- Build Monumental 3D Beijing-Style Cauldron ---
    // Proportions: Height = ~50% screen height, Width >= 55% screen width
    const cauldronGroup = new THREE.Group();
    scene.add(cauldronGroup);

    const { colorTex, bumpTex } = createBowlTextures();
    const bowlMat = new THREE.MeshStandardMaterial({
      map: colorTex,
      bumpMap: bumpTex,
      bumpScale: 0.08,
      metalness: 0.72,
      roughness: 0.28,
      side: THREE.DoubleSide
    });

    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xffcf54,
      metalness: 0.92,
      roughness: 0.2
    });

    const gunmetalMat = new THREE.MeshStandardMaterial({
      color: 0x3b3230,
      metalness: 0.85,
      roughness: 0.32
    });

    const darkPlinthMat = new THREE.MeshStandardMaterial({
      color: 0x160d0d,
      metalness: 0.4,
      roughness: 0.65
    });

    // 1. Stepped Ceremonial Stage Plinth
    const plinthBottom = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.25, 3.2), darkPlinthMat);
    plinthBottom.position.y = 0.125;
    plinthBottom.receiveShadow = true;
    cauldronGroup.add(plinthBottom);

    const plinthGoldTrim1 = new THREE.Mesh(new THREE.BoxGeometry(6.26, 0.04, 3.26), goldMat);
    plinthGoldTrim1.position.y = 0.25;
    cauldronGroup.add(plinthGoldTrim1);

    const plinthTop = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.22, 2.6), darkPlinthMat);
    plinthTop.position.y = 0.36;
    plinthTop.receiveShadow = true;
    cauldronGroup.add(plinthTop);

    const plinthGoldTrim2 = new THREE.Mesh(new THREE.BoxGeometry(5.26, 0.04, 2.66), goldMat);
    plinthGoldTrim2.position.y = 0.47;
    cauldronGroup.add(plinthGoldTrim2);

    // 2. Two Tall Angled Gunmetal-Bronze Support Pillars
    function createPillar(side) {
      const shape = new THREE.Shape();
      shape.moveTo(-0.42, 0);
      shape.lineTo(0.42, 0);
      shape.lineTo(0.56, 3.35);
      shape.lineTo(-0.34, 3.35);
      shape.closePath();

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.65,
        bevelEnabled: true,
        bevelThickness: 0.04,
        bevelSize: 0.04,
        bevelSegments: 3
      });
      geom.center();

      const mesh = new THREE.Mesh(geom, gunmetalMat);
      mesh.position.set(side * 1.48, 2.12, 0);
      mesh.scale.x = side;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }
    cauldronGroup.add(createPillar(-1));
    cauldronGroup.add(createPillar(1));

    // 3. Exposed Golden Burner Neck & Mechanical Pipes Under the Bowl
    const neckCylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.45, 0.75, 24), goldMat);
    neckCylinder.position.set(0, 3.62, 0);
    cauldronGroup.add(neckCylinder);

    [-0.32, 0, 0.32].forEach(px => {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.85, 12), goldMat);
      pipe.position.set(px, 3.6, 0.48);
      cauldronGroup.add(pipe);
    });

    // 4. Suspended Trapezoidal Crimson Plaque Between the Pillars
    const plaqueTex = createPlaqueTexture();
    const plaqueMat = new THREE.MeshStandardMaterial({
      map: plaqueTex,
      metalness: 0.35,
      roughness: 0.4
    });

    const plaqueGeom = new THREE.CylinderGeometry(1.18, 0.92, 2.35, 4);
    plaqueGeom.rotateY(Math.PI / 4);
    // Flatten Z depth so it forms a sleek architectural shield
    plaqueGeom.scale(1.18, 1.0, 0.24);

    // Remap UVs cleanly onto the front face of the trapezoidal shield
    const posAttr = plaqueGeom.attributes.position;
    const uvAttr = plaqueGeom.attributes.uv;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const y = posAttr.getY(i);
      const u = (x / 2.2) + 0.5;
      const v = (y / 2.35) + 0.5;
      uvAttr.setXY(i, u, v);
    }

    const plaqueMesh = new THREE.Mesh(plaqueGeom, plaqueMat);
    plaqueMesh.position.set(0, 2.38, 0.36);
    plaqueMesh.castShadow = true;
    cauldronGroup.add(plaqueMesh);

    // Gold Border Frame around Plaque
    const plaqueFrameGeom = new THREE.CylinderGeometry(1.22, 0.96, 2.41, 4);
    plaqueFrameGeom.rotateY(Math.PI / 4);
    plaqueFrameGeom.scale(1.18, 1.0, 0.21);
    const plaqueFrame = new THREE.Mesh(plaqueFrameGeom, goldMat);
    plaqueFrame.position.set(0, 2.38, 0.34);
    cauldronGroup.add(plaqueFrame);

    // 5. Wide Shallow Olympic Cauldron Bowl (LatheGeometry for Smooth 3D Curvature)
    const bowlPoints = [
      new THREE.Vector2(0.0, 0.0),
      new THREE.Vector2(1.4, 0.05),
      new THREE.Vector2(2.7, 0.28),
      new THREE.Vector2(3.75, 0.68),
      new THREE.Vector2(4.25, 1.05),
      new THREE.Vector2(4.05, 1.08),
      new THREE.Vector2(3.4, 0.72),
      new THREE.Vector2(0.0, 0.48)
    ];
    const bowlGeom = new THREE.LatheGeometry(bowlPoints, 72);
    const bowlMesh = new THREE.Mesh(bowlGeom, bowlMat);
    bowlMesh.position.set(0, 3.72, 0);
    bowlMesh.castShadow = true;
    bowlMesh.receiveShadow = true;
    cauldronGroup.add(bowlMesh);

    // Brilliant Metallic Gold Rim Torus on Top of the Bowl
    const rimTorus = new THREE.Mesh(new THREE.TorusGeometry(4.16, 0.065, 16, 96), goldMat);
    rimTorus.rotation.x = Math.PI / 2;
    rimTorus.position.set(0, 4.78, 0);
    cauldronGroup.add(rimTorus);

    // --- Tiered Arena Stage Floor & Background Steps ---
    const stageFloor = new THREE.Mesh(
      new THREE.CircleGeometry(28, 64),
      new THREE.MeshStandardMaterial({ color: 0x0b0708, metalness: 0.65, roughness: 0.35 })
    );
    stageFloor.rotation.x = -Math.PI / 2;
    stageFloor.receiveShadow = true;
    scene.add(stageFloor);

    // Tiered Auditorium Steps in Background
    const stepMat = new THREE.MeshStandardMaterial({ color: 0x100b0c, metalness: 0.4, roughness: 0.7 });
    for (let s = 0; s < 10; s++) {
      const step = new THREE.Mesh(new THREE.BoxGeometry(46, 0.45, 1.2), stepMat);
      step.position.set(0, s * 0.55 + 0.2, -7 - s * 1.15);
      scene.add(step);
    }

    // --- Volumetric Stage Spotlights ---
    const spotLights = [];
    const beamMeshes = [];

    function createStageBeam(x, y, z, targetX, targetY, colorHex) {
      const spot = new THREE.SpotLight(colorHex, 45, 45, Math.PI / 7, 0.65, 1.2);
      spot.position.set(x, y, z);
      spot.target.position.set(targetX, targetY, 0);
      scene.add(spot);
      scene.add(spot.target);
      spotLights.push(spot);

      // Visible Volumetric Cone
      const coneGeom = new THREE.ConeGeometry(3.8, 22, 32, 1, true);
      coneGeom.translate(0, -11, 0);
      const coneMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        uniforms: {
          uColor: { value: new THREE.Color(colorHex) },
          uOpacity: { value: 0.11 }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mvPos.xyz;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vec3 viewDir = normalize(vViewPos);
            float edgeFade = pow(abs(dot(vNormal, viewDir)), 1.6);
            float verticalFade = smoothstep(0.0, 0.85, vUv.y) * smoothstep(1.0, 0.75, vUv.y);
            gl_FragColor = vec4(uColor, edgeFade * verticalFade * uOpacity);
          }
        `
      });
      const cone = new THREE.Mesh(coneGeom, coneMat);
      cone.position.set(x, y, z);
      cone.lookAt(targetX, targetY, 0);
      cone.rotateX(Math.PI / 2);
      scene.add(cone);
      beamMeshes.push({ cone, baseX: x, phase: Math.random() * Math.PI * 2 });
    }

    createStageBeam(-9.5, 13, -4, -1.5, 2.5, 0xdbeeff);
    createStageBeam(9.5, 13, -4, 1.5, 2.5, 0xdbeeff);
    createStageBeam(-5.5, 14, -6, 0, 4.0, 0xffe4b5);
    createStageBeam(5.5, 14, -6, 0, 4.0, 0xffe4b5);

    // Key Rim Light on Cauldron
    const keyLight = new THREE.DirectionalLight(0xfff0d4, 2.4);
    keyLight.position.set(4, 9, 8);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.9);
    fillLight.position.set(-7, 6, 5);
    scene.add(fillLight);

    // Dynamic Fire Point Light that flickers across the metallic gold & crimson
    const fireLight = new THREE.PointLight(0xff6a00, 0, 24, 1.4);
    fireLight.position.set(0, 5.4, 0.6);
    scene.add(fireLight);

    // --- Custom GPU GLSL Volumetric Fire Shader ---
    const fireUniforms = {
      uTime: { value: 0 },
      uHeat: { value: 0 }
    };

    const fireMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: fireUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uHeat;
        varying vec2 vUv;

        // 2D Value Noise & FBM Turbulence
        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p *= 2.04;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          if (uHeat <= 0.005) discard;

          vec2 uv = vUv;
          // Normalize X from -1 to 1
          float nx = (uv.x - 0.5) * 2.0;
          float ny = uv.y;

          // Flame height scales dynamically with uHeat (0.0 to 1.0)
          float maxH = mix(0.08, 0.96, uHeat);
          float hNorm = ny / maxH;
          if (hNorm > 1.05) discard;

          // Rising turbulent distortion
          vec2 flowUv = vec2(nx * 2.6, ny * 3.8 - uTime * 3.4);
          float n1 = fbm(flowUv);
          float n2 = fbm(flowUv * 1.9 + vec2(uTime * 0.7, -uTime * 2.1));
          float turb = mix(n1, n2, 0.45);

          // Taper flame width as it rises, wider base at high heat
          float baseSpread = mix(0.22, 0.88, sqrt(uHeat));
          float taper = mix(baseSpread, 0.04, pow(clamp(hNorm, 0.0, 1.0), 0.85));
          float distFromCenter = abs(nx + (turb - 0.5) * 0.42 * hNorm);

          float shape = smoothstep(taper, taper * 0.15, distFromCenter);
          float verticalMask = smoothstep(0.0, 0.09, ny) * smoothstep(1.02, 0.25, hNorm);

          float intensity = shape * verticalMask * (0.65 + 0.75 * turb);
          intensity = smoothstep(0.18, 0.88, intensity) * smoothstep(0.0, 0.12, uHeat);

          // Blackbody Fire Color Ramp (Deep Crimson -> Bright Orange -> Golden Yellow -> White Core)
          vec3 col = mix(vec3(0.85, 0.08, 0.0), vec3(1.0, 0.42, 0.02), smoothstep(0.15, 0.48, intensity));
          col = mix(col, vec3(1.0, 0.85, 0.22), smoothstep(0.45, 0.75, intensity));
          col = mix(col, vec3(1.0, 0.98, 0.88), smoothstep(0.75, 0.98, intensity));

          gl_FragColor = vec4(col * 1.45, clamp(intensity * 1.25, 0.0, 1.0));
        }
      `
    });

    // Crossed Volumetric Fire Planes seated inside the Cauldron Bowl
    const firePlaneGeom = new THREE.PlaneGeometry(7.8, 5.2);
    const firePlane1 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane1.position.set(0, 7.15, 0.05);
    cauldronGroup.add(firePlane1);

    const firePlane2 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane2.position.set(0, 7.15, -0.05);
    firePlane2.rotation.y = 0.22;
    cauldronGroup.add(firePlane2);

    // --- 3D Rising Golden Sparks & Embers Particle System ---
    const sparkCount = 260;
    const sparkGeom = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    const sparkVel = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] = (Math.random() - 0.5) * 6.5;
      sparkPos[i * 3 + 1] = 4.7 + Math.random() * 5.0;
      sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
      sparkVel.push({
        vx: (Math.random() - 0.5) * 0.035,
        vy: 0.03 + Math.random() * 0.075,
        vz: (Math.random() - 0.5) * 0.02
      });
    }
    sparkGeom.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));

    const sparkMat = new THREE.PointsMaterial({
      color: 0xffcf54,
      size: 0.09,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparkPoints = new THREE.Points(sparkGeom, sparkMat);
    cauldronGroup.add(sparkPoints);

    // --- Responsive Framing: Cauldron = 1/2 Screen Height, >= 1/2 Screen Width ---
    function updateFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);

      // Total cauldron height in 3D units is ~4.85 (from y=0 plinth to y=4.85 bowl rim)
      // Total cauldron bowl width is ~8.45 (from x=-4.22 to x=+4.22)
      const dist = camera.position.z;
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeightAtZero = 2 * Math.tan(vFovRad / 2) * dist;
      const visibleWidthAtZero = visibleHeightAtZero * camera.aspect;

      const scaleY = (visibleHeightAtZero * 0.50) / 4.85;
      const scaleX = Math.max(scaleY, (visibleWidthAtZero * 0.56) / 8.45);

      cauldronGroup.scale.set(scaleX, scaleY, scaleY);
      // Anchor plinth right at the bottom edge of the screen
      cauldronGroup.position.y = 3.3 - (visibleHeightAtZero * 0.485);
    }
    window.addEventListener('resize', updateFraming);
    updateFraming();

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      heatValue += (targetHeat - heatValue) * 0.05;
      const heatNorm = heatValue / 100;

      // Slogan Reveal at Peak Climax (>= 95%)
      if (heatValue >= 95) {
        sloganBanner.classList.add('visible');
      } else {
        sloganBanner.classList.remove('visible');
      }

      // Update GPU Fire Shader
      fireUniforms.uTime.value = elapsed;
      fireUniforms.uHeat.value = heatNorm;

      // Flickering Fire Light illuminating the 3D Gold Scrolls & Crimson Plaque
      const flicker = Math.sin(elapsed * 19.0) * 0.14 + Math.cos(elapsed * 31.0) * 0.09;
      fireLight.intensity = heatNorm > 0.01 ? (heatNorm * 42 + flicker * 8 * heatNorm) : 0;

      // Animate Rising Golden Sparks
      sparkMat.opacity = Math.min(0.95, heatNorm * 1.15);
      const posArr = sparkGeom.attributes.position.array;
      const spread = 3.6 * Math.sqrt(Math.max(0.05, heatNorm));
      const maxSparkY = 4.8 + heatNorm * 5.2;

      for (let i = 0; i < sparkCount; i++) {
        posArr[i * 3] += sparkVel[i].vx + Math.sin(elapsed * 3 + i) * 0.008;
        posArr[i * 3 + 1] += sparkVel[i].vy * (0.4 + heatNorm * 0.9);
        posArr[i * 3 + 2] += sparkVel[i].vz;

        if (posArr[i * 3 + 1] > maxSparkY || heatNorm < 0.02) {
          posArr[i * 3] = (Math.random() - 0.5) * 2 * spread;
          posArr[i * 3 + 1] = 4.65 + Math.random() * 0.3;
          posArr[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
        }
      }
      sparkGeom.attributes.position.needsUpdate = true;

      // Subtle Ceremonial Spotlight Sweep
      beamMeshes.forEach((b, idx) => {
        const sway = Math.sin(elapsed * 0.45 + b.phase) * 0.08;
        b.cone.rotation.z = sway;
      });

      composer.render();
    }

    animate();
  </script>
</body>
</html>
