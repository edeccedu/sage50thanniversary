<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - 50th Anniversary Ceremonial Cauldron</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #05080f;
      color: #fff;
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', 'PingFang HK', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Subtle Anamorphic Broadcast Vignette */
    .cinema-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 62%, rgba(2, 4, 9, 0.58) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Grand Ceremonial Slogan Reveal Overlay */
    .banner-container {
      position: fixed;
      top: 4.5vh;
      left: 0;
      width: 100%;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5vw;
      opacity: 0;
      transform: translateY(-28px) scale(0.94);
      transition: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .banner-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .laurel {
      height: 14.5vh;
      min-height: 92px;
      filter: drop-shadow(0 0 18px rgba(255, 205, 75, 0.9));
    }

    .slogan-plaque {
      background: linear-gradient(180deg, rgba(28, 6, 8, 0.90) 0%, rgba(12, 3, 5, 0.94) 100%);
      border-top: 2px solid rgba(255, 224, 125, 0.92);
      border-bottom: 2px solid rgba(255, 224, 125, 0.92);
      padding: 1.6vh 4.2vw;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.82), inset 0 0 32px rgba(255, 195, 65, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slogan-title {
      font-size: 4.8vh;
      font-weight: 900;
      letter-spacing: 0.36em;
      margin-right: -0.36em;
      background: linear-gradient(180deg, #ffffff 0%, #ffea92 45%, #d69c24 85%, #fff6c8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(255, 180, 0, 0.9));
      line-height: 1.32;
    }

    #setup-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(10, 15, 25, 0.92);
      border: 1px solid rgba(255, 215, 0, 0.55);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    #setup-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="setup-badge">
    <div>Press <b>F</b> for Fullscreen &bull; Press <b>H</b> to hide/show this box</div>
    <div>Backstage Control: <b>/backstage.html</b> &bull; Remote Sync ID: <b id="peer-id-display" style="color:#fff;">Loading...</b></div>
  </div>

  <div id="webgl-container"></div>
  <div class="cinema-vignette"></div>

  <!-- Ceremonial Slogan Reveal -->
  <div class="banner-container" id="ceremony-slogan">
    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>

    <div class="slogan-plaque">
      <h1 class="slogan-title">五十載耆康安老</h1>
      <h1 class="slogan-title">以初心關顧同行</h1>
    </div>

    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { Reflector } from 'three/addons/objects/Reflector.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let heatValue = 0;
    let targetHeat = 0;

    const sloganBanner = document.getElementById('ceremony-slogan');
    const setupBadge = document.getElementById('setup-badge');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setupBadge.classList.add('hidden');
      }
      if (e.key === 'h' || e.key === 'H') {
        setupBadge.classList.toggle('hidden');
      }
    });

    function handleCommand(data) {
      if (typeof data.heat === 'number') {
        targetHeat = Math.max(0, Math.min(100, data.heat));
      }
      if (data.hideBadge) setupBadge.classList.add('hidden');
    }

    try {
      const channel = new BroadcastChannel('cauldron_ceremony_sync');
      channel.onmessage = (event) => handleCommand(event.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'cauldron_state' && e.newValue) {
        handleCommand(JSON.parse(e.newValue));
      }
    });

    try {
      if (typeof Peer !== 'undefined') {
        const roomCode = 'cauldron-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomCode);
        peer.on('open', (id) => {
          document.getElementById('peer-id-display').textContent = id.replace('cauldron-', '');
        });
        peer.on('connection', (conn) => {
          setupBadge.classList.add('hidden');
          conn.on('data', (data) => handleCommand(data));
        });
        peer.on('error', () => {
          document.getElementById('peer-id-display').textContent = 'Local Mode';
        });
      }
    } catch (err) {
      document.getElementById('peer-id-display').textContent = 'Local Mode';
    }

    // --- Three.js Scene, Camera & Renderer ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060a12);
    scene.fog = new THREE.FogExp2(0x080e1a, 0.0105);

    const camera = new THREE.PerspectiveCamera(33, window.innerWidth / window.innerHeight, 0.1, 220);
    camera.position.set(0, 3.85, 17.8);
    camera.lookAt(0, 3.35, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.24;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // =========================================================================
    // 1. STUDIO-GRADE HDRI REFLECTION MAP (Sharp Speculars on Gold & Titanium)
    // =========================================================================
    function buildLuxuryArenaEnvironment() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();

      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(60, 32, 16),
        new THREE.MeshBasicMaterial({ color: 0x0e1420, side: THREE.BackSide })
      );
      envScene.add(dome);

      // Softboxes & stadium searchlight strips for rich anisotropic metal reflections
      const softboxes = [
        { pos: [-16, 20, 14], color: 0xeaf8ff, size: [6, 18] },
        { pos: [16, 20, 14], color: 0xeaf8ff, size: [6, 18] },
        { pos: [-6, 26, 8], color: 0xffffff, size: [8, 12] },
        { pos: [6, 26, 8], color: 0xfff2dc, size: [8, 12] },
        { pos: [-16, 5, 10], color: 0xff9a4d, size: [4, 16] },
        { pos: [16, 5, 10], color: 0xff9a4d, size: [4, 16] },
        { pos: [0, -12, 10], color: 0x3a2e28, size: [36, 18] }
      ];
      softboxes.forEach(sb => {
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(sb.size[0], sb.size[1]),
          new THREE.MeshBasicMaterial({ color: sb.color })
        );
        panel.position.set(...sb.pos);
        panel.lookAt(0, 3, 0);
        envScene.add(panel);
      });

      const envRT = pmrem.fromScene(envScene, 0.02);
      scene.environment = envRT.texture;
      pmrem.dispose();
    }
    buildLuxuryArenaEnvironment();

    // =========================================================================
    // 2. PROCEDURAL PBR TEXTURES (Brushed Metal, Normal Maps, Veined Marble)
    // =========================================================================
    function createBrushedMetalMaps() {
      const size = 512;
      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = size; roughCanvas.height = size;
      const rCtx = roughCanvas.getContext('2d');
      const rImg = rCtx.createImageData(size, size);

      const normCanvas = document.createElement('canvas');
      normCanvas.width = size; normCanvas.height = size;
      const nCtx = normCanvas.getContext('2d');
      const nImg = nCtx.createImageData(size, size);

      const heights = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const streak = Math.sin(x * 0.45 + Math.sin(y * 0.05) * 2.0) * 0.5 + (Math.random() - 0.5) * 0.7;
          heights[y * size + x] = streak;
          const rVal = Math.max(40, Math.min(220, 95 + streak * 32));
          const idx = (y * size + x) * 4;
          rImg.data[idx] = rVal;
          rImg.data[idx + 1] = rVal;
          rImg.data[idx + 2] = rVal;
          rImg.data[idx + 3] = 255;
        }
      }
      rCtx.putImageData(rImg, 0, 0);

      // Compute tangent-space normal map from heightfield
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const xL = (x - 1 + size) % size;
          const xR = (x + 1) % size;
          const yU = (y - 1 + size) % size;
          const yD = (y + 1) % size;
          const dx = (heights[y * size + xL] - heights[y * size + xR]) * 1.4;
          const dy = (heights[yU * size + x] - heights[yD * size + x]) * 0.4;
          const dz = 1.0;
          const invLen = 1.0 / Math.sqrt(dx * dx + dy * dy + dz * dz);
          const idx = (y * size + x) * 4;
          nImg.data[idx] = ((dx * invLen) * 0.5 + 0.5) * 255;
          nImg.data[idx + 1] = ((dy * invLen) * 0.5 + 0.5) * 255;
          nImg.data[idx + 2] = ((dz * invLen) * 0.5 + 0.5) * 255;
          nImg.data[idx + 3] = 255;
        }
      }
      nCtx.putImageData(nImg, 0, 0);

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.repeat.set(4, 4);

      const normalMap = new THREE.CanvasTexture(normCanvas);
      normalMap.wrapS = normalMap.wrapT = THREE.RepeatWrapping;
      normalMap.repeat.set(4, 4);

      return { roughnessMap, normalMap };
    }

    function createLuxuryMarbleTexture() {
      const size = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Deep obsidian-charcoal stone base
      ctx.fillStyle = '#181d26';
      ctx.fillRect(0, 0, size, size);

      // Subtle warm bronze-gold & slate marble veining
      for (let v = 0; v < 26; v++) {
        ctx.beginPath();
        let px = Math.random() * size;
        let py = Math.random() * size;
        ctx.moveTo(px, py);
        for (let step = 0; step < 18; step++) {
          px += (Math.random() - 0.35) * 90;
          py += (Math.random() - 0.35) * 90;
          ctx.lineTo(px, py);
        }
        ctx.strokeStyle = v % 3 === 0 ? 'rgba(215, 175, 110, 0.14)' : 'rgba(130, 155, 185, 0.11)';
        ctx.lineWidth = Math.random() * 2.5 + 0.6;
        ctx.stroke();
      }

      // Architectural stone slab grid joints
      ctx.strokeStyle = 'rgba(218, 180, 108, 0.22)';
      ctx.lineWidth = 2;
      for (let g = 0; g <= size; g += 256) {
        ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(size, g); ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 4);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const { roughnessMap: brushedRoughness, normalMap: brushedNormal } = createBrushedMetalMaps();
    const marbleSlabTex = createLuxuryMarbleTexture();

    // =========================================================================
    // 3. REAL-TIME REFLECTIVE MARBLE STAGE FLOOR & GOLD INLAYS
    // =========================================================================
    const floorGroup = new THREE.Group();
    scene.add(floorGroup);

    // Real-time planar mirror reflector beneath a semi-transparent polished marble layer
    const floorMirror = new Reflector(new THREE.PlaneGeometry(90, 42), {
      clipBias: 0.003,
      textureWidth: Math.floor(window.innerWidth * 0.75),
      textureHeight: Math.floor(window.innerHeight * 0.75),
      color: 0x8899aa
    });
    floorMirror.rotation.x = -Math.PI / 2;
    floorMirror.position.set(0, -0.002, 2);
    floorGroup.add(floorMirror);

    const polishedMarbleDeck = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 42),
      new THREE.MeshPhysicalMaterial({
        map: marbleSlabTex,
        color: 0x2a323e,
        roughness: 0.16,
        metalness: 0.25,
        clearcoat: 1.0,
        clearcoatRoughness: 0.08,
        transparent: true,
        opacity: 0.76
      })
    );
    polishedMarbleDeck.rotation.x = -Math.PI / 2;
    polishedMarbleDeck.position.set(0, 0.001, 2);
    polishedMarbleDeck.receiveShadow = true;
    floorGroup.add(polishedMarbleDeck);

    // 24K Gold Ceremonial Stage Inlay Rings around the Cauldron Base
    const goldInlayMat = new THREE.MeshStandardMaterial({
      color: 0xf0c265,
      metalness: 0.96,
      roughness: 0.16
    });
    [2.65, 3.85].forEach(radius => {
      const ring = new THREE.Mesh(new THREE.RingGeometry(radius - 0.035, radius + 0.035, 96), goldInlayMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(0, 0.004, 0);
      floorGroup.add(ring);
    });

    // =========================================================================
    // 4. TRUE 3D GRAND OLYMPIC STADIUM ARCHITECTURE
    // =========================================================================
    const stadiumGroup = new THREE.Group();
    scene.add(stadiumGroup);

    // A. Sweeping Grand Ceremonial Staircase with Warm Architectural LED Step Lighting
    const stairBodyMat = new THREE.MeshStandardMaterial({
      color: 0x141d2b,
      roughness: 0.35,
      metalness: 0.35
    });
    const stairTrimMat = new THREE.MeshStandardMaterial({
      color: 0xd9ad5b,
      metalness: 0.9,
      roughness: 0.22
    });
    const stepLedMat = new THREE.MeshBasicMaterial({ color: 0xffe4b5 });

    const numSteps = 18;
    for (let s = 0; s < numSteps; s++) {
      const stepH = 0.22;
      const stepD = 0.44;
      const stepW = 54 - s * 0.25;
      const zPos = -8.8 - s * stepD;
      const yTop = (s + 1) * stepH;

      const stepMesh = new THREE.Mesh(new THREE.BoxGeometry(stepW, stepH, stepD), stairBodyMat);
      stepMesh.position.set(2.5, yTop - stepH / 2, zPos);
      stepMesh.receiveShadow = true;
      stadiumGroup.add(stepMesh);

      // Gold metallic stair nosing + warm concealed step light strip
      const trim = new THREE.Mesh(new THREE.BoxGeometry(stepW, 0.022, 0.03), stairTrimMat);
      trim.position.set(2.5, yTop, zPos + stepD / 2);
      stadiumGroup.add(trim);

      const led = new THREE.Mesh(new THREE.BoxGeometry(stepW * 0.96, 0.012, 0.015), stepLedMat);
      led.position.set(2.5, yTop - 0.025, zPos + stepD / 2 + 0.005);
      stadiumGroup.add(led);
    }

    // B. Fluted Architectural Marble & Bronze Colonnade Piers Flanking the Grand Stairs
    const columnMarbleMat = new THREE.MeshStandardMaterial({
      map: marbleSlabTex,
      color: 0x566475,
      roughness: 0.28,
      metalness: 0.2
    });
    [
      { x: -15.5, y: 2.2, z: -10.5, w: 2.4, h: 4.4, d: 1.8 },
      { x: -10.5, y: 3.4, z: -13.0, w: 2.6, h: 6.8, d: 2.0 },
      { x: -5.8, y: 4.6, z: -15.5, w: 2.8, h: 9.2, d: 2.2 },
      { x: 14.5, y: 3.6, z: -13.5, w: 2.8, h: 7.2, d: 2.2 }
    ].forEach(p => {
      const pier = new THREE.Mesh(new THREE.BoxGeometry(p.w, p.h, p.d), columnMarbleMat);
      pier.position.set(p.x, p.y, p.z);
      stadiumGroup.add(pier);

      const cap = new THREE.Mesh(new THREE.BoxGeometry(p.w + 0.24, 0.16, p.d + 0.24), goldInlayMat);
      cap.position.set(p.x, p.y + p.h / 2 + 0.08, p.z);
      stadiumGroup.add(cap);
    });

    // C. Curved 3D Stadium Bowl Tiers & Twinkling Audience Lights (InstancedMesh for 1,200 crisp lights)
    const stadiumShell = new THREE.Mesh(
      new THREE.CylinderGeometry(48, 36, 26, 64, 1, true, Math.PI * 0.65, Math.PI * 0.7),
      new THREE.MeshStandardMaterial({
        color: 0x0a101b,
        roughness: 0.7,
        metalness: 0.2,
        side: THREE.BackSide
      })
    );
    stadiumShell.position.set(0, 11.5, -4);
    stadiumGroup.add(stadiumShell);

    const crowdCount = 1100;
    const crowdGeom = new THREE.SphereGeometry(0.065, 6, 6);
    const crowdMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const crowdInstances = new THREE.InstancedMesh(crowdGeom, crowdMat, crowdCount);
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();

    for (let i = 0; i < crowdCount; i++) {
      // Place lights across the curved stadium amphitheater tiers
      const angle = THREE.MathUtils.lerp(-Math.PI * 0.34, Math.PI * 0.34, Math.random());
      const tier = Math.random();
      const radius = 34 + tier * 11;
      const y = 3.2 + tier * 11.5 + (Math.random() - 0.5) * 0.35;
      const x = Math.sin(angle) * radius;
      const z = -Math.cos(angle) * radius - 4;

      dummy.position.set(x, y, z);
      const s = 0.6 + Math.random() * 1.1;
      dummy.scale.set(s, s, s);
      dummy.updateMatrix();
      crowdInstances.setMatrixAt(i, dummy.matrix);

      // Warm gold & cool starlight audience flashes
      if (Math.random() > 0.38) {
        color.setHSL(0.11 + Math.random() * 0.04, 0.85, 0.72 + Math.random() * 0.25);
      } else {
        color.setHSL(0.56 + Math.random() * 0.05, 0.80, 0.78 + Math.random() * 0.2);
      }
      crowdInstances.setColorAt(i, color);
    }
    crowdInstances.instanceMatrix.needsUpdate = true;
    if (crowdInstances.instanceColor) crowdInstances.instanceColor.needsUpdate = true;
    stadiumGroup.add(crowdInstances);

    // D. Overhead 3D Steel Lighting Catwalk Truss & Spotlight Housings
    const trussMat = new THREE.MeshStandardMaterial({ color: 0x1a222f, metalness: 0.85, roughness: 0.3 });
    const trussBeam = new THREE.Mesh(new THREE.BoxGeometry(56, 0.45, 0.6), trussMat);
    trussBeam.position.set(0, 15.2, -24);
    stadiumGroup.add(trussBeam);

    // --- Post-Processing Bloom ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.66,
      0.48,
      0.83
    );
    composer.addPass(bloomPass);

    // =========================================================================
    // 5. MUSEUM-GRADE CAST BRONZE, BRUSHED TITANIUM & LACQUERED CAULDRON
    // =========================================================================
    const cauldronGroup = new THREE.Group();
    scene.add(cauldronGroup);

    // High-Class Physical Materials
    const hammeredCopperMat = new THREE.MeshPhysicalMaterial({
      color: 0x69130b,
      metalness: 0.90,
      roughness: 0.26,
      roughnessMap: brushedRoughness,
      normalMap: brushedNormal,
      normalScale: new THREE.Vector2(0.35, 0.35),
      clearcoat: 0.45,
      clearcoatRoughness: 0.22,
      side: THREE.DoubleSide
    });

    const champagneGoldMat = new THREE.MeshPhysicalMaterial({
      color: 0xebc067,
      metalness: 0.96,
      roughness: 0.16,
      roughnessMap: brushedRoughness,
      normalMap: brushedNormal,
      normalScale: new THREE.Vector2(0.2, 0.2),
      clearcoat: 0.3
    });

    const castBronzeBaseMat = new THREE.MeshPhysicalMaterial({
      color: 0xc88d50,
      metalness: 0.92,
      roughness: 0.22,
      roughnessMap: brushedRoughness,
      normalMap: brushedNormal,
      normalScale: new THREE.Vector2(0.25, 0.25)
    });

    const brushedTitaniumMat = new THREE.MeshPhysicalMaterial({
      color: 0x454b54,
      metalness: 0.88,
      roughness: 0.26,
      roughnessMap: brushedRoughness,
      normalMap: brushedNormal,
      normalScale: new THREE.Vector2(0.3, 0.3)
    });

    // Deep Piano-Lacquer Vermilion Shield (Clean solid surface, no text or logo)
    const lacquerCrimsonMat = new THREE.MeshPhysicalMaterial({
      color: 0xbf1713,
      metalness: 0.08,
      roughness: 0.24,
      clearcoat: 0.92,
      clearcoatRoughness: 0.12
    });

    // 1. Stepped Circular Cast-Bronze Pedestal Base with Champagne-Gold Moulding
    const baseLowerDisc = new THREE.Mesh(new THREE.CylinderGeometry(2.08, 2.16, 0.14, 72), castBronzeBaseMat);
    baseLowerDisc.position.set(0, 0.07, 0);
    baseLowerDisc.castShadow = true;
    baseLowerDisc.receiveShadow = true;
    cauldronGroup.add(baseLowerDisc);

    const baseUpperDisc = new THREE.Mesh(new THREE.CylinderGeometry(1.94, 2.02, 0.12, 72), castBronzeBaseMat);
    baseUpperDisc.position.set(0, 0.20, 0);
    baseUpperDisc.castShadow = true;
    cauldronGroup.add(baseUpperDisc);

    const baseGoldRing = new THREE.Mesh(new THREE.TorusGeometry(2.04, 0.032, 16, 80), champagneGoldMat);
    baseGoldRing.rotation.x = Math.PI / 2;
    baseGoldRing.position.set(0, 0.15, 0);
    cauldronGroup.add(baseGoldRing);

    // 2. Four Chamfered Brushed-Titanium Tower Pillars with Gold Edge Bevels
    function createLuxuryPillar(xPos, zPos, mirrorX, mirrorZ) {
      const group = new THREE.Group();

      const shape = new THREE.Shape();
      shape.moveTo(-0.28, 0);
      shape.lineTo(0.28, 0);
      shape.lineTo(0.46, 3.64);
      shape.lineTo(-0.26, 3.64);
      shape.closePath();

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.56,
        bevelEnabled: true,
        bevelThickness: 0.032,
        bevelSize: 0.032,
        bevelSegments: 4
      });
      geom.center();

      const mesh = new THREE.Mesh(geom, brushedTitaniumMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);

      // Precision champagne-gold architectural inlay strip along outer edge
      const inlay = new THREE.Mesh(new THREE.BoxGeometry(0.036, 3.60, 0.62), champagneGoldMat);
      inlay.position.set(0.36, 0, 0);
      inlay.rotation.z = -0.048;
      group.add(inlay);

      group.position.set(xPos, 2.08, zPos);
      group.scale.set(mirrorX, 1, mirrorZ);
      group.rotation.y = mirrorX * mirrorZ * -0.18;
      return group;
    }

    cauldronGroup.add(createLuxuryPillar(-1.38, 0.58, -1, 1));
    cauldronGroup.add(createLuxuryPillar(1.38, 0.58, 1, 1));
    cauldronGroup.add(createLuxuryPillar(-1.18, -0.68, -1, -1));
    cauldronGroup.add(createLuxuryPillar(1.18, -0.68, 1, -1));

    // Warm copper-amber architectural uplight on the pedestal base & lower pillars
    const baseWarmGlow = new THREE.PointLight(0xff7b29, 24, 9.5, 1.5);
    baseWarmGlow.position.set(0, 0.95, 1.85);
    cauldronGroup.add(baseWarmGlow);

    // 3. Exposed Precision-Machined Gold Burner Manifold Under the Bowl
    const burnerCore = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.46, 0.72, 32), champagneGoldMat);
    burnerCore.position.set(0, 3.72, 0);
    cauldronGroup.add(burnerCore);

    [3.52, 3.76].forEach(ry => {
      const collar = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.034, 14, 36), champagneGoldMat);
      collar.rotation.x = Math.PI / 2;
      collar.position.set(0, ry, 0);
      cauldronGroup.add(collar);
    });

    [-0.30, -0.10, 0.10, 0.30].forEach(px => {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.82, 14), champagneGoldMat);
      pipe.position.set(px, 3.70, 0.46);
      cauldronGroup.add(pipe);
    });

    // 4. Clean Piano-Lacquer Vermilion-Red Trapezoidal Shield (No text or emblem)
    const shieldShape = new THREE.Shape();
    shieldShape.moveTo(-0.88, -1.24);
    shieldShape.lineTo(0.88, -1.24);
    shieldShape.lineTo(1.12, 1.24);
    shieldShape.lineTo(-1.12, 1.24);
    shieldShape.closePath();

    const shieldGeom = new THREE.ExtrudeGeometry(shieldShape, {
      depth: 0.14,
      bevelEnabled: true,
      bevelThickness: 0.018,
      bevelSize: 0.018,
      bevelSegments: 3
    });
    shieldGeom.center();

    const plaqueMesh = new THREE.Mesh(shieldGeom, lacquerCrimsonMat);
    plaqueMesh.position.set(0, 2.28, 0.66);
    plaqueMesh.castShadow = true;
    plaqueMesh.receiveShadow = true;
    cauldronGroup.add(plaqueMesh);

    // 5. Wide Flared Bowl Shell + High-Relief 3D Champagne-Gold Cloud Filigree
    const bowlPoints = [
      new THREE.Vector2(0.0, 0.0),
      new THREE.Vector2(1.45, 0.04),
      new THREE.Vector2(2.85, 0.26),
      new THREE.Vector2(3.98, 0.68),
      new THREE.Vector2(4.56, 1.08),
      new THREE.Vector2(4.38, 1.10),
      new THREE.Vector2(3.60, 0.72),
      new THREE.Vector2(0.0, 0.48)
    ];
    const bowlGeom = new THREE.LatheGeometry(bowlPoints, 112);
    const bowlMesh = new THREE.Mesh(bowlGeom, hammeredCopperMat);
    bowlMesh.position.set(0, 3.80, 0);
    bowlMesh.castShadow = true;
    bowlMesh.receiveShadow = true;
    cauldronGroup.add(bowlMesh);

    const filigreeGroup = new THREE.Group();
    filigreeGroup.position.set(0, 3.80, 0);
    cauldronGroup.add(filigreeGroup);

    // Double chamfered champagne-gold lip rings
    const topRimOuter = new THREE.Mesh(new THREE.TorusGeometry(4.50, 0.052, 18, 128), champagneGoldMat);
    topRimOuter.rotation.x = Math.PI / 2;
    topRimOuter.position.y = 1.06;
    filigreeGroup.add(topRimOuter);

    const topRimInner = new THREE.Mesh(new THREE.TorusGeometry(4.34, 0.032, 14, 128), champagneGoldMat);
    topRimInner.rotation.x = Math.PI / 2;
    topRimInner.position.y = 1.09;
    filigreeGroup.add(topRimInner);

    const midRib = new THREE.Mesh(new THREE.TorusGeometry(3.68, 0.03, 12, 108), champagneGoldMat);
    midRib.rotation.x = Math.PI / 2;
    midRib.position.y = 0.56;
    filigreeGroup.add(midRib);

    const lowRim = new THREE.Mesh(new THREE.TorusGeometry(2.42, 0.038, 12, 96), champagneGoldMat);
    lowRim.rotation.x = Math.PI / 2;
    lowRim.position.y = 0.19;
    filigreeGroup.add(lowRim);

    function bowlSurfacePoint(theta, t, relief = 0.048) {
      const r = 1.45 + t * 3.12 + relief;
      const y = 0.04 + Math.pow(t, 1.48) * 1.02;
      return new THREE.Vector3(Math.sin(theta) * r, y, Math.cos(theta) * r);
    }

    const numSpirals = 24;
    for (let i = 0; i < numSpirals; i++) {
      const baseTheta = (i / numSpirals) * Math.PI * 2;
      const dir = i % 2 === 0 ? 1 : -1;

      const ptsUpper = [];
      const turns = 2.15;
      const steps = 44;
      for (let s = 0; s <= steps; s++) {
        const frac = s / steps;
        const angle = frac * Math.PI * 2 * turns;
        const spiralRad = frac * 0.115;
        const theta = baseTheta + Math.cos(angle) * spiralRad * dir;
        const t = 0.68 + Math.sin(angle) * 0.24 * frac;
        ptsUpper.push(bowlSurfacePoint(theta, Math.max(0.15, Math.min(0.96, t)), 0.048));
      }
      const upperCurve = new THREE.CatmullRomCurve3(ptsUpper);
      filigreeGroup.add(new THREE.Mesh(
        new THREE.TubeGeometry(upperCurve, 38, 0.034, 10, false),
        champagneGoldMat
      ));

      const ptsLower = [];
      const lowBaseTheta = baseTheta + (Math.PI / numSpirals);
      for (let s = 0; s <= 34; s++) {
        const frac = s / 34;
        const angle = frac * Math.PI * 2 * 1.85;
        const spiralRad = frac * 0.085;
        const theta = lowBaseTheta - Math.cos(angle) * spiralRad * dir;
        const t = 0.34 + Math.sin(angle) * 0.17 * frac;
        ptsLower.push(bowlSurfacePoint(theta, Math.max(0.10, Math.min(0.62, t)), 0.044));
      }
      const lowerCurve = new THREE.CatmullRomCurve3(ptsLower);
      filigreeGroup.add(new THREE.Mesh(
        new THREE.TubeGeometry(lowerCurve, 30, 0.027, 10, false),
        champagneGoldMat
      ));
    }

    // =========================================================================
    // 6. VOLUMETRIC STADIUM SEARCHLIGHTS & DRAMATIC CEREMONIAL LIGHTING
    // =========================================================================
    const beamMeshes = [];
    const fixtureMat = new THREE.MeshBasicMaterial({ color: 0xf4fcff });

    function createSearchlight(x, y, z, targetX, targetY, targetZ, beamRadius, beamLength, opacity, showLamp = true) {
      if (showLamp) {
        const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), fixtureMat);
        lamp.position.set(x, y, z);
        scene.add(lamp);
      }

      const coneGeom = new THREE.ConeGeometry(beamRadius, beamLength, 36, 1, true);
      coneGeom.translate(0, -beamLength / 2, 0);
      const coneMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        uniforms: {
          uColor: { value: new THREE.Color(0xc2ebff) },
          uOpacity: { value: opacity }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mvPos.xyz;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vec3 viewDir = normalize(vViewPos);
            float edgeFade = pow(abs(dot(vNormal, viewDir)), 1.75);
            float verticalFade = smoothstep(0.0, 0.78, vUv.y) * smoothstep(1.0, 0.88, vUv.y);
            gl_FragColor = vec4(uColor, edgeFade * verticalFade * uOpacity);
          }
        `
      });
      const cone = new THREE.Mesh(coneGeom, coneMat);
      cone.position.set(x, y, z);
      cone.lookAt(targetX, targetY, targetZ);
      cone.rotateX(Math.PI / 2);
      scene.add(cone);
      beamMeshes.push({ cone, baseRotZ: cone.rotation.z, phase: Math.random() * Math.PI * 2 });
    }

    // Overhead truss searchlights sweeping across the arena
    createSearchlight(-19.5, 14.8, -23.5, -11.5, 1.0, -14, 2.5, 24, 0.14);
    createSearchlight(-17.2, 14.8, -23.5, -7.2, 1.5, -12, 2.3, 24, 0.14);
    createSearchlight(-11.5, 14.8, -23.5, -17.5, 1.2, -14, 2.3, 23, 0.13);
    createSearchlight(-9.2, 14.8, -23.5, -3.2, 2.0, -10, 2.6, 24, 0.13);

    createSearchlight(2.0, 14.8, -23.5, -6.5, 1.0, -10, 3.1, 25, 0.15);
    createSearchlight(7.5, 14.8, -23.5, -1.2, 1.5, -8, 2.9, 25, 0.16);
    createSearchlight(11.0, 14.8, -23.5, 2.4, 1.8, -6, 2.9, 25, 0.16);
    createSearchlight(13.8, 14.8, -23.5, 6.2, 1.2, -6, 2.7, 25, 0.15);
    createSearchlight(16.6, 14.8, -23.5, 10.2, 1.0, -8, 2.7, 25, 0.14);
    createSearchlight(19.4, 14.8, -23.5, 14.5, 1.0, -10, 2.7, 25, 0.14);

    // Floor & mid-tier crossing beams
    createSearchlight(-16.0, 0.4, -14, -7.8, 13.5, -21, 2.2, 21, 0.16);
    createSearchlight(-12.2, 0.4, -14, -18.5, 12.5, -21, 2.1, 20, 0.15);
    createSearchlight(10.0, 3.6, -11, 1.5, 6.4, -4, 2.1, 15, 0.16);
    createSearchlight(18.0, 4.4, -12, 8.8, 2.2, -6, 2.3, 16, 0.16);

    // Key, Rim & Fill Lighting
    const hemiLight = new THREE.HemisphereLight(0xdceeff, 0x3b322e, 1.15);
    scene.add(hemiLight);

    const frontKeyLight = new THREE.DirectionalLight(0xfff5e8, 2.35);
    frontKeyLight.position.set(4.5, 11.0, 12.5);
    frontKeyLight.castShadow = true;
    scene.add(frontKeyLight);

    const leftRimLight = new THREE.DirectionalLight(0xc2e6ff, 1.35);
    leftRimLight.position.set(-10, 9, 4);
    scene.add(leftRimLight);

    const stageSpot = new THREE.SpotLight(0xe0f4ff, 65, 38, Math.PI / 4.8, 0.65, 1.0);
    stageSpot.position.set(5.5, 12, 6);
    stageSpot.target.position.set(0, 0, 0);
    scene.add(stageSpot);
    scene.add(stageSpot.target);

    const fireLight = new THREE.PointLight(0xff8a1c, 0, 30, 1.2);
    fireLight.position.set(0, 6.1, 0.9);
    scene.add(fireLight);

    // =========================================================================
    // 7. PHOTOREALISTIC MULTI-LAYERED OLYMPIC FLAME SHADER
    // =========================================================================
    const fireUniforms = {
      uTime: { value: 0 },
      uHeat: { value: 0 }
    };

    const fireMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: fireUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uHeat;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.52;
          for (int i = 0; i < 6; i++) {
            v += a * noise(p);
            p *= 2.12;
            a *= 0.49;
          }
          return v;
        }

        void main() {
          if (uHeat <= 0.005) discard;

          vec2 uv = vUv;
          float nx = (uv.x - 0.5) * 2.0;
          float ny = uv.y;

          float maxH = mix(0.10, 0.98, uHeat);
          float hNorm = ny / maxH;
          if (hNorm > 1.05) discard;

          float widthAtHeight = mix(mix(0.28, 0.82, sqrt(uHeat)), 0.14, pow(clamp(hNorm, 0.0, 1.0), 0.9));

          vec2 warpUv = vec2(nx * 4.6, ny * 3.2 - uTime * 3.8);
          float warp = fbm(warpUv);
          vec2 detailUv = vec2((nx + (warp - 0.5) * 0.42) * 6.8, ny * 4.8 - uTime * 4.9);
          float tongues = fbm(detailUv);

          float bowlEnvelope = smoothstep(widthAtHeight, widthAtHeight * 0.18, abs(nx + (warp - 0.5) * 0.22 * hNorm));
          float heightCarve = tongues * 1.22 - pow(hNorm, 0.76) * 0.90;

          float baseBed = smoothstep(0.16, 0.0, ny) * smoothstep(0.84, 0.25, abs(nx)) * 0.88;
          float flameBody = smoothstep(0.03, 0.34, heightCarve) * bowlEnvelope * smoothstep(0.0, 0.05, ny);

          float intensity = max(baseBed, flameBody) * smoothstep(0.0, 0.10, uHeat);
          if (intensity <= 0.01) discard;

          vec3 col = mix(vec3(0.95, 0.30, 0.02), vec3(1.0, 0.68, 0.12), smoothstep(0.12, 0.44, intensity));
          col = mix(col, vec3(1.0, 0.93, 0.48), smoothstep(0.42, 0.70, intensity));
          col = mix(col, vec3(1.0, 0.99, 0.95), smoothstep(0.68, 0.94, intensity));

          gl_FragColor = vec4(col * 1.42, clamp(intensity * 1.35, 0.0, 1.0));
        }
      `
    });

    const firePlaneGeom = new THREE.PlaneGeometry(8.2, 6.2);
    const firePlane1 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane1.position.set(0, 7.80, 0.10);
    cauldronGroup.add(firePlane1);

    const firePlane2 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane2.position.set(0, 7.80, -0.05);
    firePlane2.rotation.y = 0.24;
    firePlane2.scale.x = -1;
    cauldronGroup.add(firePlane2);

    const firePlane3 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane3.position.set(0, 7.80, 0.0);
    firePlane3.rotation.y = -0.24;
    cauldronGroup.add(firePlane3);

    // --- 3D Rising Sparks ---
    const sparkCount = 260;
    const sparkGeom = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    const sparkVel = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] = (Math.random() - 0.5) * 6.5;
      sparkPos[i * 3 + 1] = 4.8 + Math.random() * 5.8;
      sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
      sparkVel.push({
        vx: (Math.random() - 0.5) * 0.032,
        vy: 0.035 + Math.random() * 0.075,
        vz: (Math.random() - 0.5) * 0.02
      });
    }
    sparkGeom.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));

    const sparkMat = new THREE.PointsMaterial({
      color: 0xffd973,
      size: 0.085,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparkPoints = new THREE.Points(sparkGeom, sparkMat);
    cauldronGroup.add(sparkPoints);

    // --- Responsive Framing: Cauldron = 1/2 Screen Height, >= 1/2 Screen Width ---
    function updateFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);

      const dist = camera.position.z;
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeightAtZero = 2 * Math.tan(vFovRad / 2) * dist;
      const visibleWidthAtZero = visibleHeightAtZero * camera.aspect;

      const scaleY = (visibleHeightAtZero * 0.50) / 4.90;
      const scaleX = Math.max(scaleY, (visibleWidthAtZero * 0.56) / 9.12);

      cauldronGroup.scale.set(scaleX, scaleY, scaleY);
      const baseY = 3.35 - (visibleHeightAtZero * 0.45);
      cauldronGroup.position.y = baseY;
      floorGroup.position.y = baseY;
      stadiumGroup.position.y = baseY;
    }
    window.addEventListener('resize', updateFraming);
    updateFraming();

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      heatValue += (targetHeat - heatValue) * 0.05;
      const heatNorm = heatValue / 100;

      if (heatValue >= 95) {
        sloganBanner.classList.add('visible');
      } else {
        sloganBanner.classList.remove('visible');
      }

      fireUniforms.uTime.value = elapsed;
      fireUniforms.uHeat.value = heatNorm;

      const flicker = Math.sin(elapsed * 21.0) * 0.14 + Math.cos(elapsed * 33.0) * 0.09;
      fireLight.intensity = heatNorm > 0.01 ? (heatNorm * 52 + flicker * 9 * heatNorm) : 0;

      sparkMat.opacity = Math.min(0.95, heatNorm * 1.15);
      const posArr = sparkGeom.attributes.position.array;
      const spread = 3.6 * Math.sqrt(Math.max(0.05, heatNorm));
      const maxSparkY = 4.90 + heatNorm * 6.0;

      for (let i = 0; i < sparkCount; i++) {
        posArr[i * 3] += sparkVel[i].vx + Math.sin(elapsed * 3 + i) * 0.008;
        posArr[i * 3 + 1] += sparkVel[i].vy * (0.4 + heatNorm * 0.9);
        posArr[i * 3 + 2] += sparkVel[i].vz;

        if (posArr[i * 3 + 1] > maxSparkY || heatNorm < 0.02) {
          posArr[i * 3] = (Math.random() - 0.5) * 2 * spread;
          posArr[i * 3 + 1] = 4.75 + Math.random() * 0.3;
          posArr[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
        }
      }
      sparkGeom.attributes.position.needsUpdate = true;

      beamMeshes.forEach((b) => {
        b.cone.rotation.z = b.baseRotZ + Math.sin(elapsed * 0.35 + b.phase) * 0.025;
      });

      composer.render();
    }

    animate();
  </script>
