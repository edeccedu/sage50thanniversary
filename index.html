<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - 50th Anniversary Olympic Ceremonial Cauldron</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0e141f;
      color: #fff;
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', 'PingFang HK', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Grand Ceremonial Slogan Reveal Overlay */
    .banner-container {
      position: fixed;
      top: 4.5vh;
      left: 0;
      width: 100%;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5vw;
      opacity: 0;
      transform: translateY(-28px) scale(0.94);
      transition: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .banner-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .laurel {
      height: 14.5vh;
      min-height: 92px;
      filter: drop-shadow(0 0 18px rgba(255, 200, 60, 0.85));
    }

    .slogan-plaque {
      background: linear-gradient(180deg, rgba(35, 8, 10, 0.88) 0%, rgba(16, 4, 6, 0.92) 100%);
      border-top: 2.5px solid rgba(255, 222, 115, 0.9);
      border-bottom: 2.5px solid rgba(255, 222, 115, 0.9);
      padding: 1.6vh 4vw;
      box-shadow: 0 14px 45px rgba(0, 0, 0, 0.75), inset 0 0 30px rgba(255, 195, 60, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slogan-title {
      font-size: 4.8vh;
      font-weight: 900;
      letter-spacing: 0.36em;
      margin-right: -0.36em;
      background: linear-gradient(180deg, #ffffff 0%, #ffe885 45%, #d69c24 85%, #fff5c2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(255, 180, 0, 0.9));
      line-height: 1.32;
    }

    #setup-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(14, 20, 32, 0.92);
      border: 1px solid rgba(255, 215, 0, 0.55);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    #setup-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="setup-badge">
    <div>Press <b>F</b> for Fullscreen &bull; Press <b>H</b> to hide/show this box</div>
    <div>Backstage Control: <b>/backstage.html</b> &bull; Remote Sync ID: <b id="peer-id-display" style="color:#fff;">Loading...</b></div>
  </div>

  <div id="webgl-container"></div>

  <!-- Ceremonial Slogan Reveal -->
  <div class="banner-container" id="ceremony-slogan">
    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>

    <div class="slogan-plaque">
      <h1 class="slogan-title">五十載耆康安老</h1>
      <h1 class="slogan-title">以初心關顧同行</h1>
    </div>

    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let heatValue = 0;
    let targetHeat = 0;

    const sloganBanner = document.getElementById('ceremony-slogan');
    const setupBadge = document.getElementById('setup-badge');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setupBadge.classList.add('hidden');
      }
      if (e.key === 'h' || e.key === 'H') {
        setupBadge.classList.toggle('hidden');
      }
    });

    function handleCommand(data) {
      if (typeof data.heat === 'number') {
        targetHeat = Math.max(0, Math.min(100, data.heat));
      }
      if (data.hideBadge) setupBadge.classList.add('hidden');
    }

    try {
      const channel = new BroadcastChannel('cauldron_ceremony_sync');
      channel.onmessage = (event) => handleCommand(event.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'cauldron_state' && e.newValue) {
        handleCommand(JSON.parse(e.newValue));
      }
    });

    try {
      if (typeof Peer !== 'undefined') {
        const roomCode = 'cauldron-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomCode);
        peer.on('open', (id) => {
          document.getElementById('peer-id-display').textContent = id.replace('cauldron-', '');
        });
        peer.on('connection', (conn) => {
          setupBadge.classList.add('hidden');
          conn.on('data', (data) => handleCommand(data));
        });
        peer.on('error', () => {
          document.getElementById('peer-id-display').textContent = 'Local Mode';
        });
      }
    } catch (err) {
      document.getElementById('peer-id-display').textContent = 'Local Mode';
    }

    // --- Three.js Scene, Camera & Renderer ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 140);
    camera.position.set(0, 3.6, 15.2);
    camera.lookAt(0, 3.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- Reflection Environment Map (Matches Cool Cyan Spotlights + Warm Amber Canopy) ---
    function buildArenaEnvironment() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();

      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(40, 32, 16),
        new THREE.MeshBasicMaterial({ color: 0x262c3a, side: THREE.BackSide })
      );
      envScene.add(dome);

      // Cool cyan-white stadium lights & warm amber canopy glow for realistic metallic reflections
      const panels = [
        { pos: [-14, 16, 12], color: 0xd8f3ff, size: [9, 5] },
        { pos: [14, 16, 12], color: 0xd8f3ff, size: [9, 5] },
        { pos: [0, 22, 8], color: 0xffe4c4, size: [14, 6] },
        { pos: [-16, 8, 8], color: 0xff9b54, size: [6, 12] },
        { pos: [16, 8, 8], color: 0xff9b54, size: [6, 12] }
      ];
      panels.forEach(p => {
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(p.size[0], p.size[1]),
          new THREE.MeshBasicMaterial({ color: p.color })
        );
        panel.position.set(...p.pos);
        panel.lookAt(0, 3, 0);
        envScene.add(panel);
      });

      const envRT = pmrem.fromScene(envScene, 0.04);
      scene.environment = envRT.texture;
      pmrem.dispose();
    }
    buildArenaEnvironment();

    // --- Stadium Backdrop Replicating Reference Image ---
    // 1. Warm Terracotta-Amber Upper Stadium Roof Canopy & Deep Navy-Slate Arena Wall
    function createStadiumBackdropTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext('2d');

      // Warm brownish-terracotta upper roof canopy (top ~30%)
      const roofGrad = ctx.createLinearGradient(0, 0, 0, 175);
      roofGrad.addColorStop(0.0, '#4a2518');
      roofGrad.addColorStop(0.65, '#3b1d14');
      roofGrad.addColorStop(1.0, '#141923');
      ctx.fillStyle = roofGrad;
      ctx.fillRect(0, 0, 1024, 175);

      // Subtle diagonal architectural roof ribs
      ctx.strokeStyle = 'rgba(255, 195, 145, 0.07)';
      ctx.lineWidth = 3;
      for (let x = -200; x < 1224; x += 48) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 90, 165);
        ctx.stroke();
      }

      // Deep Navy-Slate Upper Arena Wall & Tiered Seating Backdrop
      const wallGrad = ctx.createLinearGradient(0, 165, 0, 512);
      wallGrad.addColorStop(0.0, '#101622');
      wallGrad.addColorStop(0.45, '#162030');
      wallGrad.addColorStop(1.0, '#1d2838');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 165, 1024, 347);

      // Soft blue ambient stage wash behind the cauldron
      const blueWash = ctx.createRadialGradient(512, 340, 30, 512, 340, 420);
      blueWash.addColorStop(0, 'rgba(90, 145, 195, 0.24)');
      blueWash.addColorStop(1, 'rgba(16, 22, 34, 0)');
      ctx.fillStyle = blueWash;
      ctx.fillRect(0, 165, 1024, 347);

      // Horizontal Tiered Stadium Seating Steps (matching the horizontal step lines in the photo)
      for (let y = 265; y <= 495; y += 16) {
        ctx.fillStyle = 'rgba(10, 15, 24, 0.55)';
        ctx.fillRect(0, y, 1024, 4);
        ctx.fillStyle = 'rgba(130, 165, 200, 0.14)';
        ctx.fillRect(0, y + 4, 1024, 2);
      }

      // Faint blue arena indicator dots along the upper tier
      for (let i = 0; i < 45; i++) {
        const dx = 180 + Math.random() * 664;
        const dy = 215 + Math.random() * 55;
        ctx.fillStyle = 'rgba(120, 190, 255, 0.35)';
        ctx.beginPath();
        ctx.arc(dx, dy, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const backdropPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(52, 27),
      new THREE.MeshBasicMaterial({ map: createStadiumBackdropTexture() })
    );
    backdropPlane.position.set(0, 7.2, -14);
    scene.add(backdropPlane);

    // 2. Cool Light-Grey Arena Floor (matching the floor in the photo)
    const arenaFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 28),
      new THREE.MeshStandardMaterial({
        color: 0x7d8a96,
        roughness: 0.65,
        metalness: 0.15
      })
    );
    arenaFloor.rotation.x = -Math.PI / 2;
    arenaFloor.position.set(0, 0, -2);
    arenaFloor.receiveShadow = true;
    scene.add(arenaFloor);

    // --- Post-Processing Bloom ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.72, // bloom strength
      0.52, // radius
      0.80  // threshold
    );
    composer.addPass(bloomPass);

    // --- Procedural Textures Matching the Beijing Cauldron in the Photo ---
    // 1. Bowl Texture: Rich Metallic Red-Bronze with Dense Raised Gold Spiral Cloud Filigree
    function createBowlTextures() {
      const w = 2048, h = 512;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = w; colorCanvas.height = h;
      const cCtx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = w; bumpCanvas.height = h;
      const bCtx = bumpCanvas.getContext('2d');

      // Deep Copper-Crimson Metallic Base
      const grad = cCtx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#b82518');
      grad.addColorStop(0.5, '#9e1910');
      grad.addColorStop(1, '#6e0d08');
      cCtx.fillStyle = grad;
      cCtx.fillRect(0, 0, w, h);

      bCtx.fillStyle = '#303030';
      bCtx.fillRect(0, 0, w, h);

      // Thin Metallic Gold Rim Lip
      cCtx.fillStyle = '#f5c767';
      cCtx.fillRect(0, 0, w, 16);
      bCtx.fillStyle = '#ffffff';
      bCtx.fillRect(0, 0, w, 16);

      // Dense Interlocking Gold Spiral Scrolls Covering the Entire Bowl Surface (as seen in the photo)
      const cols = 18;
      const stepX = w / cols;

      function drawSpiralMotif(ctx, x, y, r, flip, isBump) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(flip, 1);
        ctx.strokeStyle = isBump ? '#ffffff' : '#f7cb68';
        ctx.lineCap = 'round';
        ctx.lineWidth = isBump ? 16 : 12;

        // Multi-turn tight spiral
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 4.2; a += 0.15) {
          const rad = (a / (Math.PI * 4.2)) * r;
          const px = Math.cos(a) * rad;
          const py = Math.sin(a) * rad;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Connecting S-curve scroll tail
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.bezierCurveTo(r * 1.25, -r * 0.55, r * 1.55, r * 0.55, r * 1.85, 0);
        ctx.stroke();
        ctx.restore();
      }

      for (let i = 0; i < cols; i++) {
        const cx = i * stepX + stepX * 0.5;
        // Upper primary row of large spirals
        drawSpiralMotif(cCtx, cx, h * 0.36, 48, i % 2 === 0 ? 1 : -1, false);
        drawSpiralMotif(bCtx, cx, h * 0.36, 48, i % 2 === 0 ? 1 : -1, true);

        // Lower secondary row of smaller spirals nested underneath
        drawSpiralMotif(cCtx, cx + stepX * 0.5, h * 0.74, 34, i % 2 === 0 ? -1 : 1, false);
        drawSpiralMotif(bCtx, cx + stepX * 0.5, h * 0.74, 34, i % 2 === 0 ? -1 : 1, true);
      }

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.wrapS = THREE.RepeatWrapping;
      colorTex.colorSpace = THREE.SRGBColorSpace;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.wrapS = THREE.RepeatWrapping;

      return { colorTex, bumpTex };
    }

    // 2. Clean Matte Vermilion-Red Trapezoidal Plaque Texture (Matching the photo's clean red shield)
    function createPlaqueTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Matte Beijing Vermilion Red
      const grad = ctx.createLinearGradient(0, 0, 0, 1024);
      grad.addColorStop(0, '#cc1b18');
      grad.addColorStop(0.5, '#ba1614');
      grad.addColorStop(1, '#9c110f');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 1024);

      // Subtle dark vertical emblem seal in the upper-center (matching the photo's dark emblem placement)
      ctx.fillStyle = 'rgba(35, 8, 8, 0.78)';
      ctx.beginPath();
      ctx.roundRect(196, 135, 120, 155, 18);
      ctx.fill();

      ctx.fillStyle = '#f5d58c';
      ctx.font = 'bold 64px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('50', 256, 232);

      // Clean dark-ink & gold-accented calligraphy beneath the seal
      ctx.fillStyle = 'rgba(35, 8, 8, 0.82)';
      ctx.font = 'bold 48px "Noto Serif TC", "Songti TC", "PingFang HK", serif';
      ctx.fillText('五十載', 256, 365);
      ctx.fillText('耆康安老', 256, 430);

      // Interlocking rings motif below the text (matching the rings on the red shield in the photo)
      ctx.strokeStyle = 'rgba(40, 10, 10, 0.65)';
      ctx.lineWidth = 5;
      [-76, -38, 0, 38, 76].forEach((rx, idx) => {
        ctx.beginPath();
        ctx.arc(256 + rx, idx % 2 === 0 ? 505 : 525, 22, 0, Math.PI * 2);
        ctx.stroke();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // --- Build Exact Beijing-Style Cauldron From Reference Image ---
    const cauldronGroup = new THREE.Group();
    scene.add(cauldronGroup);

    const { colorTex, bumpTex } = createBowlTextures();
    const bowlMat = new THREE.MeshStandardMaterial({
      map: colorTex,
      bumpMap: bumpTex,
      bumpScale: 0.11,
      metalness: 0.78,
      roughness: 0.25,
      side: THREE.DoubleSide
    });

    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xf5c453,
      metalness: 0.9,
      roughness: 0.22
    });

    // Dark Gunmetal-Slate Pillars (matches the tall angled grey-bronze pillars in the photo)
    const pillarMat = new THREE.MeshStandardMaterial({
      color: 0x3b4048,
      metalness: 0.72,
      roughness: 0.35
    });

    // 1. Two Tall Angled Pillars Resting Directly on the Grey Arena Floor (no extra step base)
    function createPillar(side) {
      const shape = new THREE.Shape();
      // Slightly wider at the top, tapering smoothly down to the floor just like the photo
      shape.moveTo(-0.36, 0);
      shape.lineTo(0.36, 0);
      shape.lineTo(0.54, 3.85);
      shape.lineTo(-0.32, 3.85);
      shape.closePath();

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.78,
        bevelEnabled: true,
        bevelThickness: 0.03,
        bevelSize: 0.03,
        bevelSegments: 2
      });
      geom.center();

      const mesh = new THREE.Mesh(geom, pillarMat);
      mesh.position.set(side * 1.48, 1.925, 0);
      mesh.scale.x = side;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }
    cauldronGroup.add(createPillar(-1));
    cauldronGroup.add(createPillar(1));

    // Warm orange-amber edge bounce light on the outer sides of the pillars (as seen in the photo)
    const leftEdgeLight = new THREE.PointLight(0xff7b29, 14, 9, 1.5);
    leftEdgeLight.position.set(-2.6, 1.8, 1.2);
    cauldronGroup.add(leftEdgeLight);

    const rightEdgeLight = new THREE.PointLight(0xff7b29, 14, 9, 1.5);
    rightEdgeLight.position.set(2.6, 1.8, 1.2);
    cauldronGroup.add(rightEdgeLight);

    // 2. Exposed Golden Mechanical Burner Core Between the Shield and the Bowl
    const neckCylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.46, 0.72, 24), goldMat);
    neckCylinder.position.set(0, 3.68, 0);
    cauldronGroup.add(neckCylinder);

    [-0.32, -0.1, 0.1, 0.32].forEach(px => {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.82, 12), goldMat);
      pipe.position.set(px, 3.66, 0.46);
      cauldronGroup.add(pipe);
    });

    // 3. Clean Matte Vermilion-Red Trapezoidal Plaque Suspended Between the Pillars
    const plaqueTex = createPlaqueTexture();
    const plaqueMat = new THREE.MeshStandardMaterial({
      map: plaqueTex,
      metalness: 0.08,
      roughness: 0.58
    });

    const plaqueGeom = new THREE.CylinderGeometry(1.18, 0.90, 2.55, 4);
    plaqueGeom.rotateY(Math.PI / 4);
    plaqueGeom.scale(1.18, 1.0, 0.22);

    const posAttr = plaqueGeom.attributes.position;
    const uvAttr = plaqueGeom.attributes.uv;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const y = posAttr.getY(i);
      uvAttr.setXY(i, (x / 2.2) + 0.5, (y / 2.55) + 0.5);
    }

    const plaqueMesh = new THREE.Mesh(plaqueGeom, plaqueMat);
    plaqueMesh.position.set(0, 2.15, 0.38);
    plaqueMesh.castShadow = true;
    cauldronGroup.add(plaqueMesh);

    // 4. Wide Shallow Embossed Cloud-Scroll Bowl
    const bowlPoints = [
      new THREE.Vector2(0.0, 0.0),
      new THREE.Vector2(1.4, 0.04),
      new THREE.Vector2(2.75, 0.26),
      new THREE.Vector2(3.85, 0.68),
      new THREE.Vector2(4.42, 1.08),
      new THREE.Vector2(4.24, 1.10),
      new THREE.Vector2(3.50, 0.72),
      new THREE.Vector2(0.0, 0.48)
    ];
    const bowlGeom = new THREE.LatheGeometry(bowlPoints, 80);
    const bowlMesh = new THREE.Mesh(bowlGeom, bowlMat);
    bowlMesh.position.set(0, 3.76, 0);
    bowlMesh.castShadow = true;
    bowlMesh.receiveShadow = true;
    cauldronGroup.add(bowlMesh);

    // --- Stadium Floodlight Fixtures & Diagonal Cyan-White Beams (Matching the Photo) ---
    const beamMeshes = [];
    const fixtureMat = new THREE.MeshBasicMaterial({ color: 0xe8fbff });

    function createStadiumFloodlight(x, y, z, targetX, targetY, beamRadius, beamLength, opacity) {
      // Glowing circular floodlight lamp head visible in the stadium background
      const housing = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.36, 0.45, 20),
        new THREE.MeshStandardMaterial({ color: 0x1a222d, metalness: 0.8, roughness: 0.3 })
      );
      housing.position.set(x, y, z);
      housing.lookAt(targetX, targetY, 0);
      housing.rotateX(Math.PI / 2);
      scene.add(housing);

      const lens = new THREE.Mesh(new THREE.CircleGeometry(0.36, 20), fixtureMat);
      lens.position.set(x, y, z + 0.23);
      lens.lookAt(targetX, targetY, 0);
      scene.add(lens);

      // Diagonal Cyan-White Volumetric Beam
      const coneGeom = new THREE.ConeGeometry(beamRadius, beamLength, 32, 1, true);
      coneGeom.translate(0, -beamLength / 2, 0);
      const coneMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        uniforms: {
          uColor: { value: new THREE.Color(0x9be2ff) },
          uOpacity: { value: opacity }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mvPos.xyz;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vec3 viewDir = normalize(vViewPos);
            float edgeFade = pow(abs(dot(vNormal, viewDir)), 1.55);
            float verticalFade = smoothstep(0.0, 0.78, vUv.y) * smoothstep(1.0, 0.85, vUv.y);
            gl_FragColor = vec4(uColor, edgeFade * verticalFade * uOpacity);
          }
        `
      });
      const cone = new THREE.Mesh(coneGeom, coneMat);
      cone.position.set(x, y, z + 0.2);
      cone.lookAt(targetX, targetY, 0);
      cone.rotateX(Math.PI / 2);
      scene.add(cone);
      beamMeshes.push({ cone, baseRotZ: cone.rotation.z, phase: Math.random() * Math.PI * 2 });
    }

    // Replicating the 4 stadium floodlights from the photo (upper-left, upper-center-left, upper-right, mid-right)
    createStadiumFloodlight(-7.6, 8.8, -11.5, -13.5, 4.8, 2.6, 14, 0.24);
    createStadiumFloodlight(-0.6, 7.6, -11.8, -6.5, 4.2, 2.3, 13, 0.22);
    createStadiumFloodlight(7.2, 8.8, -11.5, 1.2, 4.4, 2.8, 15, 0.26);
    createStadiumFloodlight(10.2, 5.4, -10.5, 3.8, 1.2, 2.7, 13, 0.28);

    // Arena Lighting (Keeps the Cauldron & Grey Floor Crisp and Clear)
    const hemiLight = new THREE.HemisphereLight(0xdceeff, 0x5c6875, 1.35);
    scene.add(hemiLight);

    const frontKeyLight = new THREE.DirectionalLight(0xfff5e6, 2.2);
    frontKeyLight.position.set(2.5, 9.0, 11.0);
    frontKeyLight.castShadow = true;
    scene.add(frontKeyLight);

    const coolRightSpot = new THREE.SpotLight(0xb8ecff, 35, 30, Math.PI / 5, 0.6, 1.0);
    coolRightSpot.position.set(9, 7, 4);
    coolRightSpot.target.position.set(1.5, 0.5, 0);
    scene.add(coolRightSpot);
    scene.add(coolRightSpot.target);

    // Dynamic Fire Point Light
    const fireLight = new THREE.PointLight(0xff7b00, 0, 24, 1.3);
    fireLight.position.set(0, 5.6, 0.8);
    scene.add(fireLight);

    // --- Custom GPU GLSL Volumetric Fire Shader ---
    const fireUniforms = {
      uTime: { value: 0 },
      uHeat: { value: 0 }
    };

    const fireMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: fireUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uHeat;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p *= 2.04;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          if (uHeat <= 0.005) discard;

          vec2 uv = vUv;
          float nx = (uv.x - 0.5) * 2.0;
          float ny = uv.y;

          float maxH = mix(0.08, 0.96, uHeat);
          float hNorm = ny / maxH;
          if (hNorm > 1.05) discard;

          vec2 flowUv = vec2(nx * 2.8, ny * 3.8 - uTime * 3.4);
          float n1 = fbm(flowUv);
          float n2 = fbm(flowUv * 1.9 + vec2(uTime * 0.7, -uTime * 2.1));
          float turb = mix(n1, n2, 0.45);

          float baseSpread = mix(0.24, 0.88, sqrt(uHeat));
          float taper = mix(baseSpread, 0.04, pow(clamp(hNorm, 0.0, 1.0), 0.85));
          float distFromCenter = abs(nx + (turb - 0.5) * 0.42 * hNorm);

          float shape = smoothstep(taper, taper * 0.15, distFromCenter);
          float verticalMask = smoothstep(0.0, 0.09, ny) * smoothstep(1.02, 0.25, hNorm);

          float intensity = shape * verticalMask * (0.65 + 0.75 * turb);
          intensity = smoothstep(0.18, 0.88, intensity) * smoothstep(0.0, 0.12, uHeat);

          vec3 col = mix(vec3(0.92, 0.16, 0.0), vec3(1.0, 0.52, 0.04), smoothstep(0.15, 0.48, intensity));
          col = mix(col, vec3(1.0, 0.88, 0.30), smoothstep(0.45, 0.75, intensity));
          col = mix(col, vec3(1.0, 0.99, 0.92), smoothstep(0.75, 0.98, intensity));

          gl_FragColor = vec4(col * 1.45, clamp(intensity * 1.25, 0.0, 1.0));
        }
      `
    });

    const firePlaneGeom = new THREE.PlaneGeometry(8.0, 5.2);
    const firePlane1 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane1.position.set(0, 7.2, 0.05);
    cauldronGroup.add(firePlane1);

    const firePlane2 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane2.position.set(0, 7.2, -0.05);
    firePlane2.rotation.y = 0.22;
    cauldronGroup.add(firePlane2);

    // --- 3D Rising Golden Sparks ---
    const sparkCount = 240;
    const sparkGeom = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    const sparkVel = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] = (Math.random() - 0.5) * 6.5;
      sparkPos[i * 3 + 1] = 4.8 + Math.random() * 5.0;
      sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
      sparkVel.push({
        vx: (Math.random() - 0.5) * 0.035,
        vy: 0.03 + Math.random() * 0.075,
        vz: (Math.random() - 0.5) * 0.02
      });
    }
    sparkGeom.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));

    const sparkMat = new THREE.PointsMaterial({
      color: 0xffd666,
      size: 0.09,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparkPoints = new THREE.Points(sparkGeom, sparkMat);
    cauldronGroup.add(sparkPoints);

    // --- Responsive Framing: Cauldron = 1/2 Screen Height, >= 1/2 Screen Width ---
    function updateFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);

      const dist = camera.position.z;
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeightAtZero = 2 * Math.tan(vFovRad / 2) * dist;
      const visibleWidthAtZero = visibleHeightAtZero * camera.aspect;

      const scaleY = (visibleHeightAtZero * 0.50) / 4.86;
      const scaleX = Math.max(scaleY, (visibleWidthAtZero * 0.56) / 8.84);

      cauldronGroup.scale.set(scaleX, scaleY, scaleY);
      // Anchor pillars right onto the grey arena floor near the bottom of the screen
      cauldronGroup.position.y = 3.2 - (visibleHeightAtZero * 0.46);
      arenaFloor.position.y = cauldronGroup.position.y;
    }
    window.addEventListener('resize', updateFraming);
    updateFraming();

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      heatValue += (targetHeat - heatValue) * 0.05;
      const heatNorm = heatValue / 100;

      if (heatValue >= 95) {
        sloganBanner.classList.add('visible');
      } else {
        sloganBanner.classList.remove('visible');
      }

      fireUniforms.uTime.value = elapsed;
      fireUniforms.uHeat.value = heatNorm;

      const flicker = Math.sin(elapsed * 19.0) * 0.14 + Math.cos(elapsed * 31.0) * 0.09;
      fireLight.intensity = heatNorm > 0.01 ? (heatNorm * 40 + flicker * 8 * heatNorm) : 0;

      sparkMat.opacity = Math.min(0.95, heatNorm * 1.15);
      const posArr = sparkGeom.attributes.position.array;
      const spread = 3.7 * Math.sqrt(Math.max(0.05, heatNorm));
      const maxSparkY = 4.85 + heatNorm * 5.2;

      for (let i = 0; i < sparkCount; i++) {
        posArr[i * 3] += sparkVel[i].vx + Math.sin(elapsed * 3 + i) * 0.008;
        posArr[i * 3 + 1] += sparkVel[i].vy * (0.4 + heatNorm * 0.9);
        posArr[i * 3 + 2] += sparkVel[i].vz;

        if (posArr[i * 3 + 1] > maxSparkY || heatNorm < 0.02) {
          posArr[i * 3] = (Math.random() - 0.5) * 2 * spread;
          posArr[i * 3 + 1] = 4.72 + Math.random() * 0.3;
          posArr[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
        }
      }
      sparkGeom.attributes.position.needsUpdate = true;

      // Subtle atmospheric shimmer in the stadium spotlight beams
      beamMeshes.forEach((b) => {
        b.cone.rotation.z = b.baseRotZ + Math.sin(elapsed * 0.35 + b.phase) * 0.025;
      });

      composer.render();
    }

    animate();
  </script>
</body>
</html>
