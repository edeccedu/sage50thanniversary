<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - 50th Anniversary Ceremonial Cauldron</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070b12;
      color: #fff;
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', 'PingFang HK', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .lens-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 52%, transparent 64%, rgba(3, 6, 12, 0.48) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Ceremonial Slogan Reveal Overlay */
    .banner-container {
      position: fixed;
      top: 4.5vh;
      left: 0;
      width: 100%;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5vw;
      opacity: 0;
      transform: translateY(-28px) scale(0.94);
      transition: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .banner-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .laurel {
      height: 14.5vh;
      min-height: 92px;
      filter: drop-shadow(0 0 18px rgba(255, 200, 60, 0.85));
    }

    .slogan-plaque {
      background: linear-gradient(180deg, rgba(35, 8, 10, 0.88) 0%, rgba(16, 4, 6, 0.92) 100%);
      border-top: 2.5px solid rgba(255, 222, 115, 0.9);
      border-bottom: 2.5px solid rgba(255, 222, 115, 0.9);
      padding: 1.6vh 4vw;
      box-shadow: 0 14px 45px rgba(0, 0, 0, 0.75), inset 0 0 30px rgba(255, 195, 60, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slogan-title {
      font-size: 4.8vh;
      font-weight: 900;
      letter-spacing: 0.36em;
      margin-right: -0.36em;
      background: linear-gradient(180deg, #ffffff 0%, #ffe885 45%, #d69c24 85%, #fff5c2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(255, 180, 0, 0.9));
      line-height: 1.32;
    }

    #setup-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(14, 20, 32, 0.92);
      border: 1px solid rgba(255, 215, 0, 0.55);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    #setup-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="setup-badge">
    <div>Press <b>F</b> for Fullscreen &bull; Press <b>H</b> to hide/show this box</div>
    <div>Backstage Control: <b>/backstage.html</b> &bull; Remote Sync ID: <b id="peer-id-display" style="color:#fff;">Loading...</b></div>
  </div>

  <div id="webgl-container"></div>
  <div class="lens-vignette"></div>

  <!-- Ceremonial Slogan Reveal -->
  <div class="banner-container" id="ceremony-slogan">
    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>

    <div class="slogan-plaque">
      <h1 class="slogan-title">五十載耆康安老</h1>
      <h1 class="slogan-title">以初心關顧同行</h1>
    </div>

    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let heatValue = 0;
    let targetHeat = 0;

    const sloganBanner = document.getElementById('ceremony-slogan');
    const setupBadge = document.getElementById('setup-badge');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setupBadge.classList.add('hidden');
      }
      if (e.key === 'h' || e.key === 'H') {
        setupBadge.classList.toggle('hidden');
      }
    });

    function handleCommand(data) {
      if (typeof data.heat === 'number') {
        targetHeat = Math.max(0, Math.min(100, data.heat));
      }
      if (data.hideBadge) setupBadge.classList.add('hidden');
    }

    try {
      const channel = new BroadcastChannel('cauldron_ceremony_sync');
      channel.onmessage = (event) => handleCommand(event.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'cauldron_state' && e.newValue) {
        handleCommand(JSON.parse(e.newValue));
      }
    });

    try {
      if (typeof Peer !== 'undefined') {
        const roomCode = 'cauldron-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomCode);
        peer.on('open', (id) => {
          document.getElementById('peer-id-display').textContent = id.replace('cauldron-', '');
        });
        peer.on('connection', (conn) => {
          setupBadge.classList.add('hidden');
          conn.on('data', (data) => handleCommand(data));
        });
        peer.on('error', () => {
          document.getElementById('peer-id-display').textContent = 'Local Mode';
        });
      }
    } catch (err) {
      document.getElementById('peer-id-display').textContent = 'Local Mode';
    }

    // --- Three.js Scene, Camera & Renderer ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d1522, 0.011);

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 180);
    camera.position.set(0, 3.8, 17.5);
    camera.lookAt(0, 3.4, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- High-Contrast Stadium Reflection Environment Map ---
    function buildArenaEnvironment() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();

      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(50, 32, 16),
        new THREE.MeshBasicMaterial({ color: 0x18202c, side: THREE.BackSide })
      );
      envScene.add(dome);

      // Cool stadium searchlights & warm stage deck bounce for realistic bronze/steel reflections
      const lightStrips = [
        { pos: [-14, 18, 12], color: 0xdff6ff, size: [6, 14] },
        { pos: [14, 18, 12], color: 0xdff6ff, size: [6, 14] },
        { pos: [0, 24, 6], color: 0xfff0db, size: [18, 5] },
        { pos: [-14, 4, 8], color: 0xff9248, size: [4, 14] },
        { pos: [14, 4, 8], color: 0xff9248, size: [4, 14] },
        { pos: [0, -10, 12], color: 0x8f7360, size: [28, 14] }
      ];
      lightStrips.forEach(p => {
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(p.size[0], p.size[1]),
          new THREE.MeshBasicMaterial({ color: p.color })
        );
        panel.position.set(...p.pos);
        panel.lookAt(0, 3, 0);
        envScene.add(panel);
      });

      const envRT = pmrem.fromScene(envScene, 0.025);
      scene.environment = envRT.texture;
      pmrem.dispose();
    }
    buildArenaEnvironment();

    // --- Procedural Micro-Grain Surface Textures ---
    function createMicroGrainTexture(baseVal = 128, variance = 28, streakY = false) {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(size, size);
      const data = imgData.data;

      for (let y = 0; y < size; y++) {
        const rowBias = streakY ? 0 : (Math.random() - 0.5) * variance * 0.6;
        for (let x = 0; x < size; x++) {
          const colBias = streakY ? (Math.random() - 0.5) * variance * 0.75 : 0;
          const grain = (Math.random() - 0.5) * variance + rowBias + colBias;
          const v = Math.max(0, Math.min(255, baseVal + grain));
          const idx = (y * size + x) * 4;
          data[idx] = v;
          data[idx + 1] = v;
          data[idx + 2] = v;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    const brushedMetalRoughness = createMicroGrainTexture(108, 40, true);
    const powderCoatRoughness = createMicroGrainTexture(165, 28, false);
    const stageFloorRoughness = createMicroGrainTexture(120, 48, false);

    // =========================================================================
    // GRAND OLYMPIC STADIUM ARCHITECTURE (Matches Reference Photo)
    // =========================================================================
    // 1. Curved Stadium Bowl Backdrop with Audience Lights, Upper Roof Canopy & Light Trusses
    function createGrandStadiumBackdrop() {
      const c = document.createElement('canvas');
      c.width = 2048;
      c.height = 1024;
      const ctx = c.getContext('2d');

      // Deep night-arena roof dome & curved canopy
      const roofGrad = ctx.createLinearGradient(0, 0, 0, 340);
      roofGrad.addColorStop(0.0, '#05080f');
      roofGrad.addColorStop(0.45, '#121926');
      roofGrad.addColorStop(0.85, '#1e2736');
      roofGrad.addColorStop(1.0, '#0e1522');
      ctx.fillStyle = roofGrad;
      ctx.fillRect(0, 0, 2048, 340);

      // Curved stadium canopy ribs & catwalk trusses
      ctx.strokeStyle = 'rgba(180, 205, 235, 0.14)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 175);
      ctx.quadraticCurveTo(1024, 235, 2048, 165);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 245);
      ctx.quadraticCurveTo(1024, 305, 2048, 235);
      ctx.stroke();

      // Vertical truss struts
      for (let x = 0; x <= 2048; x += 46) {
        const sag = Math.sin((x / 2048) * Math.PI) * 58;
        ctx.beginPath();
        ctx.moveTo(x, 175 + sag);
        ctx.lineTo(x + 15, 245 + sag);
        ctx.stroke();
      }

      // Main Stadium Bowl Seating & Illuminated Stage Backdrop
      const bowlGrad = ctx.createLinearGradient(0, 330, 0, 1024);
      bowlGrad.addColorStop(0.0, '#0b111c');
      bowlGrad.addColorStop(0.5, '#121d2e');
      bowlGrad.addColorStop(1.0, '#18263b');
      ctx.fillStyle = bowlGrad;
      ctx.fillRect(0, 330, 2048, 694);

      // Right-side giant illuminated ceremonial stage screen / backdrop wall (as seen behind the cauldron in photo)
      const screenGrad = ctx.createLinearGradient(1100, 310, 2048, 760);
      screenGrad.addColorStop(0.0, 'rgba(125, 165, 205, 0.32)');
      screenGrad.addColorStop(0.6, 'rgba(175, 195, 210, 0.42)');
      screenGrad.addColorStop(1.0, 'rgba(195, 155, 115, 0.45)');
      ctx.fillStyle = screenGrad;
      ctx.fillRect(1080, 315, 968, 460);

      // Left-side sweeping curved spectator tiers filled with hundreds of twinkling lights
      for (let row = 0; row < 18; row++) {
        const yBase = 365 + row * 24;
        ctx.strokeStyle = 'rgba(100, 145, 195, 0.12)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, yBase - 35);
        ctx.quadraticCurveTo(560, yBase + 25, 1060, yBase + 10);
        ctx.stroke();
      }

      // Dense glittering crowd lights / camera flashes in the left & center-left stadium tiers
      for (let i = 0; i < 650; i++) {
        const gx = Math.random() * 1040;
        const gy = 370 + Math.random() * 390;
        const rad = Math.random() * 2.6 + 0.8;
        const isWarm = Math.random() > 0.35;
        const glow = ctx.createRadialGradient(gx, gy, 0, gx, gy, rad * 2.4);
        glow.addColorStop(0, isWarm ? 'rgba(255, 245, 215, 0.95)' : 'rgba(190, 230, 255, 0.9)');
        glow.addColorStop(0.5, isWarm ? 'rgba(255, 210, 140, 0.35)' : 'rgba(130, 195, 255, 0.3)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(gx, gy, rad * 2.4, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const stadiumBackdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(84, 42),
      new THREE.MeshBasicMaterial({ map: createGrandStadiumBackdrop() })
    );
    stadiumBackdrop.position.set(0, 10.5, -26);
    scene.add(stadiumBackdrop);

    // 2. Sweeping Grand Ceremonial Staircase in the Mid-Ground (Matches the wide blue-slate steps in photo)
    const stairsGroup = new THREE.Group();
    const stepMat = new THREE.MeshStandardMaterial({
      color: 0x162233,
      roughness: 0.45,
      metalness: 0.25
    });
    const stepEdgeMat = new THREE.MeshStandardMaterial({
      color: 0x456385,
      roughness: 0.35,
      metalness: 0.4
    });

    const numSteps = 16;
    for (let s = 0; s < numSteps; s++) {
      const stepH = 0.22;
      const stepD = 0.42;
      const stepW = 46 - s * 0.2;
      const stepMesh = new THREE.Mesh(new THREE.BoxGeometry(stepW, stepH, stepD), stepMat);
      stepMesh.position.set(4.5, (s + 0.5) * stepH, -8.5 - s * stepD);
      stepMesh.receiveShadow = true;
      stairsGroup.add(stepMesh);

      // Crisp illuminated blue-silver stair nosing edge
      const nosing = new THREE.Mesh(new THREE.BoxGeometry(stepW, 0.025, 0.03), stepEdgeMat);
      nosing.position.set(4.5, (s + 1) * stepH, -8.5 - s * stepD + stepD / 2);
      stairsGroup.add(nosing);
    }

    // Architectural stage monoliths flanking the stairs (as seen in the photo)
    const monolithMat = new THREE.MeshStandardMaterial({
      color: 0x7d8a99,
      roughness: 0.55,
      metalness: 0.2
    });
    [
      { x: -13.5, y: 1.4, z: -9.5, w: 2.2, h: 2.8, d: 1.4 },
      { x: -8.2, y: 2.5, z: -12.0, w: 2.4, h: 5.0, d: 1.6 },
      { x: -4.2, y: 3.6, z: -14.2, w: 2.6, h: 7.2, d: 1.8 }
    ].forEach(m => {
      const block = new THREE.Mesh(new THREE.BoxGeometry(m.w, m.h, m.d), monolithMat);
      block.position.set(m.x, m.y, m.z);
      stairsGroup.add(block);
    });
    scene.add(stairsGroup);

    // 3. Polished Reflective Timber-Bronze Ceremonial Stage Floor (Matches the photo's warm reflective deck)
    const stageFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 34),
      new THREE.MeshStandardMaterial({
        color: 0x7c6a60,
        roughness: 0.34,
        roughnessMap: stageFloorRoughness,
        metalness: 0.38
      })
    );
    stageFloor.rotation.x = -Math.PI / 2;
    stageFloor.position.set(0, 0, 2);
    stageFloor.receiveShadow = true;
    scene.add(stageFloor);

    // --- Post-Processing Bloom ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.68,
      0.50,
      0.83
    );
    composer.addPass(bloomPass);

    // =========================================================================
    // GRAND OLYMPIC CAULDRON WITH CIRCULAR BRONZE BASE & 4-PILLAR FRAME
    // =========================================================================
    const cauldronGroup = new THREE.Group();
    scene.add(cauldronGroup);

    const darkCopperBowlMat = new THREE.MeshStandardMaterial({
      color: 0x6b140c,
      metalness: 0.88,
      roughness: 0.28,
      roughnessMap: brushedMetalRoughness,
      side: THREE.DoubleSide
    });

    const sculptedGoldBronzeMat = new THREE.MeshStandardMaterial({
      color: 0xe6b45a,
      metalness: 0.94,
      roughness: 0.20,
      roughnessMap: brushedMetalRoughness
    });

    const warmBronzeBaseMat = new THREE.MeshStandardMaterial({
      color: 0xc88a4b,
      metalness: 0.90,
      roughness: 0.24,
      roughnessMap: brushedMetalRoughness
    });

    const anodizedPillarMat = new THREE.MeshStandardMaterial({
      color: 0x464a52,
      metalness: 0.85,
      roughness: 0.28,
      roughnessMap: brushedMetalRoughness
    });

    // Clean Matte Vermilion-Red Plaque (No text or logo)
    const vermilionShieldMat = new THREE.MeshStandardMaterial({
      color: 0xc21915,
      metalness: 0.06,
      roughness: 0.62,
      roughnessMap: powderCoatRoughness
    });

    // 1. Circular Bronze-Gold Pedestal Disc Base (as seen in the new reference photo)
    const baseDisc = new THREE.Mesh(
      new THREE.CylinderGeometry(1.98, 2.06, 0.22, 64),
      warmBronzeBaseMat
    );
    baseDisc.position.set(0, 0.11, 0);
    baseDisc.castShadow = true;
    baseDisc.receiveShadow = true;
    cauldronGroup.add(baseDisc);

    const baseRimRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.02, 0.04, 14, 64),
      sculptedGoldBronzeMat
    );
    baseRimRing.rotation.x = Math.PI / 2;
    baseRimRing.position.set(0, 0.21, 0);
    cauldronGroup.add(baseRimRing);

    // 2. Four Chamfered Angled Metallic Pillars (Front pair + Rear pair forming the 3D tower)
    function createTowerPillar(xPos, zPos, mirrorX, mirrorZ) {
      const shape = new THREE.Shape();
      shape.moveTo(-0.28, 0);
      shape.lineTo(0.28, 0);
      shape.lineTo(0.46, 3.66);
      shape.lineTo(-0.26, 3.66);
      shape.closePath();

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.56,
        bevelEnabled: true,
        bevelThickness: 0.03,
        bevelSize: 0.03,
        bevelSegments: 3
      });
      geom.center();

      const mesh = new THREE.Mesh(geom, anodizedPillarMat);
      mesh.position.set(xPos, 2.04, zPos);
      mesh.scale.set(mirrorX, 1, mirrorZ);
      mesh.rotation.y = mirrorX * mirrorZ * -0.18;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // Front left & right angled pillars + rear depth pillars
    cauldronGroup.add(createTowerPillar(-1.38, 0.58, -1, 1));
    cauldronGroup.add(createTowerPillar(1.38, 0.58, 1, 1));
    cauldronGroup.add(createTowerPillar(-1.18, -0.68, -1, -1));
    cauldronGroup.add(createTowerPillar(1.18, -0.68, 1, -1));

    // Warm copper-amber stage glow on the lower tower & circular base (matches the photo's warm base glow)
    const baseWarmGlow = new THREE.PointLight(0xff7828, 22, 9.5, 1.5);
    baseWarmGlow.position.set(0, 0.9, 1.8);
    cauldronGroup.add(baseWarmGlow);

    // 3. Exposed Golden Mechanical Burner Core Under the Bowl
    const burnerCore = new THREE.Mesh(
      new THREE.CylinderGeometry(0.56, 0.46, 0.72, 28),
      sculptedGoldBronzeMat
    );
    burnerCore.position.set(0, 3.68, 0);
    cauldronGroup.add(burnerCore);

    [3.50, 3.74].forEach(ry => {
      const collar = new THREE.Mesh(
        new THREE.TorusGeometry(0.57, 0.035, 12, 32),
        sculptedGoldBronzeMat
      );
      collar.rotation.x = Math.PI / 2;
      collar.position.set(0, ry, 0);
      cauldronGroup.add(collar);
    });

    // 4. Clean Matte Vermilion-Red Trapezoidal Shield Suspended Between Front Pillars
    const shieldShape = new THREE.Shape();
    shieldShape.moveTo(-0.88, -1.24);
    shieldShape.lineTo(0.88, -1.24);
    shieldShape.lineTo(1.12, 1.24);
    shieldShape.lineTo(-1.12, 1.24);
    shieldShape.closePath();

    const shieldGeom = new THREE.ExtrudeGeometry(shieldShape, {
      depth: 0.14,
      bevelEnabled: true,
      bevelThickness: 0.015,
      bevelSize: 0.015,
      bevelSegments: 2
    });
    shieldGeom.center();

    const plaqueMesh = new THREE.Mesh(shieldGeom, vermilionShieldMat);
    plaqueMesh.position.set(0, 2.24, 0.66);
    plaqueMesh.castShadow = true;
    plaqueMesh.receiveShadow = true;
    cauldronGroup.add(plaqueMesh);

    // 5. Wide Flared Bowl Shell + 3D Sculpted Gold Cloud-Scroll Filigree
    const bowlPoints = [
      new THREE.Vector2(0.0, 0.0),
      new THREE.Vector2(1.45, 0.04),
      new THREE.Vector2(2.85, 0.26),
      new THREE.Vector2(3.98, 0.68),
      new THREE.Vector2(4.55, 1.08),
      new THREE.Vector2(4.38, 1.10),
      new THREE.Vector2(3.60, 0.72),
      new THREE.Vector2(0.0, 0.48)
    ];
    const bowlGeom = new THREE.LatheGeometry(bowlPoints, 96);
    const bowlMesh = new THREE.Mesh(bowlGeom, darkCopperBowlMat);
    bowlMesh.position.set(0, 3.76, 0);
    bowlMesh.castShadow = true;
    bowlMesh.receiveShadow = true;
    cauldronGroup.add(bowlMesh);

    const filigreeGroup = new THREE.Group();
    filigreeGroup.position.set(0, 3.76, 0);
    cauldronGroup.add(filigreeGroup);

    const topRim = new THREE.Mesh(new THREE.TorusGeometry(4.48, 0.05, 16, 120), sculptedGoldBronzeMat);
    topRim.rotation.x = Math.PI / 2;
    topRim.position.y = 1.06;
    filigreeGroup.add(topRim);

    const midRib = new THREE.Mesh(new THREE.TorusGeometry(3.68, 0.03, 12, 100), sculptedGoldBronzeMat);
    midRib.rotation.x = Math.PI / 2;
    midRib.position.y = 0.56;
    filigreeGroup.add(midRib);

    const lowRim = new THREE.Mesh(new THREE.TorusGeometry(2.42, 0.036, 12, 90), sculptedGoldBronzeMat);
    lowRim.rotation.x = Math.PI / 2;
    lowRim.position.y = 0.19;
    filigreeGroup.add(lowRim);

    function bowlSurfacePoint(theta, t, relief = 0.046) {
      const r = 1.45 + t * 3.12 + relief;
      const y = 0.04 + Math.pow(t, 1.48) * 1.02;
      return new THREE.Vector3(Math.sin(theta) * r, y, Math.cos(theta) * r);
    }

    const numSpirals = 24;
    for (let i = 0; i < numSpirals; i++) {
      const baseTheta = (i / numSpirals) * Math.PI * 2;
      const dir = i % 2 === 0 ? 1 : -1;

      const ptsUpper = [];
      const turns = 2.15;
      const steps = 42;
      for (let s = 0; s <= steps; s++) {
        const frac = s / steps;
        const angle = frac * Math.PI * 2 * turns;
        const spiralRad = frac * 0.115;
        const theta = baseTheta + Math.cos(angle) * spiralRad * dir;
        const t = 0.68 + Math.sin(angle) * 0.24 * frac;
        ptsUpper.push(bowlSurfacePoint(theta, Math.max(0.15, Math.min(0.96, t)), 0.046));
      }
      const upperCurve = new THREE.CatmullRomCurve3(ptsUpper);
      filigreeGroup.add(new THREE.Mesh(
        new THREE.TubeGeometry(upperCurve, 36, 0.033, 8, false),
        sculptedGoldBronzeMat
      ));

      const ptsLower = [];
      const lowBaseTheta = baseTheta + (Math.PI / numSpirals);
      for (let s = 0; s <= 32; s++) {
        const frac = s / 32;
        const angle = frac * Math.PI * 2 * 1.85;
        const spiralRad = frac * 0.085;
        const theta = lowBaseTheta - Math.cos(angle) * spiralRad * dir;
        const t = 0.34 + Math.sin(angle) * 0.17 * frac;
        ptsLower.push(bowlSurfacePoint(theta, Math.max(0.10, Math.min(0.62, t)), 0.042));
      }
      const lowerCurve = new THREE.CatmullRomCurve3(ptsLower);
      filigreeGroup.add(new THREE.Mesh(
        new THREE.TubeGeometry(lowerCurve, 28, 0.026, 8, false),
        sculptedGoldBronzeMat
      ));
    }

    // =========================================================================
    // CRISS-CROSSING STADIUM SEARCHLIGHTS (Overhead Trusses + Floor Beams)
    // =========================================================================
    const beamMeshes = [];
    const fixtureMat = new THREE.MeshBasicMaterial({ color: 0xf2fcff });

    function createSearchlight(x, y, z, targetX, targetY, targetZ, beamRadius, beamLength, opacity, showLamp = true) {
      if (showLamp) {
        const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.24, 14, 14), fixtureMat);
        lamp.position.set(x, y, z);
        scene.add(lamp);
      }

      const coneGeom = new THREE.ConeGeometry(beamRadius, beamLength, 32, 1, true);
      coneGeom.translate(0, -beamLength / 2, 0);
      const coneMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        uniforms: {
          uColor: { value: new THREE.Color(0xbce8ff) },
          uOpacity: { value: opacity }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mvPos.xyz;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vec3 viewDir = normalize(vViewPos);
            float edgeFade = pow(abs(dot(vNormal, viewDir)), 1.65);
            float verticalFade = smoothstep(0.0, 0.78, vUv.y) * smoothstep(1.0, 0.88, vUv.y);
            gl_FragColor = vec4(uColor, edgeFade * verticalFade * uOpacity);
          }
        `
      });
      const cone = new THREE.Mesh(coneGeom, coneMat);
      cone.position.set(x, y, z);
      cone.lookAt(targetX, targetY, targetZ);
      cone.rotateX(Math.PI / 2);
      scene.add(cone);
      beamMeshes.push({ cone, baseRotZ: cone.rotation.z, phase: Math.random() * Math.PI * 2 });
    }

    // Upper-left stadium truss searchlights sweeping down across the stands
    createSearchlight(-18.5, 13.8, -22, -11.0, 1.0, -14, 2.4, 22, 0.16);
    createSearchlight(-16.8, 13.5, -22, -7.5, 1.5, -12, 2.2, 22, 0.15);
    createSearchlight(-11.2, 12.6, -22, -16.5, 1.2, -14, 2.2, 21, 0.15);
    createSearchlight(-9.6, 12.4, -22, -3.5, 2.0, -10, 2.5, 22, 0.14);

    // Upper-center & upper-right stadium truss searchlights sweeping diagonally behind the cauldron
    createSearchlight(1.5, 13.6, -22, -6.5, 1.0, -10, 3.0, 24, 0.16);
    createSearchlight(7.2, 14.2, -22, -1.5, 1.5, -8, 2.8, 24, 0.17);
    createSearchlight(10.8, 14.5, -22, 2.2, 1.8, -6, 2.8, 24, 0.18);
    createSearchlight(13.2, 14.6, -22, 5.8, 1.2, -6, 2.6, 24, 0.17);
    createSearchlight(15.6, 14.5, -22, 9.5, 1.0, -8, 2.6, 24, 0.16);
    createSearchlight(18.0, 14.2, -22, 13.5, 1.0, -10, 2.6, 24, 0.15);

    // Lower floor & mid-tier beams shooting upward across the scene (matching the photo's crossing beams)
    createSearchlight(-15.5, 0.4, -14, -7.5, 12.5, -20, 2.1, 20, 0.18);
    createSearchlight(-11.8, 0.4, -14, -17.5, 11.5, -20, 2.0, 19, 0.17);
    createSearchlight(9.5, 3.4, -11, 1.5, 6.2, -4, 2.0, 14, 0.18);
    createSearchlight(17.5, 4.2, -12, 8.5, 2.2, -6, 2.2, 15, 0.18);

    // --- Stadium Lighting ---
    const hemiLight = new THREE.HemisphereLight(0xd8ecff, 0x6e5c52, 1.25);
    scene.add(hemiLight);

    const frontKeyLight = new THREE.DirectionalLight(0xfff5e8, 2.25);
    frontKeyLight.position.set(4.5, 10.5, 12.5);
    frontKeyLight.castShadow = true;
    scene.add(frontKeyLight);

    const stageSpot = new THREE.SpotLight(0xd9f2ff, 55, 36, Math.PI / 4.5, 0.65, 1.0);
    stageSpot.position.set(6, 11, 6);
    stageSpot.target.position.set(0, 0, 0);
    scene.add(stageSpot);
    scene.add(stageSpot.target);

    const fireLight = new THREE.PointLight(0xff8818, 0, 28, 1.2);
    fireLight.position.set(0, 6.0, 0.9);
    scene.add(fireLight);

    // =========================================================================
    // TALL OLYMPIC MULTI-TONGUE FIRE SHADER
    // =========================================================================
    const fireUniforms = {
      uTime: { value: 0 },
      uHeat: { value: 0 }
    };

    const fireMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: fireUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uHeat;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.52;
          for (int i = 0; i < 6; i++) {
            v += a * noise(p);
            p *= 2.12;
            a *= 0.49;
          }
          return v;
        }

        void main() {
          if (uHeat <= 0.005) discard;

          vec2 uv = vUv;
          float nx = (uv.x - 0.5) * 2.0;
          float ny = uv.y;

          float maxH = mix(0.10, 0.98, uHeat);
          float hNorm = ny / maxH;
          if (hNorm > 1.05) discard;

          // Taper upward into a grand Olympic torch plume like the reference photo
          float widthAtHeight = mix(mix(0.28, 0.82, sqrt(uHeat)), 0.14, pow(clamp(hNorm, 0.0, 1.0), 0.9));

          vec2 warpUv = vec2(nx * 4.6, ny * 3.2 - uTime * 3.8);
          float warp = fbm(warpUv);
          vec2 detailUv = vec2((nx + (warp - 0.5) * 0.42) * 6.8, ny * 4.8 - uTime * 4.9);
          float tongues = fbm(detailUv);

          float bowlEnvelope = smoothstep(widthAtHeight, widthAtHeight * 0.18, abs(nx + (warp - 0.5) * 0.22 * hNorm));
          float heightCarve = tongues * 1.22 - pow(hNorm, 0.76) * 0.90;

          float baseBed = smoothstep(0.16, 0.0, ny) * smoothstep(0.84, 0.25, abs(nx)) * 0.88;
          float flameBody = smoothstep(0.03, 0.34, heightCarve) * bowlEnvelope * smoothstep(0.0, 0.05, ny);

          float intensity = max(baseBed, flameBody) * smoothstep(0.0, 0.10, uHeat);
          if (intensity <= 0.01) discard;

          vec3 col = mix(vec3(0.95, 0.30, 0.02), vec3(1.0, 0.68, 0.12), smoothstep(0.12, 0.44, intensity));
          col = mix(col, vec3(1.0, 0.93, 0.48), smoothstep(0.42, 0.70, intensity));
          col = mix(col, vec3(1.0, 0.99, 0.95), smoothstep(0.68, 0.94, intensity));

          gl_FragColor = vec4(col * 1.42, clamp(intensity * 1.35, 0.0, 1.0));
        }
      `
    });

    const firePlaneGeom = new THREE.PlaneGeometry(8.2, 6.2);
    const firePlane1 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane1.position.set(0, 7.75, 0.08);
    cauldronGroup.add(firePlane1);

    const firePlane2 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane2.position.set(0, 7.75, -0.08);
    firePlane2.rotation.y = 0.18;
    firePlane2.scale.x = -1;
    cauldronGroup.add(firePlane2);

    // --- 3D Rising Sparks ---
    const sparkCount = 240;
    const sparkGeom = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    const sparkVel = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] = (Math.random() - 0.5) * 6.5;
      sparkPos[i * 3 + 1] = 4.8 + Math.random() * 5.8;
      sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
      sparkVel.push({
        vx: (Math.random() - 0.5) * 0.032,
        vy: 0.035 + Math.random() * 0.075,
        vz: (Math.random() - 0.5) * 0.02
      });
    }
    sparkGeom.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));

    const sparkMat = new THREE.PointsMaterial({
      color: 0xffd973,
      size: 0.085,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparkPoints = new THREE.Points(sparkGeom, sparkMat);
    cauldronGroup.add(sparkPoints);

    // --- Responsive Framing: Cauldron = 1/2 Screen Height, >= 1/2 Screen Width ---
    function updateFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);

      const dist = camera.position.z;
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeightAtZero = 2 * Math.tan(vFovRad / 2) * dist;
      const visibleWidthAtZero = visibleHeightAtZero * camera.aspect;

      const scaleY = (visibleHeightAtZero * 0.50) / 4.86;
      const scaleX = Math.max(scaleY, (visibleWidthAtZero * 0.56) / 9.10);

      cauldronGroup.scale.set(scaleX, scaleY, scaleY);
      cauldronGroup.position.y = 3.4 - (visibleHeightAtZero * 0.45);
      stageFloor.position.y = cauldronGroup.position.y;
      stairsGroup.position.y = cauldronGroup.position.y;
    }
    window.addEventListener('resize', updateFraming);
    updateFraming();

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      heatValue += (targetHeat - heatValue) * 0.05;
      const heatNorm = heatValue / 100;

      if (heatValue >= 95) {
        sloganBanner.classList.add('visible');
      } else {
        sloganBanner.classList.remove('visible');
      }

      fireUniforms.uTime.value = elapsed;
      fireUniforms.uHeat.value = heatNorm;

      const flicker = Math.sin(elapsed * 21.0) * 0.14 + Math.cos(elapsed * 33.0) * 0.09;
      fireLight.intensity = heatNorm > 0.01 ? (heatNorm * 48 + flicker * 8 * heatNorm) : 0;

      sparkMat.opacity = Math.min(0.95, heatNorm * 1.15);
      const posArr = sparkGeom.attributes.position.array;
      const spread = 3.6 * Math.sqrt(Math.max(0.05, heatNorm));
      const maxSparkY = 4.85 + heatNorm * 6.0;

      for (let i = 0; i < sparkCount; i++) {
        posArr[i * 3] += sparkVel[i].vx + Math.sin(elapsed * 3 + i) * 0.008;
        posArr[i * 3 + 1] += sparkVel[i].vy * (0.4 + heatNorm * 0.9);
        posArr[i * 3 + 2] += sparkVel[i].vz;

        if (posArr[i * 3 + 1] > maxSparkY || heatNorm < 0.02) {
          posArr[i * 3] = (Math.random() - 0.5) * 2 * spread;
          posArr[i * 3 + 1] = 4.72 + Math.random() * 0.3;
          posArr[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
        }
      }
      sparkGeom.attributes.position.needsUpdate = true;

      beamMeshes.forEach((b) => {
        b.cone.rotation.z = b.baseRotZ + Math.sin(elapsed * 0.35 + b.phase) * 0.025;
      });

      composer.render();
    }

    animate();
  </script>
</body>
