<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - 50th Anniversary Ceremonial Cauldron</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09060c;
      color: #fff;
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', 'PingFang HK', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Subtle Ceremonial Edge Vignette */
    .cinema-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 64%, rgba(6, 2, 5, 0.52) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Grand Ceremonial Slogan Reveal Overlay */
    .banner-container {
      position: fixed;
      top: 4.2vh;
      left: 0;
      width: 100%;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5vw;
      opacity: 0;
      transform: translateY(-28px) scale(0.94);
      transition: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .banner-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .laurel {
      height: 14.5vh;
      min-height: 92px;
      filter: drop-shadow(0 0 20px rgba(255, 205, 75, 0.95));
    }

    .slogan-plaque {
      background: linear-gradient(180deg, rgba(44, 8, 10, 0.92) 0%, rgba(18, 3, 5, 0.96) 100%);
      border-top: 2.5px solid rgba(255, 224, 125, 0.95);
      border-bottom: 2.5px solid rgba(255, 224, 125, 0.95);
      padding: 1.6vh 4.4vw;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.85), inset 0 0 36px rgba(255, 195, 65, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slogan-title {
      font-size: 4.8vh;
      font-weight: 900;
      letter-spacing: 0.36em;
      margin-right: -0.36em;
      background: linear-gradient(180deg, #ffffff 0%, #ffea92 45%, #d69c24 85%, #fff6c8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(255, 180, 0, 0.9));
      line-height: 1.32;
    }

    #setup-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(18, 10, 14, 0.92);
      border: 1px solid rgba(255, 215, 0, 0.6);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    #setup-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="setup-badge">
    <div>Press <b>F</b> for Fullscreen &bull; Press <b>H</b> to hide/show this box</div>
    <div>Backstage Control: <b>/backstage.html</b> &bull; Remote Sync ID: <b id="peer-id-display" style="color:#fff;">Loading...</b></div>
  </div>

  <div id="webgl-container"></div>
  <div class="cinema-vignette"></div>

  <!-- Ceremonial Slogan Reveal -->
  <div class="banner-container" id="ceremony-slogan">
    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>

    <div class="slogan-plaque">
      <h1 class="slogan-title">五十載耆康安老</h1>
      <h1 class="slogan-title">以初心關顧同行</h1>
    </div>

    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { Reflector } from 'three/addons/objects/Reflector.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let heatValue = 0;
    let targetHeat = 0;

    const sloganBanner = document.getElementById('ceremony-slogan');
    const setupBadge = document.getElementById('setup-badge');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setupBadge.classList.add('hidden');
      }
      if (e.key === 'h' || e.key === 'H') {
        setupBadge.classList.toggle('hidden');
      }
    });

    function handleCommand(data) {
      if (typeof data.heat === 'number') {
        targetHeat = Math.max(0, Math.min(100, data.heat));
      }
      if (data.hideBadge) setupBadge.classList.add('hidden');
    }

    try {
      const channel = new BroadcastChannel('cauldron_ceremony_sync');
      channel.onmessage = (event) => handleCommand(event.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'cauldron_state' && e.newValue) {
        handleCommand(JSON.parse(e.newValue));
      }
    });

    try {
      if (typeof Peer !== 'undefined') {
        const roomCode = 'cauldron-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomCode);
        peer.on('open', (id) => {
          document.getElementById('peer-id-display').textContent = id.replace('cauldron-', '');
        });
        peer.on('connection', (conn) => {
          setupBadge.classList.add('hidden');
          conn.on('data', (data) => handleCommand(data));
        });
        peer.on('error', () => {
          document.getElementById('peer-id-display').textContent = 'Local Mode';
        });
      }
    } catch (err) {
      document.getElementById('peer-id-display').textContent = 'Local Mode';
    }

    // --- Three.js Ultra-HD Scene, Camera & Renderer ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0812);
    scene.fog = new THREE.FogExp2(0x100b18, 0.0095);

    const camera = new THREE.PerspectiveCamera(33, window.innerWidth / window.innerHeight, 0.1, 240);
    camera.position.set(0, 3.85, 17.8);
    camera.lookAt(0, 3.35, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      precision: 'highp'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    // Unlock crisp 4K / Retina pixel density up to 3.0x
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.26;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    // =========================================================================
    // 1. GRAND CEREMONIAL GALA ENVIRONMENT MAP (Warm Gold & Cool Starlight)
    // =========================================================================
    function buildProsperousGalaEnvironment() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();

      // Deep imperial burgundy-navy gala dome
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(60, 48, 24),
        new THREE.MeshBasicMaterial({ color: 0x1c1118, side: THREE.BackSide })
      );
      envScene.add(dome);

      // Warm golden chandelier light banks + crisp white broadcast softboxes
      const softboxes = [
        { pos: [-16, 22, 14], color: 0xfff3db, size: [7, 20] },
        { pos: [16, 22, 14], color: 0xfff3db, size: [7, 20] },
        { pos: [-6, 26, 8], color: 0xffffff, size: [9, 12] },
        { pos: [6, 26, 8], color: 0xffe8bd, size: [9, 12] },
        { pos: [-16, 5, 10], color: 0xffa64d, size: [5, 18] },
        { pos: [16, 5, 10], color: 0xffa64d, size: [5, 18] },
        { pos: [0, -12, 10], color: 0x5c2420, size: [36, 18] }
      ];
      softboxes.forEach(sb => {
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(sb.size[0], sb.size[1]),
          new THREE.MeshBasicMaterial({ color: sb.color })
        );
        panel.position.set(...sb.pos);
        panel.lookAt(0, 3, 0);
        envScene.add(panel);
      });

      const envRT = pmrem.fromScene(envScene, 0.018);
      scene.environment = envRT.texture;
      pmrem.dispose();
    }
    buildProsperousGalaEnvironment();

    // =========================================================================
    // 2. HIGH-RESOLUTION PROCEDURAL PBR TEXTURES (1024px - 2048px)
    // =========================================================================
    function createBrushedMetalMaps() {
      const size = 1024;
      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = size; roughCanvas.height = size;
      const rCtx = roughCanvas.getContext('2d');
      const rImg = rCtx.createImageData(size, size);

      const normCanvas = document.createElement('canvas');
      normCanvas.width = size; normCanvas.height = size;
      const nCtx = normCanvas.getContext('2d');
      const nImg = nCtx.createImageData(size, size);

      const heights = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const streak = Math.sin(x * 0.55 + Math.sin(y * 0.04) * 2.0) * 0.5 + (Math.random() - 0.5) * 0.65;
          heights[y * size + x] = streak;
          const rVal = Math.max(38, Math.min(215, 92 + streak * 30));
          const idx = (y * size + x) * 4;
          rImg.data[idx] = rVal;
          rImg.data[idx + 1] = rVal;
          rImg.data[idx + 2] = rVal;
          rImg.data[idx + 3] = 255;
        }
      }
      rCtx.putImageData(rImg, 0, 0);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const xL = (x - 1 + size) % size;
          const xR = (x + 1) % size;
          const yU = (y - 1 + size) % size;
          const yD = (y + 1) % size;
          const dx = (heights[y * size + xL] - heights[y * size + xR]) * 1.4;
          const dy = (heights[yU * size + x] - heights[yD * size + x]) * 0.4;
          const dz = 1.0;
          const invLen = 1.0 / Math.sqrt(dx * dx + dy * dy + dz * dz);
          const idx = (y * size + x) * 4;
          nImg.data[idx] = ((dx * invLen) * 0.5 + 0.5) * 255;
          nImg.data[idx + 1] = ((dy * invLen) * 0.5 + 0.5) * 255;
          nImg.data[idx + 2] = ((dz * invLen) * 0.5 + 0.5) * 255;
          nImg.data[idx + 3] = 255;
        }
      }
      nCtx.putImageData(nImg, 0, 0);

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.repeat.set(4, 4);
      roughnessMap.anisotropy = maxAnisotropy;

      const normalMap = new THREE.CanvasTexture(normCanvas);
      normalMap.wrapS = normalMap.wrapT = THREE.RepeatWrapping;
      normalMap.repeat.set(4, 4);
      normalMap.anisotropy = maxAnisotropy;

      return { roughnessMap, normalMap };
    }

    function createLuxuryMarbleTexture() {
      const size = 2048;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Deep imperial obsidian-burgundy stone base
      ctx.fillStyle = '#1b1620';
      ctx.fillRect(0, 0, size, size);

      // Rich gold & warm ivory marble veining
      for (let v = 0; v < 42; v++) {
        ctx.beginPath();
        let px = Math.random() * size;
        let py = Math.random() * size;
        ctx.moveTo(px, py);
        for (let step = 0; step < 24; step++) {
          px += (Math.random() - 0.35) * 140;
          py += (Math.random() - 0.35) * 140;
          ctx.lineTo(px, py);
        }
        ctx.strokeStyle = v % 2 === 0 ? 'rgba(235, 190, 110, 0.18)' : 'rgba(210, 175, 165, 0.11)';
        ctx.lineWidth = Math.random() * 3.2 + 0.8;
        ctx.stroke();
      }

      // 24K Gold architectural stone slab grid joints
      ctx.strokeStyle = 'rgba(235, 192, 110, 0.28)';
      ctx.lineWidth = 3;
      for (let g = 0; g <= size; g += 512) {
        ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(size, g); ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 4);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAnisotropy;
      return tex;
    }

    // =========================================================================
    // ULTRA-CRISP 2048x2304 SAGE 50TH ANNIVERSARY PLAQUE LOGO (Matches SAGE 50.pdf)
    // =========================================================================
    function createSage50PlaqueMaps() {
      const w = 2048;
      const h = 2304;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = w; colorCanvas.height = h;
      const ctx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = w; bumpCanvas.height = h;
      const bCtx = bumpCanvas.getContext('2d');

      // Deep Piano-Lacquer Imperial Vermilion Base
      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#cc1814');
      bgGrad.addColorStop(0.55, '#b5120e');
      bgGrad.addColorStop(1, '#8f0b08');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, w, h);

      function renderLogoArtwork(c, isBump) {
        c.save();
        // Scale 2x for 2048x2304 ultra-sharp canvas
        c.scale(2, 2);
        const cw = 1024, ch = 1152;
        c.translate(cw * 0.5, ch * 0.44);

        // Ornamental double gold frame border inside the crimson plaque
        c.strokeStyle = isBump ? '#b0b0b0' : 'rgba(255, 224, 130, 0.72)';
        c.lineWidth = 4;
        c.strokeRect(-420, -455, 840, 1020);
        c.lineWidth = 1.5;
        c.strokeRect(-406, -441, 812, 992);

        const goldGrad = c.createLinearGradient(-280, -260, 280, 260);
        goldGrad.addColorStop(0.0, '#fff7cc');
        goldGrad.addColorStop(0.35, '#f5cc6c');
        goldGrad.addColorStop(0.7, '#d99c2e');
        goldGrad.addColorStop(1.0, '#ffeba0');

        const fillMain = isBump ? '#ffffff' : goldGrad;
        const fillAccent = isBump ? '#dcdcdc' : '#fff8d6';

        if (!isBump) {
          c.shadowColor = 'rgba(50, 4, 3, 0.58)';
          c.shadowBlur = 20;
          c.shadowOffsetY = 9;
        }

        // 1. Stylised Ribbon Numeral "5"
        c.fillStyle = fillMain;
        c.beginPath();
        c.moveTo(-255, -245);
        c.quadraticCurveTo(-130, -255, -25, -238);
        c.lineTo(-42, -182);
        c.quadraticCurveTo(-135, -196, -205, -188);
        c.lineTo(-218, -95);
        c.quadraticCurveTo(-150, -125, -85, -92);
        c.quadraticCurveTo(-20, -55, -25, 22);
        c.quadraticCurveTo(-32, 108, -128, 128);
        c.quadraticCurveTo(-228, 145, -278, 72);
        c.lineTo(-225, 36);
        c.quadraticCurveTo(-190, 82, -135, 74);
        c.quadraticCurveTo(-82, 65, -80, 12);
        c.quadraticCurveTo(-78, -42, -142, -48);
        c.quadraticCurveTo(-195, -52, -235, -20);
        c.lineTo(-268, -32);
        c.closePath();
        c.fill();

        // 2. Flowing Circle / Ribbon "0" with Uplifting Care Silhouette
        c.lineWidth = 46;
        c.strokeStyle = fillMain;
        c.beginPath();
        c.ellipse(135, -55, 118, 168, 0.14, 0.25 * Math.PI, 1.92 * Math.PI);
        c.stroke();

        c.fillStyle = fillAccent;
        c.beginPath();
        c.arc(145, -118, 24, 0, Math.PI * 2);
        c.fill();

        c.beginPath();
        c.moveTo(45, -25);
        c.bezierCurveTo(95, -85, 185, -75, 235, -15);
        c.bezierCurveTo(185, -35, 105, -35, 55, 15);
        c.closePath();
        c.fill();

        // 3. Organization Name: "耆康會  SAGE"
        c.fillStyle = fillAccent;
        c.textAlign = 'center';
        c.font = '900 62px "Noto Serif TC", "PingFang HK", "Microsoft JhengHei", sans-serif';
        c.fillText('耆康會  SAGE', 0, 212);

        // Ornamental Gold Divider
        c.strokeStyle = fillMain;
        c.lineWidth = 3;
        c.beginPath();
        c.moveTo(-270, 242);
        c.lineTo(270, 242);
        c.stroke();

        // 4. 50th Anniversary Motto: "五十載耆康安老  以初心關顧同行"
        c.fillStyle = fillMain;
        c.font = 'bold 34px "Noto Serif TC", "Songti TC", "PingFang HK", serif';
        c.fillText('五十載耆康安老  以初心關顧同行', 0, 294);

        c.restore();
      }

      renderLogoArtwork(ctx, false);
      renderLogoArtwork(bCtx, true);

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.colorSpace = THREE.SRGBColorSpace;
      colorTex.anisotropy = maxAnisotropy;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAnisotropy;

      return { colorTex, bumpTex };
    }

    const { roughnessMap: brushedRoughness, normalMap: brushedNormal } = createBrushedMetalMaps();
    const marbleSlabTex = createLuxuryMarbleTexture();
    const { colorTex: plaqueColorTex, bumpTex: plaqueBumpTex } = createSage50PlaqueMaps();

    // =========================================================================
    // 3. 2K REAL-TIME REFLECTIVE MARBLE STAGE, RED CARPET & 24K GOLD INLAYS
    // =========================================================================
    const floorGroup = new THREE.Group();
    scene.add(floorGroup);

    const floorMirror = new Reflector(new THREE.PlaneGeometry(96, 46), {
      clipBias: 0.003,
      textureWidth: 2048,
      textureHeight: 2048,
      color: 0x998e84
    });
    floorMirror.rotation.x = -Math.PI / 2;
    floorMirror.position.set(0, -0.002, 2);
    floorGroup.add(floorMirror);

    const polishedMarbleDeck = new THREE.Mesh(
      new THREE.PlaneGeometry(96, 46),
      new THREE.MeshPhysicalMaterial({
        map: marbleSlabTex,
        color: 0x2d242c,
        roughness: 0.14,
        metalness: 0.25,
        clearcoat: 1.0,
        clearcoatRoughness: 0.06,
        transparent: true,
        opacity: 0.74
      })
    );
    polishedMarbleDeck.rotation.x = -Math.PI / 2;
    polishedMarbleDeck.position.set(0, 0.001, 2);
    polishedMarbleDeck.receiveShadow = true;
    floorGroup.add(polishedMarbleDeck);

    // Ceremonial Imperial Red Carpet Runner Leading to the Cauldron
    const carpetMat = new THREE.MeshStandardMaterial({
      color: 0x8f0d12,
      roughness: 0.78,
      metalness: 0.08
    });
    const carpetRunner = new THREE.Mesh(new THREE.PlaneGeometry(7.2, 22), carpetMat);
    carpetRunner.rotation.x = -Math.PI / 2;
    carpetRunner.position.set(0, 0.003, 5.5);
    carpetRunner.receiveShadow = true;
    floorGroup.add(carpetRunner);

    // 24K Gold Carpet Borders & Concentric Ceremonial Stage Rings
    const goldInlayMat = new THREE.MeshStandardMaterial({
      color: 0xf5c869,
      metalness: 0.96,
      roughness: 0.15
    });
    [-3.62, -3.44, 3.44, 3.62].forEach(bx => {
      const border = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 22), goldInlayMat);
      border.rotation.x = -Math.PI / 2;
      border.position.set(bx, 0.004, 5.5);
      floorGroup.add(border);
    });

    [2.68, 3.92, 5.15].forEach(radius => {
      const ring = new THREE.Mesh(new THREE.RingGeometry(radius - 0.038, radius + 0.038, 128), goldInlayMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(0, 0.005, 0);
      floorGroup.add(ring);
    });

    // =========================================================================
    // 4. FORMAL & PROSPEROUS 3D STADIUM ARCHITECTURE & CEREMONIAL BRAZIERS
    // =========================================================================
    const stadiumGroup = new THREE.Group();
    scene.add(stadiumGroup);

    // A. Grand Ceremonial Staircase with Central Red Carpet & Gold Step Trim
    const stairBodyMat = new THREE.MeshStandardMaterial({
      color: 0x1b1520,
      roughness: 0.32,
      metalness: 0.35
    });
    const stepLedMat = new THREE.MeshBasicMaterial({ color: 0xffe4a8 });

    const numSteps = 18;
    for (let s = 0; s < numSteps; s++) {
      const stepH = 0.22;

      const r = 1.45 + t * 3.12 + relief;
      const y = 0.04 + Math.pow(t, 1.48) * 1.02;
      return new THREE.Vector3(Math.sin(theta) * r, y, Math.cos(theta) * r);

      const turns = 2.15;
      const steps = 56;
      for (let s = 0; s <= steps; s++) {
        const frac = s / steps;
        const angle = frac * Math.PI * 2 * turns;
        const spiralRad = frac * 0.115;
        const theta = baseTheta + Math.cos(angle) * spiralRad * dir;
        const t = 0.68 + Math.sin(angle) * 0.24 * frac;

        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        uniforms: {
          uColor: { value: new THREE.Color(colorHex) },
          uOpacity: { value: opacity }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mvPos.xyz;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vec3 viewDir = normalize(vViewPos);
            float edgeFade = pow(abs(dot(vNormal, viewDir)), 1.75);
            float verticalFade = smoothstep(0.0, 0.78, vUv.y) * smoothstep(1.0, 0.88, vUv.y);
            gl_FragColor = vec4(uColor, edgeFade * verticalFade * uOpacity);
          }
        `
      });

      cone.position.set(x, y, z);

        uniform float uHeat;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.52;
          for (int i = 0; i < 6; i++) {
            v += a * noise(p);
            p *= 2.12;
            a *= 0.49;
          }
          return v;
        }

        void main() {
          if (uHeat <= 0.005) discard;

          vec2 uv = vUv;
          float nx = (uv.x - 0.5) * 2.0;
          float ny = uv.y;

          float maxH = mix(0.10, 0.98, uHeat);
          float hNorm = ny / maxH;
          if (hNorm > 1.05) discard;

          float widthAtHeight = mix(mix(0.28, 0.82, sqrt(uHeat)), 0.14, pow(clamp(hNorm, 0.0, 1.0), 0.9));

          vec2 warpUv = vec2(nx * 4.6, ny * 3.2 - uTime * 3.8);
          float warp = fbm(warpUv);
          vec2 detailUv = vec2((nx + (warp - 0.5) * 0.42) * 6.8, ny * 4.8 - uTime * 4.9);
          float tongues = fbm(detailUv);

          float bowlEnvelope = smoothstep(widthAtHeight, widthAtHeight * 0.18, abs(nx + (warp - 0.5) * 0.22 * hNorm));
          float heightCarve = tongues * 1.22 - pow(hNorm, 0.76) * 0.90;

          float baseBed = smoothstep(0.16, 0.0, ny) * smoothstep(0.84, 0.25, abs(nx)) * 0.88;
          float flameBody = smoothstep(0.03, 0.34, heightCarve) * bowlEnvelope * smoothstep(0.0, 0.05, ny);

          float intensity = max(baseBed, flameBody) * smoothstep(0.0, 0.10, uHeat);
          if (intensity <= 0.01) discard;

          vec3 col = mix(vec3(0.95, 0.30, 0.02), vec3(1.0, 0.68, 0.12), smoothstep(0.12, 0.44, intensity));
          col = mix(col, vec3(1.0, 0.93, 0.48), smoothstep(0.42, 0.70, intensity));
          col = mix(col, vec3(1.0, 0.99, 0.95), smoothstep(0.68, 0.94, intensity));

          gl_FragColor = vec4(col * 1.42, clamp(intensity * 1.35, 0.0, 1.0));
        }
      `
    });

    const firePlaneGeom = new THREE.PlaneGeometry(8.2, 6.2);
    const firePlane1 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane1.position.set(0, 7.80, 0.10);
    cauldronGroup.add(firePlane1);

    const firePlane2 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane2.position.set(0, 7.80, -0.05);
    firePlane2.rotation.y = 0.24;
    firePlane2.scale.x = -1;
    cauldronGroup.add(firePlane2);

    const firePlane3 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane3.position.set(0, 7.80, 0.0);
    firePlane3.rotation.y = -0.24;
    cauldronGroup.add(firePlane3);

    // 3D Rising Sparks & Prosperous Golden Dust Motes
    const sparkCount = 320;
    const sparkGeom = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    const sparkVel = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] = (Math.random() - 0.5) * 7.2;
      sparkPos[i * 3 + 1] = 4.8 + Math.random() * 6.2;
      sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 1.8;
      sparkVel.push({
        vx: (Math.random() - 0.5) * 0.032,
        vy: 0.035 + Math.random() * 0.075,
        vz: (Math.random() - 0.5) * 0.02
      });
    }
    sparkGeom.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));

    const sparkMat = new THREE.PointsMaterial({
      color: 0xffdf7a,
      size: 0.09,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparkPoints = new THREE.Points(sparkGeom, sparkMat);
    cauldronGroup.add(sparkPoints);

    // Ambient floating golden celebration dust in the stadium air
    const ambientDustCount = 180;
    const dustGeom = new THREE.BufferGeometry();
    const dustPos = new Float32Array(ambientDustCount * 3);
    for (let i = 0; i < ambientDustCount; i++) {
      dustPos[i * 3] = (Math.random() - 0.5) * 26;
      dustPos[i * 3 + 1] = Math.random() * 11;
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * 18 - 4;
    }
    dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
      color: 0xffe082,
      size: 0.065,
      transparent: true,
      opacity: 0.45,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const ambientDust = new THREE.Points(dustGeom, dustMat);
    scene.add(ambientDust);

    // --- Responsive Framing: Cauldron = 1/2 Screen Height, >= 1/2 Screen Width ---
    function updateFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);

      const dist = camera.position.z;
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeightAtZero = 2 * Math.tan(vFovRad / 2) * dist;
      const visibleWidthAtZero = visibleHeightAtZero * camera.aspect;

      const scaleY = (visibleHeightAtZero * 0.50) / 4.90;
      const scaleX = Math.max(scaleY, (visibleWidthAtZero * 0.56) / 9.12);

      cauldronGroup.scale.set(scaleX, scaleY, scaleY);
      const baseY = 3.35 - (visibleHeightAtZero * 0.45);
      cauldronGroup.position.y = baseY;
      floorGroup.position.y = baseY;
      stadiumGroup.position.y = baseY;
    }
    window.addEventListener('resize', updateFraming);
    updateFraming();

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      heatValue += (targetHeat - heatValue) * 0.05;
      const heatNorm = heatValue / 100;

      if (heatValue >= 95) {
        sloganBanner.classList.add('visible');
      } else {
        sloganBanner.classList.remove('visible');
      }

      fireUniforms.uTime.value = elapsed;
      fireUniforms.uHeat.value = heatNorm;

      const flicker = Math.sin(elapsed * 21.0) * 0.14 + Math.cos(elapsed * 33.0) * 0.09;
      fireLight.intensity = heatNorm > 0.01 ? (heatNorm * 56 + flicker * 9 * heatNorm) : 0;

      // Synchronize ceremonial side braziers with the main cauldron fire
      sideBrazierLights.forEach((b, idx) => {
        const bFlicker = Math.sin(elapsed * 18.0 + idx) * 0.15;
        b.light.intensity = heatNorm > 0.05 ? (heatNorm * 18 + bFlicker * 4 * heatNorm) : 0;
        b.orb.material.opacity = Math.min(0.9, heatNorm * 1.1);
        b.orb.scale.set(1.1 + bFlicker * 0.1, 1.65 + bFlicker * 0.25, 1.1);
      });

      sparkMat.opacity = Math.min(0.95, heatNorm * 1.15);
      const posArr = sparkGeom.attributes.position.array;
      const spread = 3.6 * Math.sqrt(Math.max(0.05, heatNorm));
      const maxSparkY = 4.90 + heatNorm * 6.0;

      for (let i = 0; i < sparkCount; i++) {
        posArr[i * 3] += sparkVel[i].vx + Math.sin(elapsed * 3 + i) * 0.008;
        posArr[i * 3 + 1] += sparkVel[i].vy * (0.4 + heatNorm * 0.9);
        posArr[i * 3 + 2] += sparkVel[i].vz;

        if (posArr[i * 3 + 1] > maxSparkY || heatNorm < 0.02) {
          posArr[i * 3] = (Math.random() - 0.5) * 2 * spread;
          posArr[i * 3 + 1] = 4.75 + Math.random() * 0.3;
          posArr[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
        }
      }
      sparkGeom.attributes.position.needsUpdate = true;

      // Gentle upward drift for golden celebration dust
      const dArr = dustGeom.attributes.position.array;
      for (let i = 0; i < ambientDustCount; i++) {
        dArr[i * 3 + 1] += 0.006;
        dArr[i * 3] += Math.sin(elapsed * 0.6 + i) * 0.003;
        if (dArr[i * 3 + 1] > 11) dArr[i * 3 + 1] = 0.2;
      }
      dustGeom.attributes.position.needsUpdate = true;

      beamMeshes.forEach((b) => {
        b.cone.rotation.z = b.baseRotZ + Math.sin(elapsed * 0.35 + b.phase) * 0.025;
      });

      composer.render();
    }

    animate();
  </script>
</body>
