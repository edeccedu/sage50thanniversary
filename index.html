<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - 50th Anniversary Grand Cauldron</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050202;
      color: #fff;
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', 'PingFang HK', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Deep Ceremonial Arena & Tiered Auditorium Backdrop */
    .arena-backdrop {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(95, 22, 12, 0.55) 0%, rgba(10, 4, 4, 0.96) 72%),
        repeating-linear-gradient(
          to bottom,
          rgba(255, 215, 130, 0.03) 0px,
          rgba(255, 215, 130, 0.03) 2px,
          transparent 2px,
          transparent 26px
        );
      z-index: 1;
      transition: filter 1.5s ease;
    }

    /* Volumetric Stage Spotlights */
    .spotlights {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .beam {
      position: absolute;
      top: -15%;
      width: 24vw;
      height: 145vh;
      background: radial-gradient(ellipse at top, rgba(210, 232, 255, 0.22) 0%, rgba(255, 220, 150, 0.06) 45%, transparent 72%);
      transform-origin: top center;
      animation: sweep 14s ease-in-out infinite alternate;
    }
    .beam-left { left: 10%; transform: rotate(-28deg); animation-delay: -4s; }
    .beam-center-l { left: 32%; width: 16vw; transform: rotate(-10deg); opacity: 0.45; }
    .beam-center-r { right: 32%; width: 16vw; transform: rotate(10deg); opacity: 0.45; animation-delay: -7s; }
    .beam-right { right: 10%; transform: rotate(28deg); }

    @keyframes sweep {
      0% { transform: rotate(-24deg) scaleX(0.9); opacity: 0.35; }
      50% { transform: rotate(0deg) scaleX(1.15); opacity: 0.7; }
      100% { transform: rotate(24deg) scaleX(0.9); opacity: 0.35; }
    }

    canvas#stage-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 3;
    }

    /* Grand Ceremonial Slogan Reveal Overlay */
    .banner-container {
      position: fixed;
      top: 4vh;
      left: 0;
      width: 100%;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5vw;
      opacity: 0;
      transform: translateY(-25px) scale(0.94);
      transition: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .banner-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .laurel {
      height: 14vh;
      min-height: 90px;
      filter: drop-shadow(0 0 14px rgba(255, 200, 50, 0.75));
    }

    .slogan-plaque {
      background: linear-gradient(180deg, rgba(35, 8, 8, 0.85) 0%, rgba(18, 4, 4, 0.9) 100%);
      border-top: 2px solid rgba(255, 215, 100, 0.8);
      border-bottom: 2px solid rgba(255, 215, 100, 0.8);
      padding: 1.6vh 3.8vw;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85), inset 0 0 25px rgba(255, 190, 50, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slogan-title {
      font-size: 4.8vh;
      font-weight: 900;
      letter-spacing: 0.35em;
      margin-right: -0.35em;
      background: linear-gradient(180deg, #ffffff 0%, #ffe680 45%, #d49b27 85%, #fff3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 12px rgba(255, 180, 0, 0.85));
      line-height: 1.32;
    }

    #setup-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 10, 10, 0.92);
      border: 1px solid rgba(255, 215, 0, 0.5);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    #setup-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="setup-badge">
    <div>Press <b>F</b> for Fullscreen &bull; Press <b>H</b> to hide/show this box</div>
    <div>Backstage Control: <b>/backstage.html</b> &bull; Remote Sync ID: <b id="peer-id-display" style="color:#fff;">Loading...</b></div>
  </div>

  <div class="arena-backdrop" id="ambient-overlay"></div>

  <div class="spotlights">
    <div class="beam beam-left"></div>
    <div class="beam beam-center-l"></div>
    <div class="beam beam-center-r"></div>
    <div class="beam beam-right"></div>
  </div>

  <!-- Ceremonial Slogan Reveal -->
  <div class="banner-container" id="ceremony-slogan">
    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>

    <div class="slogan-plaque">
      <h1 class="slogan-title">五十載耆康安老</h1>
      <h1 class="slogan-title">以初心關顧同行</h1>
    </div>

    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>
  </div>

  <canvas id="stage-canvas"></canvas>

  <script>
    let heatValue = 0;
    let targetHeat = 0;

    const canvas = document.getElementById('stage-canvas');
    const ctx = canvas.getContext('2d');
    const sloganBanner = document.getElementById('ceremony-slogan');
    const setupBadge = document.getElementById('setup-badge');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setupBadge.classList.add('hidden');
      }
      if (e.key === 'h' || e.key === 'H') {
        setupBadge.classList.toggle('hidden');
      }
    });

    function handleCommand(data) {
      if (typeof data.heat === 'number') {
        targetHeat = Math.max(0, Math.min(100, data.heat));
      }
      if (data.hideBadge) setupBadge.classList.add('hidden');
    }

    // 1. Same-Device Sync
    try {
      const channel = new BroadcastChannel('cauldron_ceremony_sync');
      channel.onmessage = (event) => handleCommand(event.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'cauldron_state' && e.newValue) {
        handleCommand(JSON.parse(e.newValue));
      }
    });

    // 2. Cross-Device Wi-Fi Sync
    try {
      if (typeof Peer !== 'undefined') {
        const roomCode = 'cauldron-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomCode);
        peer.on('open', (id) => {
          document.getElementById('peer-id-display').textContent = id.replace('cauldron-', '');
        });
        peer.on('connection', (conn) => {
          setupBadge.classList.add('hidden');
          conn.on('data', (data) => handleCommand(data));
        });
        peer.on('error', () => {
          document.getElementById('peer-id-display').textContent = 'Local Mode';
        });
      } else {
        document.getElementById('peer-id-display').textContent = 'Local Mode';
      }
    } catch (err) {
      document.getElementById('peer-id-display').textContent = 'Local Mode';
    }

    const particles = [];
    const sparks = [];
    const ambientMotes = Array.from({ length: 45 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 2 + 0.6,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -Math.random() * 0.4 - 0.1,
      alpha: Math.random() * 0.5 + 0.15
    }));

    // Height = 50% of viewport height (scaleY), Width >= 56% of viewport width (scaleX)
    function getCauldronMetrics() {
      const baseHeight = 400; // internal height from bowl rim (0) to bottom plinth (400)
      const baseWidth = 760;  // internal bowl rim width (-380 to +380)

      const scaleY = (canvas.height * 0.50) / baseHeight;
      const scaleX = Math.max(scaleY * 1.15, (canvas.width * 0.56) / baseWidth);

      const cX = canvas.width / 2;
      const cY = canvas.height - (baseHeight * scaleY);
      return { cX, cY, scaleX, scaleY };
    }

    function createFireParticle() {
      const { cX, cY, scaleX, scaleY } = getCauldronMetrics();
      const widthRange = 310 * scaleX * (heatValue / 100);
      return {
        x: cX + (Math.random() - 0.5) * widthRange,
        y: cY + (Math.random() - 0.5) * 10 * scaleY,
        vx: (Math.random() - 0.5) * 3.0 * scaleX,
        vy: (-Math.random() * (4.8 + (heatValue / 13)) - 2.2) * scaleY,
        size: (Math.random() * 38 + 16) * Math.min(scaleX, scaleY * 1.25),
        alpha: 1,
        decay: Math.random() * 0.019 + 0.007,
        colorSeed: Math.random()
      };
    }

    function createSparkParticle() {
      const { cX, cY, scaleX, scaleY } = getCauldronMetrics();
      return {
        x: cX + (Math.random() - 0.5) * 340 * scaleX,
        y: cY,
        vx: (Math.random() - 0.5) * 8 * scaleX,
        vy: (-Math.random() * 10 - 3.8) * scaleY,
        size: (Math.random() * 4 + 1.4) * scaleY,
        alpha: 1,
        decay: Math.random() * 0.012 + 0.006
      };
    }

    // Ornate 3D embossed cloud spiral on the bowl
    function drawCloudScroll(x, y, radius, flip) {
      ctx.save();
      ctx.translate(x, y);
      if (flip) ctx.scale(-1, 1);

      ctx.strokeStyle = 'rgba(45, 4, 4, 0.75)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 2, radius, 0.2 * Math.PI, 1.85 * Math.PI);
      ctx.stroke();

      ctx.strokeStyle = '#ffe58f';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0.2 * Math.PI, 1.85 * Math.PI);
      ctx.stroke();

      ctx.strokeStyle = '#ffcf4d';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(2, 0, radius * 0.52, 0, 1.7 * Math.PI);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-radius, 2);
      ctx.quadraticCurveTo(-radius * 1.35, -radius * 0.6, -radius * 1.85, -2);
      ctx.stroke();

      ctx.restore();
    }

    function render() {
      heatValue += (targetHeat - heatValue) * 0.05;

      if (heatValue >= 95) {
        sloganBanner.classList.add('visible');
      } else {
        sloganBanner.classList.remove('visible');
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ceremonial floating gold dust motes across the arena
      ambientMotes.forEach(m => {
        m.x += m.vx;
        m.y += m.vy;
        if (m.y < 0) m.y = canvas.height;
        if (m.x < 0) m.x = canvas.width;
        if (m.x > canvas.width) m.x = 0;
        ctx.fillStyle = `rgba(255, 220, 130, ${m.alpha})`;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      });

      const { cX, cY, scaleX, scaleY } = getCauldronMetrics();

      // Ceremonial Stage Floor & Golden Light Pool
      const floorY = canvas.height - (14 * scaleY);
      const stageFloorGrad = ctx.createRadialGradient(cX, floorY, 20, cX, floorY, 560 * scaleX);
      stageFloorGrad.addColorStop(0, `rgba(255, ${140 - heatValue * 0.6}, 40, ${0.24 + heatValue / 260})`);
      stageFloorGrad.addColorStop(0.55, 'rgba(60, 20, 15, 0.25)');
      stageFloorGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = stageFloorGrad;
      ctx.beginPath();
      ctx.ellipse(cX, floorY, 580 * scaleX, 45 * scaleY, 0, 0, Math.PI * 2);
      ctx.fill();

      // Spawn & Render Sparks
      const sparkSpawnRate = heatValue > 90 ? 24 : Math.floor(heatValue / 5.5);
      for (let i = 0; i < sparkSpawnRate; i++) sparks.push(createSparkParticle());

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.045;
        s.alpha -= s.decay;
        if (s.alpha <= 0) { sparks.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(255, ${170 + Math.random() * 85}, 20, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Spawn & Render Fire
      const fireSpawnCount = Math.floor(heatValue / 2.1);
      for (let i = 0; i < fireSpawnCount; i++) particles.push(createFireParticle());

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }

        let g = p.colorSeed < 0.42 ? Math.floor(195 + Math.random() * 60)
              : p.colorSeed < 0.85 ? Math.floor(75 + Math.random() * 80) : 10;

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        grad.addColorStop(0, `rgba(255, ${g}, 15, ${p.alpha * 0.96})`);
        grad.addColorStop(0.5, `rgba(255, ${Math.max(0, g - 65)}, 0, ${p.alpha * 0.48})`);
        grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // =========================================================================
      // DRAW WIDE MONUMENTAL BEIJING-STYLE CAULDRON (1/2 HEIGHT, >= 1/2 WIDTH)
      // =========================================================================
      ctx.save();
      ctx.translate(cX, cY);
      ctx.scale(scaleX, scaleY);

      // 1. Ceremonial Backlight Aura
      const monumentHalo = ctx.createRadialGradient(0, 150, 40, 0, 150, 460);
      monumentHalo.addColorStop(0, `rgba(255, 200, 120, ${0.24 + heatValue / 380})`);
      monumentHalo.addColorStop(0.6, 'rgba(140, 30, 15, 0.12)');
      monumentHalo.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = monumentHalo;
      ctx.beginPath();
      ctx.arc(0, 150, 460, 0, Math.PI * 2);
      ctx.fill();

      // 2. Stepped Ceremonial Stage Plinth at the Base
      ctx.fillStyle = '#180d0d';
      ctx.fillRect(-260, 380, 520, 20);
      ctx.strokeStyle = '#d4a23c';
      ctx.lineWidth = 2;
      ctx.strokeRect(-260, 380, 520, 20);

      ctx.fillStyle = '#241313';
      ctx.fillRect(-220, 364, 440, 16);
      ctx.strokeStyle = '#ffd866';
      ctx.lineWidth = 2;
      ctx.strokeRect(-220, 364, 440, 16);

      // 3. Exposed Golden Mechanical Burner Collar & Pipes Underneath the Bowl
      const neckGrad = ctx.createLinearGradient(-64, 0, 64, 0);
      neckGrad.addColorStop(0, '#785014');
      neckGrad.addColorStop(0.35, '#ffd966');
      neckGrad.addColorStop(0.65, '#fff0a8');
      neckGrad.addColorStop(1, '#6b4510');
      ctx.fillStyle = neckGrad;
      ctx.fillRect(-52, 74, 104, 40);

      ctx.fillStyle = '#4a300a';
      ctx.fillRect(-30, 78, 10, 32);
      ctx.fillRect(20, 78, 10, 32);
      ctx.strokeStyle = '#ffe58f';
      ctx.lineWidth = 2;
      ctx.strokeRect(-52, 74, 104, 40);

      // 4. Two Tall Angled Gunmetal-Bronze Support Pillars (Left & Right)
      const leftPillarGrad = ctx.createLinearGradient(-200, 0, -90, 0);
      leftPillarGrad.addColorStop(0, '#2a2220');
      leftPillarGrad.addColorStop(0.3, '#5c4d48');
      leftPillarGrad.addColorStop(0.7, '#3b302d');
      leftPillarGrad.addColorStop(1, '#1a1413');
      ctx.fillStyle = leftPillarGrad;
      ctx.beginPath();
      ctx.moveTo(-195, 78);
      ctx.lineTo(-162, 364);
      ctx.lineTo(-102, 364);
      ctx.lineTo(-110, 78);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#8c7552';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 225, 165, 0.35)';
      ctx.beginPath();
      ctx.moveTo(-180, 82);
      ctx.lineTo(-150, 360);
      ctx.stroke();

      const rightPillarGrad = ctx.createLinearGradient(90, 0, 200, 0);
      rightPillarGrad.addColorStop(0, '#1a1413');
      rightPillarGrad.addColorStop(0.3, '#3b302d');
      rightPillarGrad.addColorStop(0.7, '#5c4d48');
      rightPillarGrad.addColorStop(1, '#2a2220');
      ctx.fillStyle = rightPillarGrad;
      ctx.beginPath();
      ctx.moveTo(110, 78);
      ctx.lineTo(102, 364);
      ctx.lineTo(162, 364);
      ctx.lineTo(195, 78);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#8c7552';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 225, 165, 0.35)';
      ctx.beginPath();
      ctx.moveTo(180, 82);
      ctx.lineTo(150, 360);
      ctx.stroke();

      // 5. Suspended Trapezoidal Imperial Crimson Plaque Between the Pillars
      const plaqueGrad = ctx.createLinearGradient(-115, 102, 115, 295);
      plaqueGrad.addColorStop(0, '#d91c1c');
      plaqueGrad.addColorStop(0.45, '#b81212');
      plaqueGrad.addColorStop(1, '#7a0909');

      // Drop shadow behind plaque
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.beginPath();
      ctx.moveTo(-116, 108);
      ctx.lineTo(116, 108);
      ctx.lineTo(95, 302);
      ctx.lineTo(-95, 302);
      ctx.closePath();
      ctx.fill();

      // Main Red Plaque
      ctx.fillStyle = plaqueGrad;
      ctx.beginPath();
      ctx.moveTo(-114, 102);
      ctx.lineTo(114, 102);
      ctx.lineTo(93, 294);
      ctx.lineTo(-93, 294);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#ffd866';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 225, 130, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-98, 112);
      ctx.lineTo(98, 112);
      ctx.lineTo(80, 284);
      ctx.lineTo(-80, 284);
      ctx.closePath();
      ctx.stroke();

      // Ceremonial Emblem & Calligraphy Inside the Crimson Plaque
      ctx.strokeStyle = '#ffe58f';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 152, 22, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#fff3b8';
      ctx.font = 'bold 23px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('50', 0, 160);

      ctx.fillStyle = '#ffe58f';
      ctx.font = 'bold 18px "Noto Serif TC", "Songti TC", "PingFang HK", serif';
      ctx.fillText('五十載', 0, 200);
      ctx.fillText('耆康安老', 0, 226);

      // Decorative interlocking rings at bottom of plaque
      ctx.strokeStyle = 'rgba(255, 225, 130, 0.85)';
      ctx.lineWidth = 2;
      [-28, -14, 0, 14, 28].forEach((rx, idx) => {
        ctx.beginPath();
        ctx.arc(rx, idx % 2 === 0 ? 256 : 262, 7.5, 0, Math.PI * 2);
        ctx.stroke();
      });

      // 6. Wide Shallow Olympic Cauldron Bowl (Top Crown - Spans >= 1/2 Screen Width)
      ctx.fillStyle = '#290707';
      ctx.beginPath();
      ctx.ellipse(0, 2, 370, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffd866';
      ctx.lineWidth = 3;
      ctx.stroke();

      const bowlGrad = ctx.createLinearGradient(-380, 0, 380, 0);
      bowlGrad.addColorStop(0, '#5e0808');
      bowlGrad.addColorStop(0.2, '#b51616');
      bowlGrad.addColorStop(0.5, '#e0281b');
      bowlGrad.addColorStop(0.8, '#b51616');
      bowlGrad.addColorStop(1, '#5e0808');

      ctx.fillStyle = bowlGrad;
      ctx.beginPath();
      ctx.moveTo(-380, 0);
      ctx.bezierCurveTo(-330, 86, 330, 86, 380, 0);
      ctx.bezierCurveTo(225, 14, -225, 14, -380, 0);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#ffe58f';
      ctx.lineWidth = 5;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 215, 100, 0.65)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-358, 10);
      ctx.quadraticCurveTo(0, 22, 358, 10);
      ctx.stroke();

      // 7. Rich 3D Auspicious Cloud Scrolls Across the Wide Bowl Face
      const scrollPositions = [
        { x: -290, y: 29, r: 15, flip: false },
        { x: -215, y: 38, r: 17, flip: true },
        { x: -142, y: 45, r: 18, flip: false },
        { x: -70,  y: 49, r: 19, flip: true },
        { x: 0,    y: 50, r: 20, flip: false },
        { x: 70,   y: 49, r: 19, flip: true },
        { x: 142,  y: 45, r: 18, flip: false },
        { x: 215,  y: 38, r: 17, flip: true },
        { x: 290,  y: 29, r: 15, flip: false }
      ];
      scrollPositions.forEach(s => drawCloudScroll(s.x, s.y, s.r, s.flip));

      // Lit Bowl Rim Reflection when fire is burning
      if (heatValue > 5) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const fireRimGlow = ctx.createRadialGradient(0, 0, 10, 0, 0, 380);
        fireRimGlow.addColorStop(0, `rgba(255, 200, 80, ${heatValue / 140})`);
        fireRimGlow.addColorStop(1, 'rgba(255, 60, 0, 0)');
        ctx.fillStyle = fireRimGlow;
        ctx.beginPath();
        ctx.ellipse(0, 5, 380, 32, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
