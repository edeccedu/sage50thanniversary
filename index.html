<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - 50th Anniversary Ceremonial Cauldron</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060306;
      color: #fff;
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', 'PingFang HK', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Deep Ceremonial Vignette */
    .cinema-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 52%, transparent 52%, rgba(4, 1, 3, 0.72) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Frameless Floating Golden Vertical Slogan (Left & Right - Zero Fire Overlap) */
    .slogan-side {
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .slogan-left {
      left: 6vw;
      transform: translateX(-32px);
    }

    .slogan-right {
      right: 6vw;
      transform: translateX(32px);
    }

    .slogan-side.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .floating-vertical-text {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 5.4vh;
      font-weight: 900;
      letter-spacing: 0.34em;
      margin-bottom: -0.34em;
      background: linear-gradient(180deg, #ffffff 0%, #ffed9e 32%, #e4a928 70%, #fff7cc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 18px rgba(255, 180, 0, 0.85)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95));
      line-height: 1.2;
      user-select: none;
    }

    #setup-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(18, 8, 12, 0.92);
      border: 1px solid rgba(255, 215, 0, 0.6);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    #setup-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="setup-badge">
    <div>Press <b>F</b> for Fullscreen &bull; Press <b>H</b> to hide/show this box</div>
    <div>Backstage Control: <b>/backstage.html</b> &bull; Remote Sync ID: <b id="peer-id-display" style="color:#fff;">Loading...</b></div>
  </div>

  <div id="webgl-container"></div>
  <div class="cinema-vignette"></div>

  <!-- Left Side Frameless Golden Slogan -->
  <div class="slogan-side slogan-left" id="ceremony-slogan-left">
    <h2 class="floating-vertical-text">以初心關顧同行</h2>
  </div>

  <!-- Right Side Frameless Golden Slogan -->
  <div class="slogan-side slogan-right" id="ceremony-slogan-right">
    <h2 class="floating-vertical-text">五十載耆康安老</h2>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { Reflector } from 'three/addons/objects/Reflector.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let heatValue = 0;
    let targetHeat = 0;

    const sloganLeft = document.getElementById('ceremony-slogan-left');
    const sloganRight = document.getElementById('ceremony-slogan-right');
    const setupBadge = document.getElementById('setup-badge');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setupBadge.classList.add('hidden');
      }
      if (e.key === 'h' || e.key === 'H') {
        setupBadge.classList.toggle('hidden');
      }
    });

    function handleCommand(data) {
      if (typeof data.heat === 'number') {
        targetHeat = Math.max(0, Math.min(100, data.heat));
      }
      if (data.hideBadge) setupBadge.classList.add('hidden');
    }

    try {
      const channel = new BroadcastChannel('cauldron_ceremony_sync');
      channel.onmessage = (event) => handleCommand(event.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'cauldron_state' && e.newValue) {
        handleCommand(JSON.parse(e.newValue));
      }
    });

    try {
      if (typeof Peer !== 'undefined') {
        const roomCode = 'cauldron-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomCode);
        peer.on('open', (id) => {
          document.getElementById('peer-id-display').textContent = id.replace('cauldron-', '');
        });
        peer.on('connection', (conn) => {
          setupBadge.classList.add('hidden');
          conn.on('data', (data) => handleCommand(data));
        });
        peer.on('error', () => {
          document.getElementById('peer-id-display').textContent = 'Local Mode';
        });
      }
    } catch (err) {
      document.getElementById('peer-id-display').textContent = 'Local Mode';
    }

    // --- Three.js Ultra-HD Scene, Camera & Renderer ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070408);
    scene.fog = new THREE.FogExp2(0x080408, 0.014);

    const camera = new THREE.PerspectiveCamera(33, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 3.85, 17.8);
    camera.lookAt(0, 3.35, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      precision: 'highp'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.24;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    // =========================================================================
    // 1. DARK, CEREMONIOUS & PROSPEROUS STUDIO REFLECTION ENVIRONMENT
    // =========================================================================
    function buildDarkCeremonialEnvironment() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();

      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(60, 48, 24),
        new THREE.MeshBasicMaterial({ color: 0x14080d, side: THREE.BackSide })
      );
      envScene.add(dome);

      const softboxes = [
        { pos: [-16, 22, 14], color: 0xfff0d0, size: [6, 20] },
        { pos: [16, 22, 14], color: 0xfff0d0, size: [6, 20] },
        { pos: [-6, 26, 8], color: 0xffffff, size: [8, 12] },
        { pos: [6, 26, 8], color: 0xffe4b2, size: [8, 12] },
        { pos: [-16, 5, 10], color: 0xff9e44, size: [4, 18] },
        { pos: [16, 5, 10], color: 0xff9e44, size: [4, 18] },
        { pos: [0, -12, 10], color: 0x3b1414, size: [36, 18] }
      ];
      softboxes.forEach(sb => {
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(sb.size[0], sb.size[1]),
          new THREE.MeshBasicMaterial({ color: sb.color })
        );
        panel.position.set(...sb.pos);
        panel.lookAt(0, 3, 0);
        envScene.add(panel);
      });

      const envRT = pmrem.fromScene(envScene, 0.018);
      scene.environment = envRT.texture;
      pmrem.dispose();
    }
    buildDarkCeremonialEnvironment();

    // =========================================================================
    // 2. HIGH-RESOLUTION PROCEDURAL PBR TEXTURES
    // =========================================================================
    function createBrushedMetalMaps() {
      const size = 1024;
      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = size; roughCanvas.height = size;
      const rCtx = roughCanvas.getContext('2d');
      const rImg = rCtx.createImageData(size, size);

      const normCanvas = document.createElement('canvas');
      normCanvas.width = size; normCanvas.height = size;
      const nCtx = normCanvas.getContext('2d');
      const nImg = nCtx.createImageData(size, size);

      const heights = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const streak = Math.sin(x * 0.55 + Math.sin(y * 0.04) * 2.0) * 0.5 + (Math.random() - 0.5) * 0.65;
          heights[y * size + x] = streak;
          const rVal = Math.max(38, Math.min(215, 92 + streak * 30));
          const idx = (y * size + x) * 4;
          rImg.data[idx] = rVal;
          rImg.data[idx + 1] = rVal;
          rImg.data[idx + 2] = rVal;
          rImg.data[idx + 3] = 255;
        }
      }
      rCtx.putImageData(rImg, 0, 0);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const xL = (x - 1 + size) % size;
          const xR = (x + 1) % size;
          const yU = (y - 1 + size) % size;
          const yD = (y + 1) % size;
          const dx = (heights[y * size + xL] - heights[y * size + xR]) * 1.4;
          const dy = (heights[yU * size + x] - heights[yD * size + x]) * 0.4;
          const dz = 1.0;
          const invLen = 1.0 / Math.sqrt(dx * dx + dy * dy + dz * dz);
          const idx = (y * size + x) * 4;
          nImg.data[idx] = ((dx * invLen) * 0.5 + 0.5) * 255;
          nImg.data[idx + 1] = ((dy * invLen) * 0.5 + 0.5) * 255;
          nImg.data[idx + 2] = ((dz * invLen) * 0.5 + 0.5) * 255;
          nImg.data[idx + 3] = 255;
        }
      }
      nCtx.putImageData(nImg, 0, 0);

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.repeat.set(4, 4);
      roughnessMap.anisotropy = maxAnisotropy;

      const normalMap = new THREE.CanvasTexture(normCanvas);
      normalMap.wrapS = normalMap.wrapT = THREE.RepeatWrapping;
      normalMap.repeat.set(4, 4);
      normalMap.anisotropy = maxAnisotropy;

      return { roughnessMap, normalMap };
    }

    function createDarkObsidianMarbleTexture() {
      const size = 2048;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0d090e';
      ctx.fillRect(0, 0, size, size);

      for (let v = 0; v < 36; v++) {
        ctx.beginPath();
        let px = Math.random() * size;
        let py = Math.random() * size;
        ctx.moveTo(px, py);
        for (let step = 0; step < 22; step++) {
          px += (Math.random() - 0.35) * 140;
          py += (Math.random() - 0.35) * 140;
          ctx.lineTo(px, py);
        }
        ctx.strokeStyle = v % 2 === 0 ? 'rgba(235, 188, 102, 0.14)' : 'rgba(150, 95, 95, 0.08)';
        ctx.lineWidth = Math.random() * 2.8 + 0.6;
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(235, 190, 105, 0.20)';
      ctx.lineWidth = 2.5;
      for (let g = 0; g <= size; g += 512) {
        ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(size, g); ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 4);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAnisotropy;
      return tex;
    }

    // Pure, Clean Dark Imperial Crimson-to-Obsidian Radial Gradient (No Circles or Sunburst Rays)
    function createCleanCeremonialBackdropTexture() {
      const w = 2048;
      const h = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');

      const radGrad = ctx.createRadialGradient(w * 0.5, h * 0.52, 40, w * 0.5, h * 0.52, w * 0.55);
      radGrad.addColorStop(0.0, '#2a090d');
      radGrad.addColorStop(0.38, '#170508');
      radGrad.addColorStop(0.75, '#0b0407');
      radGrad.addColorStop(1.0, '#060306');
      ctx.fillStyle = radGrad;
      ctx.fillRect(0, 0, w, h);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAnisotropy;
      return tex;
    }

    // Ultra-Crisp 2048x2304 SAGE 50th Anniversary Plaque Logo
    function createSage50PlaqueMaps() {
      const w = 2048;
      const h = 2304;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = w; colorCanvas.height = h;
      const ctx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = w; bumpCanvas.height = h;
      const bCtx = bumpCanvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#cc1814');
      bgGrad.addColorStop(0.55, '#b5120e');
      bgGrad.addColorStop(1, '#8f0b08');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      bCtx.fillStyle = '#000000';
      bCtx.fillRect(0, 0, w, h);

      function renderLogoArtwork(c, isBump) {
        c.save();
        c.scale(2, 2);
        const cw = 1024, ch = 1152;
        c.translate(cw * 0.5, ch * 0.44);

        c.strokeStyle = isBump ? '#b0b0b0' : 'rgba(255, 224, 130, 0.72)';
        c.lineWidth = 4;
        c.strokeRect(-420, -455, 840, 1020);
        c.lineWidth = 1.5;
        c.strokeRect(-406, -441, 812, 992);

        const goldGrad = c.createLinearGradient(-280, -260, 280, 260);
        goldGrad.addColorStop(0.0, '#fff7cc');
        goldGrad.addColorStop(0.35, '#f5cc6c');
        goldGrad.addColorStop(0.7, '#d99c2e');
        goldGrad.addColorStop(1.0, '#ffeba0');

        const fillMain = isBump ? '#ffffff' : goldGrad;
        const fillAccent = isBump ? '#dcdcdc' : '#fff8d6';

        if (!isBump) {
          c.shadowColor = 'rgba(50, 4, 3, 0.58)';
          c.shadowBlur = 20;
          c.shadowOffsetY = 9;
        }

        // Stylised Ribbon Numeral "5"
        c.fillStyle = fillMain;
        c.beginPath();
        c.moveTo(-255, -245);
        c.quadraticCurveTo(-130, -255, -25, -238);
        c.lineTo(-42, -182);
        c.quadraticCurveTo(-135, -196, -205, -188);
        c.lineTo(-218, -95);
        c.quadraticCurveTo(-150, -125, -85, -92);
        c.quadraticCurveTo(-20, -55, -25, 22);
        c.quadraticCurveTo(-32, 108, -128, 128);
        c.quadraticCurveTo(-228, 145, -278, 72);
        c.lineTo(-225, 36);
        c.quadraticCurveTo(-190, 82, -135, 74);
        c.quadraticCurveTo(-82, 65, -80, 12);
        c.quadraticCurveTo(-78, -42, -142, -48);
        c.quadraticCurveTo(-195, -52, -235, -20);
        c.lineTo(-268, -32);
        c.closePath();
        c.fill();

        // Flowing Circle / Ribbon "0"
        c.lineWidth = 46;
        c.strokeStyle = fillMain;
        c.beginPath();
        c.ellipse(135, -55, 118, 168, 0.14, 0.25 * Math.PI, 1.92 * Math.PI);
        c.stroke();

        c.fillStyle = fillAccent;
        c.beginPath();
        c.arc(145, -118, 24, 0, Math.PI * 2);
        c.fill();

        c.beginPath();
        c.moveTo(45, -25);
        c.bezierCurveTo(95, -85, 185, -75, 235, -15);
        c.bezierCurveTo(185, -35, 105, -35, 55, 15);
        c.closePath();
        c.fill();

        c.fillStyle = fillAccent;
        c.textAlign = 'center';
        c.font = '900 62px "Noto Serif TC", "PingFang HK", "Microsoft JhengHei", sans-serif';
        c.fillText('耆康會  SAGE', 0, 212);

        c.strokeStyle = fillMain;
        c.lineWidth = 3;
        c.beginPath();
        c.moveTo(-270, 242);
        c.lineTo(270, 242);
        c.stroke();

        c.fillStyle = fillMain;
        c.font = 'bold 34px "Noto Serif TC", "Songti TC", "PingFang HK", serif';
        c.fillText('五十載耆康安老  以初心關顧同行', 0, 294);

        c.restore();
      }

      renderLogoArtwork(ctx, false);
      renderLogoArtwork(bCtx, true);

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.colorSpace = THREE.SRGBColorSpace;
      colorTex.anisotropy = maxAnisotropy;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = maxAnisotropy;

      return { colorTex, bumpTex };
    }

    const { roughnessMap: brushedRoughness, normalMap: brushedNormal } = createBrushedMetalMaps();
    const marbleSlabTex = createDarkObsidianMarbleTexture();
    const backdropTex = createCleanCeremonialBackdropTexture();
    const { colorTex: plaqueColorTex, bumpTex: plaqueBumpTex } = createSage50PlaqueMaps();

    // =========================================================================
    // 3. CLEAN DARK OBSIDIAN-MARBLE STAGE & 24K GOLD CEREMONIAL RINGS
    // =========================================================================
    const floorGroup = new THREE.Group();
    scene.add(floorGroup);

    const floorMirror = new Reflector(new THREE.PlaneGeometry(90, 44), {
      clipBias: 0.003,
      textureWidth: 2048,
      textureHeight: 2048,
      color: 0x776e66
    });
    floorMirror.rotation.x = -Math.PI / 2;
    floorMirror.position.set(0, -0.002, 2);
    floorGroup.add(floorMirror);

    const polishedMarbleDeck = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 44),
      new THREE.MeshPhysicalMaterial({
        map: marbleSlabTex,
        color: 0x1e181e,
        roughness: 0.14,
        metalness: 0.25,
        clearcoat: 1.0,
        clearcoatRoughness: 0.06,
        transparent: true,
        opacity: 0.78
      })
    );
    polishedMarbleDeck.rotation.x = -Math.PI / 2;
    polishedMarbleDeck.position.set(0, 0.001, 2);
    polishedMarbleDeck.receiveShadow = true;
    floorGroup.add(polishedMarbleDeck);

    const goldInlayMat = new THREE.MeshStandardMaterial({
      color: 0xf5c869,
      metalness: 0.96,
      roughness: 0.15
    });

    [2.68, 3.85, 5.10].forEach(radius => {
      const ring = new THREE.Mesh(new THREE.RingGeometry(radius - 0.035, radius + 0.035, 128), goldInlayMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(0, 0.004, 0);
      floorGroup.add(ring);
    });

    // =========================================================================
    // 4. CLEAN, DARK & PROSPEROUS CEREMONIAL BACKDROP (No Circles Behind Fire)
    // =========================================================================
    const backdropGroup = new THREE.Group();
    scene.add(backdropGroup);

    const backdropWall = new THREE.Mesh(
      new THREE.PlaneGeometry(68, 34),
      new THREE.MeshBasicMaterial({ map: backdropTex, fog: false })
    );
    backdropWall.position.set(0, 9.5, -18);
    backdropGroup.add(backdropWall);

    const beamMeshes = [];
    function createCeremonialBeam(x, y, z, targetX, targetY, targetZ, beamRadius, beamLength, opacity) {
      const coneGeom = new THREE.ConeGeometry(beamRadius, beamLength, 40, 1, true);
      coneGeom.translate(0, -beamLength / 2, 0);
      const coneMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        uniforms: {
          uColor: { value: new THREE.Color(0xffe09e) },
          uOpacity: { value: opacity }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mvPos.xyz;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vec3 viewDir = normalize(vViewPos);
            float edgeFade = pow(abs(dot(vNormal, viewDir)), 1.9);
            float verticalFade = smoothstep(0.0, 0.78, vUv.y) * smoothstep(1.0, 0.88, vUv.y);
            gl_FragColor = vec4(uColor, edgeFade * verticalFade * uOpacity);
          }
        `
      });
      const cone = new THREE.Mesh(coneGeom, coneMat);
      cone.position.set(x, y, z);
      cone.lookAt(targetX, targetY, targetZ);
      cone.rotateX(Math.PI / 2);
      backdropGroup.add(cone);
      beamMeshes.push({ cone, baseRotZ: cone.rotation.z, phase: Math.random() * Math.PI * 2 });
    }

    createCeremonialBeam(-11.5, 15.5, -14, -2.5, 1.0, -2, 3.4, 24, 0.13);
    createCeremonialBeam(11.5, 15.5, -14, 2.5, 1.0, -2, 3.4, 24, 0.13);
    createCeremonialBeam(-6.5, 15.5, -12, 0.0, 2.5, 0, 3.8, 22, 0.14);
    createCeremonialBeam(6.5, 15.5, -12, 0.0, 2.5, 0, 3.8, 22, 0.14);

    // --- Post-Processing Bloom ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.66,
      0.48,
      0.83
    );
    composer.addPass(bloomPass);

    // =========================================================================
    // 5. ULTRA-HIGH-POLY 24K GOLD, BRONZE & LACQUERED CRIMSON CAULDRON
    // =========================================================================
    const cauldronGroup = new THREE.Group();
    scene.add(cauldronGroup);

    const hammeredCopperMat = new THREE.MeshPhysicalMaterial({
      color: 0x73140b,
      metalness: 0.92,
      roughness: 0.24,
      roughnessMap: brushedRoughness,
      normalMap: brushedNormal,
      normalScale: new THREE.Vector2(0.35, 0.35),
      clearcoat: 0.55,
      clearcoatRoughness: 0.18,
      side: THREE.DoubleSide
    });

    const champagneGoldMat = new THREE.MeshPhysicalMaterial({
      color: 0xf2c86b,
      metalness: 0.97,
      roughness: 0.14,
      roughnessMap: brushedRoughness,
      normalMap: brushedNormal,
      normalScale: new THREE.Vector2(0.2, 0.2),
      clearcoat: 0.35
    });

    const castBronzeBaseMat = new THREE.MeshPhysicalMaterial({
      color: 0xd49552,
      metalness: 0.94,
      roughness: 0.20,
      roughnessMap: brushedRoughness,
      normalMap: brushedNormal,
      normalScale: new THREE.Vector2(0.25, 0.25)
    });

    const brushedTitaniumMat = new THREE.MeshPhysicalMaterial({
      color: 0x4b4652,
      metalness: 0.90,
      roughness: 0.24,
      roughnessMap: brushedRoughness,
      normalMap: brushedNormal,
      normalScale: new THREE.Vector2(0.3, 0.3)
    });

    const lacquerCrimsonMat = new THREE.MeshPhysicalMaterial({
      map: plaqueColorTex,
      bumpMap: plaqueBumpTex,
      bumpScale: 0.04,
      metalness: 0.24,
      roughness: 0.22,
      clearcoat: 0.92,
      clearcoatRoughness: 0.10
    });

    // Optional Auto-Load for External PNG File ("sage-50-logo.png" in repo)
    const imgLoader = new THREE.ImageLoader();
    imgLoader.load(
      './sage-50-logo.png',
      (loadedImg) => {
        const w = 2048, h = 2304;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');

        const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
        bgGrad.addColorStop(0, '#cc1814');
        bgGrad.addColorStop(0.55, '#b5120e');
        bgGrad.addColorStop(1, '#8f0b08');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        const scale = Math.min((w * 0.78) / loadedImg.width, (h * 0.72) / loadedImg.height);
        const dw = loadedImg.width * scale;
        const dh = loadedImg.height * scale;
        ctx.drawImage(loadedImg, (w - dw) / 2, (h - dh) / 2, dw, dh);

        const customTex = new THREE.CanvasTexture(c);
        customTex.colorSpace = THREE.SRGBColorSpace;
        customTex.anisotropy = maxAnisotropy;
        lacquerCrimsonMat.map = customTex;
        lacquerCrimsonMat.needsUpdate = true;
      },
      undefined,
      () => {}
    );

    // 1. Stepped Circular Cast-Bronze Pedestal Base
    const baseLowerDisc = new THREE.Mesh(new THREE.CylinderGeometry(2.08, 2.16, 0.14, 96), castBronzeBaseMat);
    baseLowerDisc.position.set(0, 0.07, 0);
    baseLowerDisc.castShadow = true;
    baseLowerDisc.receiveShadow = true;
    cauldronGroup.add(baseLowerDisc);

    const baseUpperDisc = new THREE.Mesh(new THREE.CylinderGeometry(1.94, 2.02, 0.12, 96), castBronzeBaseMat);
    baseUpperDisc.position.set(0, 0.20, 0);
    baseUpperDisc.castShadow = true;
    cauldronGroup.add(baseUpperDisc);

    const baseGoldRing = new THREE.Mesh(new THREE.TorusGeometry(2.04, 0.032, 20, 112), champagneGoldMat);
    baseGoldRing.rotation.x = Math.PI / 2;
    baseGoldRing.position.set(0, 0.15, 0);
    cauldronGroup.add(baseGoldRing);

    // 2. Four Chamfered Brushed-Titanium Tower Pillars with Gold Inlays
    function createLuxuryPillar(xPos, zPos, mirrorX, mirrorZ) {
      const group = new THREE.Group();

      const shape = new THREE.Shape();
      shape.moveTo(-0.28, 0);
      shape.lineTo(0.28, 0);
      shape.lineTo(0.46, 3.64);
      shape.lineTo(-0.26, 3.64);
      shape.closePath();

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.56,
        bevelEnabled: true,
        bevelThickness: 0.034,
        bevelSize: 0.034,
        bevelSegments: 5
      });
      geom.center();

      const mesh = new THREE.Mesh(geom, brushedTitaniumMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);

      const inlay = new THREE.Mesh(new THREE.BoxGeometry(0.04, 3.60, 0.63), champagneGoldMat);
      inlay.position.set(0.36, 0, 0);
      inlay.rotation.z = -0.048;
      group.add(inlay);

      group.position.set(xPos, 2.08, zPos);
      group.scale.set(mirrorX, 1, mirrorZ);
      group.rotation.y = mirrorX * mirrorZ * -0.18;
      return group;
    }

    cauldronGroup.add(createLuxuryPillar(-1.38, 0.58, -1, 1));
    cauldronGroup.add(createLuxuryPillar(1.38, 0.58, 1, 1));
    cauldronGroup.add(createLuxuryPillar(-1.18, -0.68, -1, -1));
    cauldronGroup.add(createLuxuryPillar(1.18, -0.68, 1, -1));

    const baseWarmGlow = new THREE.PointLight(0xff8c2b, 26, 10.5, 1.4);
    baseWarmGlow.position.set(0, 0.95, 1.85);
    cauldronGroup.add(baseWarmGlow);

    // 3. Exposed Precision-Machined Gold Burner Manifold
    const burnerCore = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.46, 0.72, 48), champagneGoldMat);
    burnerCore.position.set(0, 3.72, 0);
    cauldronGroup.add(burnerCore);

    [3.52, 3.76].forEach(ry => {
      const collar = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.034, 18, 48), champagneGoldMat);
      collar.rotation.x = Math.PI / 2;
      collar.position.set(0, ry, 0);
      cauldronGroup.add(collar);
    });

    [-0.30, -0.10, 0.10, 0.30].forEach(px => {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.82, 18), champagneGoldMat);
      pipe.position.set(px, 3.70, 0.46);
      cauldronGroup.add(pipe);
    });

    // 4. Trapezoidal Crimson Plaque with Ultra-Crisp SAGE 50th Logo
    const shieldShape = new THREE.Shape();
    shieldShape.moveTo(-0.88, -1.24);
    shieldShape.lineTo(0.88, -1.24);
    shieldShape.lineTo(1.12, 1.24);
    shieldShape.lineTo(-1.12, 1.24);
    shieldShape.closePath();

    const shieldGeom = new THREE.ExtrudeGeometry(shieldShape, {
      depth: 0.14,
      bevelEnabled: true,
      bevelThickness: 0.018,
      bevelSize: 0.018,
      bevelSegments: 4
    });
    shieldGeom.center();

    const sPos = shieldGeom.attributes.position;
    const sUv = shieldGeom.attributes.uv;
    for (let i = 0; i < sPos.count; i++) {
      const x = sPos.getX(i);
      const y = sPos.getY(i);
      sUv.setXY(i, (x / 2.28) + 0.5, (y / 2.52) + 0.5);
    }

    const plaqueMesh = new THREE.Mesh(shieldGeom, lacquerCrimsonMat);
    plaqueMesh.position.set(0, 2.28, 0.66);
    plaqueMesh.castShadow = true;
    plaqueMesh.receiveShadow = true;
    cauldronGroup.add(plaqueMesh);

    // 5. Ultra-Smooth 144-Segment Bowl + High-Relief 24K Gold Cloud Filigree
    const bowlPoints = [
      new THREE.Vector2(0.0, 0.0),
      new THREE.Vector2(1.45, 0.04),
      new THREE.Vector2(2.85, 0.26),
      new THREE.Vector2(3.98, 0.68),
      new THREE.Vector2(4.56, 1.08),
      new THREE.Vector2(4.38, 1.10),
      new THREE.Vector2(3.60, 0.72),
      new THREE.Vector2(0.0, 0.48)
    ];
    const bowlGeom = new THREE.LatheGeometry(bowlPoints, 144);
    const bowlMesh = new THREE.Mesh(bowlGeom, hammeredCopperMat);
    bowlMesh.position.set(0, 3.80, 0);
    bowlMesh.castShadow = true;
    bowlMesh.receiveShadow = true;
    cauldronGroup.add(bowlMesh);

    const filigreeGroup = new THREE.Group();
    filigreeGroup.position.set(0, 3.80, 0);
    cauldronGroup.add(filigreeGroup);

    const topRimOuter = new THREE.Mesh(new THREE.TorusGeometry(4.50, 0.052, 22, 160), champagneGoldMat);
    topRimOuter.rotation.x = Math.PI / 2;
    topRimOuter.position.y = 1.06;
    filigreeGroup.add(topRimOuter);

    const topRimInner = new THREE.Mesh(new THREE.TorusGeometry(4.34, 0.032, 18, 160), champagneGoldMat);
    topRimInner.rotation.x = Math.PI / 2;
    topRimInner.position.y = 1.09;
    filigreeGroup.add(topRimInner);

    const midRib = new THREE.Mesh(new THREE.TorusGeometry(3.68, 0.03, 16, 140), champagneGoldMat);
    midRib.rotation.x = Math.PI / 2;
    midRib.position.y = 0.56;
    filigreeGroup.add(midRib);

    const lowRim = new THREE.Mesh(new THREE.TorusGeometry(2.42, 0.038, 16, 120), champagneGoldMat);
    lowRim.rotation.x = Math.PI / 2;
    lowRim.position.y = 0.19;
    filigreeGroup.add(lowRim);

    function bowlSurfacePoint(theta, t, relief = 0.048) {
      const r = 1.45 + t * 3.12 + relief;
      const y = 0.04 + Math.pow(t, 1.48) * 1.02;
      return new THREE.Vector3(Math.sin(theta) * r, y, Math.cos(theta) * r);
    }

    const numSpirals = 24;
    for (let i = 0; i < numSpirals; i++) {
      const baseTheta = (i / numSpirals) * Math.PI * 2;
      const dir = i % 2 === 0 ? 1 : -1;

      const ptsUpper = [];
      const turns = 2.15;
      const steps = 56;
      for (let s = 0; s <= steps; s++) {
        const frac = s / steps;
        const angle = frac * Math.PI * 2 * turns;
        const spiralRad = frac * 0.115;
        const theta = baseTheta + Math.cos(angle) * spiralRad * dir;
        const t = 0.68 + Math.sin(angle) * 0.24 * frac;
        ptsUpper.push(bowlSurfacePoint(theta, Math.max(0.15, Math.min(0.96, t)), 0.048));
      }
      const upperCurve = new THREE.CatmullRomCurve3(ptsUpper);
      filigreeGroup.add(new THREE.Mesh(
        new THREE.TubeGeometry(upperCurve, 52, 0.034, 12, false),
        champagneGoldMat
      ));

      const ptsLower = [];
      const lowBaseTheta = baseTheta + (Math.PI / numSpirals);
      for (let s = 0; s <= 44; s++) {
        const frac = s / 44;
        const angle = frac * Math.PI * 2 * 1.85;
        const spiralRad = frac * 0.085;
        const theta = lowBaseTheta - Math.cos(angle) * spiralRad * dir;
        const t = 0.34 + Math.sin(angle) * 0.17 * frac;
        ptsLower.push(bowlSurfacePoint(theta, Math.max(0.10, Math.min(0.62, t)), 0.044));
      }
      const lowerCurve = new THREE.CatmullRomCurve3(ptsLower);
      filigreeGroup.add(new THREE.Mesh(
        new THREE.TubeGeometry(lowerCurve, 40, 0.027, 12, false),
        champagneGoldMat
      ));
    }

    // =========================================================================
    // 6. CEREMONIAL LIGHTING
    // =========================================================================
    const hemiLight = new THREE.HemisphereLight(0xffeed0, 0x3b1e1c, 1.25);
    scene.add(hemiLight);

    const frontKeyLight = new THREE.DirectionalLight(0xfff6e8, 2.5);
    frontKeyLight.position.set(4.5, 11.5, 13.0);
    frontKeyLight.castShadow = true;
    frontKeyLight.shadow.mapSize.set(2048, 2048);
    scene.add(frontKeyLight);

    const leftRimLight = new THREE.DirectionalLight(0xffdfa8, 1.45);
    leftRimLight.position.set(-10, 9, 4);
    scene.add(leftRimLight);

    const stageSpot = new THREE.SpotLight(0xfff2d6, 72, 40, Math.PI / 4.6, 0.65, 1.0);
    stageSpot.position.set(0, 13, 6);
    stageSpot.target.position.set(0, 0, 0);
    scene.add(stageSpot);
    scene.add(stageSpot.target);

    const fireLight = new THREE.PointLight(0xff8c1a, 0, 32, 1.2);
    fireLight.position.set(0, 6.1, 0.9);
    scene.add(fireLight);

    // =========================================================================
    // 7. PHOTOREALISTIC MULTI-LAYERED OLYMPIC FLAME & GOLDEN SPARKS
    // =========================================================================
    const fireUniforms = {
      uTime: { value: 0 },
      uHeat: { value: 0 }
    };

    const fireMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: fireUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uHeat;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.52;
          for (int i = 0; i < 6; i++) {
            v += a * noise(p);
            p *= 2.12;
            a *= 0.49;
          }
          return v;
        }

        void main() {
          if (uHeat <= 0.005) discard;

          vec2 uv = vUv;
          float nx = (uv.x - 0.5) * 2.0;
          float ny = uv.y;

          float maxH = mix(0.10, 0.98, uHeat);
          float hNorm = ny / maxH;
          if (hNorm > 1.05) discard;

          float widthAtHeight = mix(mix(0.28, 0.82, sqrt(uHeat)), 0.14, pow(clamp(hNorm, 0.0, 1.0), 0.9));

          vec2 warpUv = vec2(nx * 4.6, ny * 3.2 - uTime * 3.8);
          float warp = fbm(warpUv);
          vec2 detailUv = vec2((nx + (warp - 0.5) * 0.42) * 6.8, ny * 4.8 - uTime * 4.9);
          float tongues = fbm(detailUv);

          float bowlEnvelope = smoothstep(widthAtHeight, widthAtHeight * 0.18, abs(nx + (warp - 0.5) * 0.22 * hNorm));
          float heightCarve = tongues * 1.22 - pow(hNorm, 0.76) * 0.90;

          float baseBed = smoothstep(0.16, 0.0, ny) * smoothstep(0.84, 0.25, abs(nx)) * 0.88;
          float flameBody = smoothstep(0.03, 0.34, heightCarve) * bowlEnvelope * smoothstep(0.0, 0.05, ny);

          float intensity = max(baseBed, flameBody) * smoothstep(0.0, 0.10, uHeat);
          if (intensity <= 0.01) discard;

          vec3 col = mix(vec3(0.95, 0.30, 0.02), vec3(1.0, 0.68, 0.12), smoothstep(0.12, 0.44, intensity));
          col = mix(col, vec3(1.0, 0.93, 0.48), smoothstep(0.42, 0.70, intensity));
          col = mix(col, vec3(1.0, 0.99, 0.95), smoothstep(0.68, 0.94, intensity));

          gl_FragColor = vec4(col * 1.42, clamp(intensity * 1.35, 0.0, 1.0));
        }
      `
    });

    const firePlaneGeom = new THREE.PlaneGeometry(8.2, 6.2);
    const firePlane1 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane1.position.set(0, 7.80, 0.10);
    cauldronGroup.add(firePlane1);

    const firePlane2 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane2.position.set(0, 7.80, -0.05);
    firePlane2.rotation.y = 0.24;
    firePlane2.scale.x = -1;
    cauldronGroup.add(firePlane2);

    const firePlane3 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane3.position.set(0, 7.80, 0.0);
    firePlane3.rotation.y = -0.24;
    cauldronGroup.add(firePlane3);

    // 3D Rising Sparks
    const sparkCount = 320;
    const sparkGeom = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    const sparkVel = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] = (Math.random() - 0.5) * 7.2;
      sparkPos[i * 3 + 1] = 4.8 + Math.random() * 6.2;
      sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 1.8;
      sparkVel.push({
        vx: (Math.random() - 0.5) * 0.032,
        vy: 0.035 + Math.random() * 0.075,
        vz: (Math.random() - 0.5) * 0.02
      });
    }
    sparkGeom.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));

    const sparkMat = new THREE.PointsMaterial({
      color: 0xffdf7a,
      size: 0.09,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparkPoints = new THREE.Points(sparkGeom, sparkMat);
    cauldronGroup.add(sparkPoints);

    // Subtle floating golden celebration dust motes
    const ambientDustCount = 150;
    const dustGeom = new THREE.BufferGeometry();
    const dustPos = new Float32Array(ambientDustCount * 3);
    for (let i = 0; i < ambientDustCount; i++) {
      dustPos[i * 3] = (Math.random() - 0.5) * 24;
      dustPos[i * 3 + 1] = Math.random() * 11;
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * 14 - 3;
    }
    dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
      color: 0xffe082,
      size: 0.06,
      transparent: true,
      opacity: 0.42,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const ambientDust = new THREE.Points(dustGeom, dustMat);
    scene.add(ambientDust);

    // --- Responsive Framing: Cauldron = 1/2 Screen Height, >= 1/2 Screen Width ---
    function updateFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);

      const dist = camera.position.z;
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeightAtZero = 2 * Math.tan(vFovRad / 2) * dist;
      const visibleWidthAtZero = visibleHeightAtZero * camera.aspect;

      const scaleY = (visibleHeightAtZero * 0.50) / 4.90;
      const scaleX = Math.max(scaleY, (visibleWidthAtZero * 0.54) / 9.12);

      cauldronGroup.scale.set(scaleX, scaleY, scaleY);
      const baseY = 3.35 - (visibleHeightAtZero * 0.45);
      cauldronGroup.position.y = baseY;
      floorGroup.position.y = baseY;
      backdropGroup.position.y = baseY;
    }
    window.addEventListener('resize', updateFraming);
    updateFraming();

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      heatValue += (targetHeat - heatValue) * 0.05;
      const heatNorm = heatValue / 100;

      if (heatValue >= 95) {
        sloganLeft.classList.add('visible');
        sloganRight.classList.add('visible');
      } else {
        sloganLeft.classList.remove('visible');
        sloganRight.classList.remove('visible');
      }

      fireUniforms.uTime.value = elapsed;
      fireUniforms.uHeat.value = heatNorm;

      const flicker = Math.sin(elapsed * 21.0) * 0.14 + Math.cos(elapsed * 33.0) * 0.09;
      fireLight.intensity = heatNorm > 0.01 ? (heatNorm * 56 + flicker * 9 * heatNorm) : 0;

      sparkMat.opacity = Math.min(0.95, heatNorm * 1.15);
      const posArr = sparkGeom.attributes.position.array;
      const spread = 3.6 * Math.sqrt(Math.max(0.05, heatNorm));
      const maxSparkY = 4.90 + heatNorm * 6.0;

      for (let i = 0; i < sparkCount; i++) {
        posArr[i * 3] += sparkVel[i].vx + Math.sin(elapsed * 3 + i) * 0.008;
        posArr[i * 3 + 1] += sparkVel[i].vy * (0.4 + heatNorm * 0.9);
        posArr[i * 3 + 2] += sparkVel[i].vz;

        if (posArr[i * 3 + 1] > maxSparkY || heatNorm < 0.02) {
          posArr[i * 3] = (Math.random() - 0.5) * 2 * spread;
          posArr[i * 3 + 1] = 4.75 + Math.random() * 0.3;
          posArr[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
        }
      }
      sparkGeom.attributes.position.needsUpdate = true;

      const dArr = dustGeom.attributes.position.array;
      for (let i = 0; i < ambientDustCount; i++) {
        dArr[i * 3 + 1] += 0.005;
        dArr[i * 3] += Math.sin(elapsed * 0.6 + i) * 0.0025;
        if (dArr[i * 3 + 1] > 11) dArr[i * 3 + 1] = 0.2;
      }
      dustGeom.attributes.position.needsUpdate = true;

      beamMeshes.forEach((b) => {
        b.cone.rotation.z = b.baseRotZ + Math.sin(elapsed * 0.3 + b.phase) * 0.02;
      });

      composer.render();
    }

    animate();
  </script>
