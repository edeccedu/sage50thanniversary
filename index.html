<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - 50th Anniversary Olympic Ceremonial Cauldron</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #120914;
      color: #fff;
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', 'PingFang HK', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Subtle edge framing that keeps the center bright and clear */
    .cinema-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 65%, rgba(6, 2, 8, 0.55) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Grand Ceremonial Slogan Reveal Overlay */
    .banner-container {
      position: fixed;
      top: 4.5vh;
      left: 0;
      width: 100%;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5vw;
      opacity: 0;
      transform: translateY(-28px) scale(0.94);
      transition: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .banner-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .laurel {
      height: 14.5vh;
      min-height: 92px;
      filter: drop-shadow(0 0 18px rgba(255, 200, 60, 0.85));
    }

    .slogan-plaque {
      background: linear-gradient(180deg, rgba(42, 8, 10, 0.88) 0%, rgba(18, 4, 6, 0.92) 100%);
      border-top: 2.5px solid rgba(255, 222, 115, 0.9);
      border-bottom: 2.5px solid rgba(255, 222, 115, 0.9);
      padding: 1.6vh 4vw;
      box-shadow: 0 14px 45px rgba(0, 0, 0, 0.75), inset 0 0 30px rgba(255, 195, 60, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .slogan-title {
      font-size: 4.8vh;
      font-weight: 900;
      letter-spacing: 0.36em;
      margin-right: -0.36em;
      background: linear-gradient(180deg, #ffffff 0%, #ffe885 45%, #d69c24 85%, #fff5c2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(255, 180, 0, 0.9));
      line-height: 1.32;
    }

    #setup-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 10, 14, 0.92);
      border: 1px solid rgba(255, 215, 0, 0.55);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    #setup-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="setup-badge">
    <div>Press <b>F</b> for Fullscreen &bull; Press <b>H</b> to hide/show this box</div>
    <div>Backstage Control: <b>/backstage.html</b> &bull; Remote Sync ID: <b id="peer-id-display" style="color:#fff;">Loading...</b></div>
  </div>

  <div id="webgl-container"></div>
  <div class="cinema-vignette"></div>

  <!-- Ceremonial Slogan Reveal -->
  <div class="banner-container" id="ceremony-slogan">
    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>

    <div class="slogan-plaque">
      <h1 class="slogan-title">五十載耆康安老</h1>
      <h1 class="slogan-title">以初心關顧同行</h1>
    </div>

    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let heatValue = 0;
    let targetHeat = 0;

    const sloganBanner = document.getElementById('ceremony-slogan');
    const setupBadge = document.getElementById('setup-badge');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setupBadge.classList.add('hidden');
      }
      if (e.key === 'h' || e.key === 'H') {
        setupBadge.classList.toggle('hidden');
      }
    });

    function handleCommand(data) {
      if (typeof data.heat === 'number') {
        targetHeat = Math.max(0, Math.min(100, data.heat));
      }
      if (data.hideBadge) setupBadge.classList.add('hidden');
    }

    try {
      const channel = new BroadcastChannel('cauldron_ceremony_sync');
      channel.onmessage = (event) => handleCommand(event.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'cauldron_state' && e.newValue) {
        handleCommand(JSON.parse(e.newValue));
      }
    });

    try {
      if (typeof Peer !== 'undefined') {
        const roomCode = 'cauldron-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomCode);
        peer.on('open', (id) => {
          document.getElementById('peer-id-display').textContent = id.replace('cauldron-', '');
        });
        peer.on('connection', (conn) => {
          setupBadge.classList.add('hidden');
          conn.on('data', (data) => handleCommand(data));
        });
        peer.on('error', () => {
          document.getElementById('peer-id-display').textContent = 'Local Mode';
        });
      }
    } catch (err) {
      document.getElementById('peer-id-display').textContent = 'Local Mode';
    }

    // --- Three.js Scene, Camera & Renderer ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 3.8, 15.2);
    camera.lookAt(0, 3.3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- Custom Stadium Reflection Environment Map (Makes Gold & Crimson Gleam Even at 0% Fire) ---
    function buildArenaEnvironment() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();

      // Warm ceremonial sky dome
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(40, 32, 16),
        new THREE.MeshBasicMaterial({ color: 0x3b1824, side: THREE.BackSide })
      );
      envScene.add(dome);

      // Simulated overhead stadium floodlight banks so metallic surfaces have crisp specular reflections
      const lightPanelMat = new THREE.MeshBasicMaterial({ color: 0xfff2d6 });
      [
        [-14, 18, 12], [14, 18, 12], [0, 22, 10],
        [-18, 14, -10], [18, 14, -10], [0, 12, 18]
      ].forEach(([lx, ly, lz]) => {
        const panel = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), lightPanelMat);
        panel.position.set(lx, ly, lz);
        panel.lookAt(0, 3, 0);
        envScene.add(panel);
      });

      const envRT = pmrem.fromScene(envScene, 0.04);
      scene.environment = envRT.texture;
      pmrem.dispose();
    }
    buildArenaEnvironment();

    // --- Ceremonial Arena Sky & Backdrop Dome ---
    function createArenaBackdropTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext('2d');

      // Rich ceremonial twilight royal-purple to crimson-gold horizon
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 512);
      skyGrad.addColorStop(0.0, '#121830');
      skyGrad.addColorStop(0.42, '#281836');
      skyGrad.addColorStop(0.72, '#4f1b24');
      skyGrad.addColorStop(1.0, '#240c10');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, 1024, 512);

      // Radiant warm golden aura behind the cauldron center
      const centerGlow = ctx.createRadialGradient(512, 310, 20, 512, 310, 380);
      centerGlow.addColorStop(0, 'rgba(255, 200, 120, 0.42)');
      centerGlow.addColorStop(0.5, 'rgba(180, 60, 45, 0.18)');
      centerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = centerGlow;
      ctx.fillRect(0, 0, 1024, 512);

      // Subtle stadium architectural arch lines & glowing crowd lights
      ctx.strokeStyle = 'rgba(255, 220, 150, 0.12)';
      ctx.lineWidth = 2;
      for (let y = 260; y < 480; y += 22) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.quadraticCurveTo(512, y - 18, 1024, y);
        ctx.stroke();
      }

      // Soft twinkling audience/stadium lights in the tiers
      for (let i = 0; i < 240; i++) {
        const sx = Math.random() * 1024;
        const sy = 250 + Math.random() * 210;
        const r = Math.random() * 1.8 + 0.6;
        ctx.fillStyle = `rgba(255, 235, 185, ${Math.random() * 0.45 + 0.1})`;
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const skyDome = new THREE.Mesh(
      new THREE.SphereGeometry(55, 48, 24),
      new THREE.MeshBasicMaterial({ map: createArenaBackdropTexture(), side: THREE.BackSide })
    );
    scene.add(skyDome);

    // --- Post-Processing Bloom ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.68, // bloom strength
      0.5,  // radius
      0.82  // threshold
    );
    composer.addPass(bloomPass);

    // --- Procedural High-Res Textures (Embossed Cloud Scrolls & Plaque) ---
    function createBowlTextures() {
      const w = 2048, h = 512;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = w; colorCanvas.height = h;
      const cCtx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = w; bumpCanvas.height = h;
      const bCtx = bumpCanvas.getContext('2d');

      // Vibrant Imperial Crimson Lacquer
      const grad = cCtx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#c41818');
      grad.addColorStop(0.5, '#e02222');
      grad.addColorStop(1, '#8c0c0c');
      cCtx.fillStyle = grad;
      cCtx.fillRect(0, 0, w, h);

      bCtx.fillStyle = '#404040';
      bCtx.fillRect(0, 0, w, h);

      // Gold Rim Bands
      cCtx.fillStyle = '#ffe074';
      cCtx.fillRect(0, 0, w, 30);
      cCtx.fillRect(0, h - 26, w, 26);
      bCtx.fillStyle = '#ffffff';
      bCtx.fillRect(0, 0, w, 30);
      bCtx.fillRect(0, h - 26, w, 26);

      // Repeating 3D Embossed Auspicious Cloud Scrolls (祥雲)
      const count = 16;
      const step = w / count;
      for (let i = 0; i < count; i++) {
        const cx = i * step + step * 0.5;
        const cy = h * 0.52;
        const flip = i % 2 === 0 ? 1 : -1;

        [cCtx, bCtx].forEach((ctx, idx) => {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(flip, 1);
          ctx.strokeStyle = idx === 0 ? '#ffe885' : '#ffffff';
          ctx.lineCap = 'round';

          ctx.lineWidth = idx === 0 ? 16 : 20;
          ctx.beginPath();
          ctx.arc(0, 0, 56, 0.15 * Math.PI, 1.85 * Math.PI);
          ctx.stroke();

          ctx.lineWidth = idx === 0 ? 11 : 15;
          ctx.beginPath();
          ctx.arc(6, 0, 28, 0, 1.7 * Math.PI);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(-56, 6);
          ctx.bezierCurveTo(-80, -35, -105, 35, -128, -4);
          ctx.stroke();
          ctx.restore();
        });
      }

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.wrapS = THREE.RepeatWrapping;
      colorTex.colorSpace = THREE.SRGBColorSpace;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.wrapS = THREE.RepeatWrapping;

      return { colorTex, bumpTex };
    }

    function createPlaqueTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 1024);
      grad.addColorStop(0, '#e32222');
      grad.addColorStop(0.5, '#bd1515');
      grad.addColorStop(1, '#870b0b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 1024);

      ctx.strokeStyle = '#ffe074';
      ctx.lineWidth = 16;
      ctx.strokeRect(24, 24, 464, 976);

      ctx.strokeStyle = '#ffea96';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(256, 230, 78, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#fff6c7';
      ctx.font = 'bold 86px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('50', 256, 258);

      ctx.fillStyle = '#ffea96';
      ctx.font = 'bold 70px "Noto Serif TC", "Songti TC", "PingFang HK", serif';
      ctx.fillText('五十載', 256, 440);
      ctx.fillText('耆康安老', 256, 540);

      ctx.strokeStyle = 'rgba(255, 235, 150, 0.92)';
      ctx.lineWidth = 6;
      [-92, -46, 0, 46, 92].forEach((rx, idx) => {
        ctx.beginPath();
        ctx.arc(256 + rx, idx % 2 === 0 ? 730 : 755, 26, 0, Math.PI * 2);
        ctx.stroke();
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // --- Build Grand Olympic Cauldron Monument ---
    const cauldronGroup = new THREE.Group();
    scene.add(cauldronGroup);

    const { colorTex, bumpTex } = createBowlTextures();
    const bowlMat = new THREE.MeshStandardMaterial({
      map: colorTex,
      bumpMap: bumpTex,
      bumpScale: 0.09,
      metalness: 0.65,
      roughness: 0.26,
      side: THREE.DoubleSide
    });

    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xffd65c,
      metalness: 0.88,
      roughness: 0.18
    });

    const bronzePillarMat = new THREE.MeshStandardMaterial({
      color: 0x5c4f4a,
      metalness: 0.78,
      roughness: 0.28
    });

    const marblePlinthMat = new THREE.MeshStandardMaterial({
      color: 0x3b2628,
      metalness: 0.35,
      roughness: 0.45
    });

    // 1. Grand 3-Tiered Olympic Podium Base with Gold Mouldings
    const tiers = [
      { w: 7.4, h: 0.22, d: 3.8, y: 0.11 },
      { w: 6.4, h: 0.20, d: 3.2, y: 0.32 },
      { w: 5.4, h: 0.18, d: 2.6, y: 0.51 }
    ];
    tiers.forEach(t => {
      const step = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.d), marblePlinthMat);
      step.position.y = t.y;
      step.receiveShadow = true;
      cauldronGroup.add(step);

      const trim = new THREE.Mesh(new THREE.BoxGeometry(t.w + 0.06, 0.04, t.d + 0.06), goldMat);
      trim.position.y = t.y + t.h / 2;
      cauldronGroup.add(trim);
    });

    // 2. Two Tall Angled Metallic Support Pillars + Gold Trim Strips
    function createPillar(side) {
      const group = new THREE.Group();

      const shape = new THREE.Shape();
      shape.moveTo(-0.46, 0);
      shape.lineTo(0.46, 0);
      shape.lineTo(0.62, 3.25);
      shape.lineTo(-0.36, 3.25);
      shape.closePath();

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.72,
        bevelEnabled: true,
        bevelThickness: 0.04,
        bevelSize: 0.04,
        bevelSegments: 3
      });
      geom.center();

      const mesh = new THREE.Mesh(geom, bronzePillarMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);

      // Vertical gold architectural inlay strip along outer edge
      const inlay = new THREE.Mesh(new THREE.BoxGeometry(0.08, 3.22, 0.82), goldMat);
      inlay.position.set(0.46, 0, 0);
      inlay.rotation.z = -0.045;
      group.add(inlay);

      group.position.set(side * 1.54, 2.22, 0);
      group.scale.x = side;
      return group;
    }
    cauldronGroup.add(createPillar(-1));
    cauldronGroup.add(createPillar(1));

    // 3. Exposed Golden Mechanical Burner Collar & Pipes Under the Bowl
    const neckCylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.5, 0.75, 28), goldMat);
    neckCylinder.position.set(0, 3.68, 0);
    cauldronGroup.add(neckCylinder);

    [-0.36, -0.12, 0.12, 0.36].forEach(px => {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.85, 12), goldMat);
      pipe.position.set(px, 3.66, 0.52);
      cauldronGroup.add(pipe);
    });

    // 4. Suspended Trapezoidal Crimson Plaque Between the Pillars
    const plaqueTex = createPlaqueTexture();
    const plaqueMat = new THREE.MeshStandardMaterial({
      map: plaqueTex,
      metalness: 0.25,
      roughness: 0.35
    });

    const plaqueGeom = new THREE.CylinderGeometry(1.24, 0.96, 2.32, 4);
    plaqueGeom.rotateY(Math.PI / 4);
    plaqueGeom.scale(1.2, 1.0, 0.24);

    const posAttr = plaqueGeom.attributes.position;
    const uvAttr = plaqueGeom.attributes.uv;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const y = posAttr.getY(i);
      uvAttr.setXY(i, (x / 2.3) + 0.5, (y / 2.32) + 0.5);
    }

    const plaqueMesh = new THREE.Mesh(plaqueGeom, plaqueMat);
    plaqueMesh.position.set(0, 2.46, 0.38);
    plaqueMesh.castShadow = true;
    cauldronGroup.add(plaqueMesh);

    const plaqueFrameGeom = new THREE.CylinderGeometry(1.28, 1.0, 2.38, 4);
    plaqueFrameGeom.rotateY(Math.PI / 4);
    plaqueFrameGeom.scale(1.2, 1.0, 0.21);
    const plaqueFrame = new THREE.Mesh(plaqueFrameGeom, goldMat);
    plaqueFrame.position.set(0, 2.46, 0.36);
    cauldronGroup.add(plaqueFrame);

    // 5. Grand Olympic Cauldron Bowl (Wide, Sculpted & Embossed)
    const bowlPoints = [
      new THREE.Vector2(0.0, 0.0),
      new THREE.Vector2(1.5, 0.06),
      new THREE.Vector2(2.85, 0.30),
      new THREE.Vector2(3.95, 0.72),
      new THREE.Vector2(4.45, 1.12),
      new THREE.Vector2(4.25, 1.15),
      new THREE.Vector2(3.55, 0.76),
      new THREE.Vector2(0.0, 0.52)
    ];
    const bowlGeom = new THREE.LatheGeometry(bowlPoints, 80);
    const bowlMesh = new THREE.Mesh(bowlGeom, bowlMat);
    bowlMesh.position.set(0, 3.74, 0);
    bowlMesh.castShadow = true;
    bowlMesh.receiveShadow = true;
    cauldronGroup.add(bowlMesh);

    // Double Metallic Gold Rim Rings on Top of the Bowl
    const rimTorus = new THREE.Mesh(new THREE.TorusGeometry(4.36, 0.075, 18, 96), goldMat);
    rimTorus.rotation.x = Math.PI / 2;
    rimTorus.position.set(0, 4.87, 0);
    cauldronGroup.add(rimTorus);

    const lowerRimTorus = new THREE.Mesh(new THREE.TorusGeometry(4.12, 0.04, 14, 96), goldMat);
    lowerRimTorus.rotation.x = Math.PI / 2;
    lowerRimTorus.position.set(0, 4.65, 0);
    cauldronGroup.add(lowerRimTorus);

    // --- Reflective Ceremonial Stage Floor & Golden Carpet Runner ---
    const stageFloor = new THREE.Mesh(
      new THREE.CircleGeometry(36, 64),
      new THREE.MeshStandardMaterial({ color: 0x22161c, metalness: 0.55, roughness: 0.32 })
    );
    stageFloor.rotation.x = -Math.PI / 2;
    stageFloor.receiveShadow = true;
    scene.add(stageFloor);

    // Ceremonial Red & Gold Stage Carpet Leading to the Podium
    const carpet = new THREE.Mesh(
      new THREE.PlaneGeometry(8.6, 18),
      new THREE.MeshStandardMaterial({ color: 0x6e0e14, roughness: 0.75, metalness: 0.1 })
    );
    carpet.rotation.x = -Math.PI / 2;
    carpet.position.set(0, 0.005, 5);
    scene.add(carpet);

    // --- Bright Multi-Point Arena Lighting (Ensures Cauldron Is Always Clearly Visible) ---
    const hemiLight = new THREE.HemisphereLight(0xffe8cc, 0x3a1c24, 1.45);
    scene.add(hemiLight);

    const frontKeyLight = new THREE.DirectionalLight(0xfff4de, 2.8);
    frontKeyLight.position.set(3.5, 9.5, 11.5);
    frontKeyLight.castShadow = true;
    scene.add(frontKeyLight);

    const leftRimLight = new THREE.DirectionalLight(0xdceeff, 1.8);
    leftRimLight.position.set(-9, 8, 6);
    scene.add(leftRimLight);

    const rightRimLight = new THREE.DirectionalLight(0xffdfaa, 1.8);
    rightRimLight.position.set(9, 8, 6);
    scene.add(rightRimLight);

    // Volumetric Stage Spotlights
    const beamMeshes = [];
    function createStageBeam(x, y, z, targetX, targetY, colorHex) {
      const coneGeom = new THREE.ConeGeometry(4.0, 24, 32, 1, true);
      coneGeom.translate(0, -12, 0);
      const coneMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        uniforms: {
          uColor: { value: new THREE.Color(colorHex) },
          uOpacity: { value: 0.13 }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mvPos.xyz;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vec3 viewDir = normalize(vViewPos);
            float edgeFade = pow(abs(dot(vNormal, viewDir)), 1.6);
            float verticalFade = smoothstep(0.0, 0.85, vUv.y) * smoothstep(1.0, 0.75, vUv.y);
            gl_FragColor = vec4(uColor, edgeFade * verticalFade * uOpacity);
          }
        `
      });
      const cone = new THREE.Mesh(coneGeom, coneMat);
      cone.position.set(x, y, z);
      cone.lookAt(targetX, targetY, 0);
      cone.rotateX(Math.PI / 2);
      scene.add(cone);
      beamMeshes.push({ cone, phase: Math.random() * Math.PI * 2 });
    }

    createStageBeam(-10, 13.5, -4, -1.5, 2.5, 0xe3f1ff);
    createStageBeam(10, 13.5, -4, 1.5, 2.5, 0xe3f1ff);
    createStageBeam(-5.5, 14.5, -6, 0, 4.0, 0xffe6ba);
    createStageBeam(5.5, 14.5, -6, 0, 4.0, 0xffe6ba);

    // Dynamic Fire Point Light
    const fireLight = new THREE.PointLight(0xff7700, 0, 26, 1.3);
    fireLight.position.set(0, 5.6, 0.8);
    scene.add(fireLight);

    // --- Custom GPU GLSL Volumetric Fire Shader ---
    const fireUniforms = {
      uTime: { value: 0 },
      uHeat: { value: 0 }
    };

    const fireMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: fireUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uHeat;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p *= 2.04;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          if (uHeat <= 0.005) discard;

          vec2 uv = vUv;
          float nx = (uv.x - 0.5) * 2.0;
          float ny = uv.y;

          float maxH = mix(0.08, 0.96, uHeat);
          float hNorm = ny / maxH;
          if (hNorm > 1.05) discard;

          vec2 flowUv = vec2(nx * 2.6, ny * 3.8 - uTime * 3.4);
          float n1 = fbm(flowUv);
          float n2 = fbm(flowUv * 1.9 + vec2(uTime * 0.7, -uTime * 2.1));
          float turb = mix(n1, n2, 0.45);

          float baseSpread = mix(0.24, 0.90, sqrt(uHeat));
          float taper = mix(baseSpread, 0.04, pow(clamp(hNorm, 0.0, 1.0), 0.85));
          float distFromCenter = abs(nx + (turb - 0.5) * 0.42 * hNorm);

          float shape = smoothstep(taper, taper * 0.15, distFromCenter);
          float verticalMask = smoothstep(0.0, 0.09, ny) * smoothstep(1.02, 0.25, hNorm);

          float intensity = shape * verticalMask * (0.65 + 0.75 * turb);
          intensity = smoothstep(0.18, 0.88, intensity) * smoothstep(0.0, 0.12, uHeat);

          vec3 col = mix(vec3(0.88, 0.10, 0.0), vec3(1.0, 0.44, 0.02), smoothstep(0.15, 0.48, intensity));
          col = mix(col, vec3(1.0, 0.86, 0.24), smoothstep(0.45, 0.75, intensity));
          col = mix(col, vec3(1.0, 0.99, 0.90), smoothstep(0.75, 0.98, intensity));

          gl_FragColor = vec4(col * 1.45, clamp(intensity * 1.25, 0.0, 1.0));
        }
      `
    });

    const firePlaneGeom = new THREE.PlaneGeometry(8.2, 5.3);
    const firePlane1 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane1.position.set(0, 7.25, 0.05);
    cauldronGroup.add(firePlane1);

    const firePlane2 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane2.position.set(0, 7.25, -0.05);
    firePlane2.rotation.y = 0.22;
    cauldronGroup.add(firePlane2);

    // --- 3D Rising Golden Sparks ---
    const sparkCount = 260;
    const sparkGeom = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    const sparkVel = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] = (Math.random() - 0.5) * 6.8;
      sparkPos[i * 3 + 1] = 4.8 + Math.random() * 5.0;
      sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
      sparkVel.push({
        vx: (Math.random() - 0.5) * 0.035,
        vy: 0.03 + Math.random() * 0.075,
        vz: (Math.random() - 0.5) * 0.02
      });
    }
    sparkGeom.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));

    const sparkMat = new THREE.PointsMaterial({
      color: 0xffd666,
      size: 0.095,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparkPoints = new THREE.Points(sparkGeom, sparkMat);
    cauldronGroup.add(sparkPoints);

    // --- Responsive Framing: Cauldron = 1/2 Screen Height, >= 1/2 Screen Width ---
    function updateFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);

      const dist = camera.position.z;
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeightAtZero = 2 * Math.tan(vFovRad / 2) * dist;
      const visibleWidthAtZero = visibleHeightAtZero * camera.aspect;

      const scaleY = (visibleHeightAtZero * 0.50) / 4.95;
      const scaleX = Math.max(scaleY, (visibleWidthAtZero * 0.58) / 8.85);

      cauldronGroup.scale.set(scaleX, scaleY, scaleY);
      cauldronGroup.position.y = 3.3 - (visibleHeightAtZero * 0.485);
    }
    window.addEventListener('resize', updateFraming);
    updateFraming();

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      heatValue += (targetHeat - heatValue) * 0.05;
      const heatNorm = heatValue / 100;

      if (heatValue >= 95) {
        sloganBanner.classList.add('visible');
      } else {
        sloganBanner.classList.remove('visible');
      }

      fireUniforms.uTime.value = elapsed;
      fireUniforms.uHeat.value = heatNorm;

      const flicker = Math.sin(elapsed * 19.0) * 0.14 + Math.cos(elapsed * 31.0) * 0.09;
      fireLight.intensity = heatNorm > 0.01 ? (heatNorm * 45 + flicker * 8 * heatNorm) : 0;

      sparkMat.opacity = Math.min(0.95, heatNorm * 1.15);
      const posArr = sparkGeom.attributes.position.array;
      const spread = 3.8 * Math.sqrt(Math.max(0.05, heatNorm));
      const maxSparkY = 4.9 + heatNorm * 5.2;

      for (let i = 0; i < sparkCount; i++) {
        posArr[i * 3] += sparkVel[i].vx + Math.sin(elapsed * 3 + i) * 0.008;
        posArr[i * 3 + 1] += sparkVel[i].vy * (0.4 + heatNorm * 0.9);
        posArr[i * 3 + 2] += sparkVel[i].vz;

        if (posArr[i * 3 + 1] > maxSparkY || heatNorm < 0.02) {
          posArr[i * 3] = (Math.random() - 0.5) * 2 * spread;
          posArr[i * 3 + 1] = 4.75 + Math.random() * 0.3;
          posArr[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
        }
      }
      sparkGeom.attributes.position.needsUpdate = true;

      beamMeshes.forEach((b) => {
        b.cone.rotation.z = Math.sin(elapsed * 0.45 + b.phase) * 0.08;
      });

      composer.render();
    }

    animate();
  </script>
</body>
</html>
