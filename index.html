<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - 50th Anniversary Ceremonial Cauldron</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1019;
      color: #fff;
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', 'PingFang HK', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Subtle photographic lens vignette */
    .lens-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 52%, transparent 62%, rgba(4, 7, 12, 0.52) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Ceremonial Slogan Reveal Overlay */
    .banner-container {
      position: fixed;
      top: 4.5vh;
      left: 0;
      width: 100%;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5vw;
      opacity: 0;
      transform: translateY(-28px) scale(0.94);
      transition: all 2.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .banner-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .laurel {
      height: 14.5vh;
      min-height: 92px;
      filter: drop-shadow(0 0 18px rgba(255, 200, 60, 0.85));
    }

    .slogan-plaque {
      background: linear-gradient(180deg, rgba(35, 8, 10, 0.88) 0%, rgba(16, 4, 6, 0.92) 100%);
      border-top: 2.5px solid rgba(255, 222, 115, 0.9);
      border-bottom: 2.5px solid rgba(255, 222, 115, 0.9);
      padding: 1.6vh 4vw;
      box-shadow: 0 14px 45px rgba(0, 0, 0, 0.75), inset 0 0 30px rgba(255, 195, 60, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slogan-title {
      font-size: 4.8vh;
      font-weight: 900;
      letter-spacing: 0.36em;
      margin-right: -0.36em;
      background: linear-gradient(180deg, #ffffff 0%, #ffe885 45%, #d69c24 85%, #fff5c2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(255, 180, 0, 0.9));
      line-height: 1.32;
    }

    #setup-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(14, 20, 32, 0.92);
      border: 1px solid rgba(255, 215, 0, 0.55);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.5;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    #setup-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="setup-badge">
    <div>Press <b>F</b> for Fullscreen &bull; Press <b>H</b> to hide/show this box</div>
    <div>Backstage Control: <b>/backstage.html</b> &bull; Remote Sync ID: <b id="peer-id-display" style="color:#fff;">Loading...</b></div>
  </div>

  <div id="webgl-container"></div>
  <div class="lens-vignette"></div>

  <!-- Ceremonial Slogan Reveal -->
  <div class="banner-container" id="ceremony-slogan">
    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>

    <div class="slogan-plaque">
      <h1 class="slogan-title">五十載耆康安老</h1>
      <h1 class="slogan-title">以初心關顧同行</h1>
    </div>

    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 22 48 C 16 76 36 96 60 96 C 84 96 104 76 98 48" fill="none" stroke="#ffd866" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 22 58 A 38 38 0 0 0 98 58" fill="none" stroke="#ffd866" stroke-width="1.5" />
      <g stroke="#ffd866" fill="#ffd866">
        <path d="M 22 48 C 16 43 11 43 13 53 C 16 48 19 46 22 48 Z" />
        <path d="M 26 64 C 19 61 15 64 18 72 C 21 67 24 65 26 64 Z" />
        <path d="M 36 80 C 29 80 27 85 32 92 C 34 87 36 84 36 80 Z" />
        <path d="M 98 48 C 104 43 109 43 107 53 C 104 48 101 46 98 48 Z" />
        <path d="M 94 64 C 101 61 105 64 102 72 C 99 67 96 65 94 64 Z" />
        <path d="M 84 80 C 91 80 93 85 88 92 C 86 87 84 84 84 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff7cc" text-anchor="middle">50</text>
    </svg>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let heatValue = 0;
    let targetHeat = 0;

    const sloganBanner = document.getElementById('ceremony-slogan');
    const setupBadge = document.getElementById('setup-badge');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setupBadge.classList.add('hidden');
      }
      if (e.key === 'h' || e.key === 'H') {
        setupBadge.classList.toggle('hidden');
      }
    });

    function handleCommand(data) {
      if (typeof data.heat === 'number') {
        targetHeat = Math.max(0, Math.min(100, data.heat));
      }
      if (data.hideBadge) setupBadge.classList.add('hidden');
    }

    try {
      const channel = new BroadcastChannel('cauldron_ceremony_sync');
      channel.onmessage = (event) => handleCommand(event.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'cauldron_state' && e.newValue) {
        handleCommand(JSON.parse(e.newValue));
      }
    });

    try {
      if (typeof Peer !== 'undefined') {
        const roomCode = 'cauldron-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomCode);
        peer.on('open', (id) => {
          document.getElementById('peer-id-display').textContent = id.replace('cauldron-', '');
        });
        peer.on('connection', (conn) => {
          setupBadge.classList.add('hidden');
          conn.on('data', (data) => handleCommand(data));
        });
        peer.on('error', () => {
          document.getElementById('peer-id-display').textContent = 'Local Mode';
        });
      }
    } catch (err) {
      document.getElementById('peer-id-display').textContent = 'Local Mode';
    }

    // --- Three.js Scene, Camera & Renderer ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();

    // Slightly telephoto broadcast camera lens (30 deg FOV) for natural photographic compression
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(0, 3.65, 17.8);
    camera.lookAt(0, 3.25, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- High-Dynamic-Range Arena Reflection Map (Critical for Realistic Metal Speculars) ---
    function buildArenaEnvironment() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();

      // Dark neutral-cool arena dome so metallic reflections have high contrast
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(45, 32, 16),
        new THREE.MeshBasicMaterial({ color: 0x161c26, side: THREE.BackSide })
      );
      envScene.add(dome);

      // Sharp high-intensity light strips for realistic brushed metal & bronze specular streaks
      const lightStrips = [
        { pos: [-12, 16, 12], color: 0xe6f7ff, size: [5, 12] },
        { pos: [12, 16, 12], color: 0xe6f7ff, size: [5, 12] },
        { pos: [0, 22, 6], color: 0xffe8c8, size: [16, 4] },
        { pos: [-15, 6, 6], color: 0xff8c42, size: [3, 16] },
        { pos: [15, 6, 6], color: 0xff8c42, size: [3, 16] },
        { pos: [0, -10, 10], color: 0x6d7d8c, size: [24, 10] } // floor bounce
      ];
      lightStrips.forEach(p => {
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(p.size[0], p.size[1]),
          new THREE.MeshBasicMaterial({ color: p.color })
        );
        panel.position.set(...p.pos);
        panel.lookAt(0, 3, 0);
        envScene.add(panel);
      });

      const envRT = pmrem.fromScene(envScene, 0.025);
      scene.environment = envRT.texture;
      pmrem.dispose();
    }
    buildArenaEnvironment();

    // --- Procedural Micro-Grain Surface Texture (Eliminates Smooth Plastic Look) ---
    function createMicroGrainTexture(baseVal = 128, variance = 28, streakY = false) {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(size, size);
      const data = imgData.data;

      for (let y = 0; y < size; y++) {
        const rowBias = streakY ? 0 : (Math.random() - 0.5) * variance * 0.6;
        for (let x = 0; x < size; x++) {
          const colBias = streakY ? (Math.random() - 0.5) * variance * 0.75 : 0;
          const grain = (Math.random() - 0.5) * variance + rowBias + colBias;
          const v = Math.max(0, Math.min(255, baseVal + grain));
          const idx = (y * size + x) * 4;
          data[idx] = v;
          data[idx + 1] = v;
          data[idx + 2] = v;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    const brushedMetalRoughness = createMicroGrainTexture(110, 42, true);
    const powderCoatRoughness = createMicroGrainTexture(165, 30, false);

    // --- Photographic Stadium Background ---
    function createStadiumBackdropTexture() {
      const c = document.createElement('canvas');
      c.width = 1600;
      c.height = 900;
      const ctx = c.getContext('2d');

      // 1. Out-of-focus warm amber-terracotta upper roof canopy (top 28%)
      const roofGrad = ctx.createLinearGradient(0, 0, 0, 265);
      roofGrad.addColorStop(0.0, '#4f2819');
      roofGrad.addColorStop(0.55, '#3a1c12');
      roofGrad.addColorStop(0.92, '#1a1210');
      roofGrad.addColorStop(1.0, '#0d121a');
      ctx.fillStyle = roofGrad;
      ctx.fillRect(0, 0, 1600, 265);

      // Soft architectural roof trusses
      ctx.strokeStyle = 'rgba(255, 190, 140, 0.06)';
      ctx.lineWidth = 6;
      for (let x = -200; x < 1800; x += 72) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 130, 250);
        ctx.stroke();
      }

      // 2. Deep Navy-Slate Arena Seating Tiers
      const wallGrad = ctx.createLinearGradient(0, 255, 0, 900);
      wallGrad.addColorStop(0.0, '#0d121b');
      wallGrad.addColorStop(0.45, '#131c29');
      wallGrad.addColorStop(1.0, '#192434');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 255, 1600, 645);

      // Subtle photographic bokeh & depth-of-field haze behind the cauldron
      const centerHaze = ctx.createRadialGradient(800, 560, 40, 800, 560, 620);
      centerHaze.addColorStop(0, 'rgba(95, 145, 190, 0.22)');
      centerHaze.addColorStop(1, 'rgba(13, 18, 27, 0)');
      ctx.fillStyle = centerHaze;
      ctx.fillRect(0, 255, 1600, 645);

      // Horizontal tiered seating step ledges with soft edge highlights
      for (let y = 410; y <= 880; y += 24) {
        ctx.fillStyle = 'rgba(7, 11, 18, 0.62)';
        ctx.fillRect(0, y, 1600, 6);
        ctx.fillStyle = 'rgba(120, 155, 190, 0.13)';
        ctx.fillRect(0, y + 6, 1600, 2);
      }

      // Soft out-of-focus blue bokeh dots in upper stadium tier
      for (let i = 0; i < 40; i++) {
        const dx = 300 + Math.random() * 1000;
        const dy = 320 + Math.random() * 85;
        const grad = ctx.createRadialGradient(dx, dy, 0, dx, dy, 5);
        grad.addColorStop(0, 'rgba(110, 185, 255, 0.35)');
        grad.addColorStop(1, 'rgba(110, 185, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(dx, dy, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const backdropPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(56, 31.5),
      new THREE.MeshBasicMaterial({ map: createStadiumBackdropTexture() })
    );
    backdropPlane.position.set(0, 7.6, -16);
    scene.add(backdropPlane);

    // Light-Grey Textured Arena Floor
    const arenaFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(64, 32),
      new THREE.MeshStandardMaterial({
        color: 0x7b8894,
        roughness: 0.72,
        roughnessMap: powderCoatRoughness,
        metalness: 0.08
      })
    );
    arenaFloor.rotation.x = -Math.PI / 2;
    arenaFloor.position.set(0, 0, -2);
    arenaFloor.receiveShadow = true;
    scene.add(arenaFloor);

    // --- Post-Processing Bloom ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.65,
      0.48,
      0.84
    );
    composer.addPass(bloomPass);

    // =========================================================================
    // BUILD PHOTOREALISTIC 3D CAULDRON WITH TRUE EXTRUDED METALWORK
    // =========================================================================
    const cauldronGroup = new THREE.Group();
    scene.add(cauldronGroup);

    // Realistic PBR Materials
    const darkCopperBowlMat = new THREE.MeshStandardMaterial({
      color: 0x6b110a,
      metalness: 0.86,
      roughness: 0.32,
      roughnessMap: brushedMetalRoughness,
      side: THREE.DoubleSide
    });

    const sculptedGoldBronzeMat = new THREE.MeshStandardMaterial({
      color: 0xe3b154,
      metalness: 0.94,
      roughness: 0.22,
      roughnessMap: brushedMetalRoughness
    });

    const anodizedPillarMat = new THREE.MeshStandardMaterial({
      color: 0x383d45,
      metalness: 0.82,
      roughness: 0.34,
      roughnessMap: brushedMetalRoughness
    });

    // Clean Matte Vermilion-Red Powder-Coated Shield Material (No text or logo)
    const vermilionShieldMat = new THREE.MeshStandardMaterial({
      color: 0xc21915,
      metalness: 0.06,
      roughness: 0.62,
      roughnessMap: powderCoatRoughness
    });

    // 1. Two Tall Angled Anodized Gunmetal Pillars
    function createPillar(side) {
      const shape = new THREE.Shape();
      shape.moveTo(-0.35, 0);
      shape.lineTo(0.35, 0);
      shape.lineTo(0.53, 3.86);
      shape.lineTo(-0.31, 3.86);
      shape.closePath();

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: 0.82,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 3
      });
      geom.center();

      const mesh = new THREE.Mesh(geom, anodizedPillarMat);
      mesh.position.set(side * 1.46, 1.93, 0);
      mesh.scale.x = side;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }
    cauldronGroup.add(createPillar(-1));
    cauldronGroup.add(createPillar(1));

    // Warm orange-amber rim bounce lights on the outer edges of the pillars
    const leftEdgeLight = new THREE.PointLight(0xff7426, 16, 8.5, 1.6);
    leftEdgeLight.position.set(-2.55, 1.85, 1.15);
    cauldronGroup.add(leftEdgeLight);

    const rightEdgeLight = new THREE.PointLight(0xff7426, 16, 8.5, 1.6);
    rightEdgeLight.position.set(2.55, 1.85, 1.15);
    cauldronGroup.add(rightEdgeLight);

    // 2. Exposed Brass-Gold Mechanical Burner Assembly Under the Bowl
    const burnerCore = new THREE.Mesh(
      new THREE.CylinderGeometry(0.54, 0.44, 0.72, 28),
      sculptedGoldBronzeMat
    );
    burnerCore.position.set(0, 3.68, 0);
    cauldronGroup.add(burnerCore);

    // Detailed mechanical rings & vertical gas manifold pipes
    [3.50, 3.74].forEach(ry => {
      const collar = new THREE.Mesh(
        new THREE.TorusGeometry(0.55, 0.035, 12, 32),
        sculptedGoldBronzeMat
      );
      collar.rotation.x = Math.PI / 2;
      collar.position.set(0, ry, 0);
      cauldronGroup.add(collar);
    });

    [-0.32, -0.11, 0.11, 0.32].forEach(px => {
      const pipe = new THREE.Mesh(
        new THREE.CylinderGeometry(0.042, 0.042, 0.84, 14),
        sculptedGoldBronzeMat
      );
      pipe.position.set(px, 3.66, 0.48);
      cauldronGroup.add(pipe);
    });

    // 3. Clean Matte Vermilion-Red Trapezoidal Plaque (No text/emblem)
    const shieldShape = new THREE.Shape();
    shieldShape.moveTo(-0.92, -1.28);
    shieldShape.lineTo(0.92, -1.28);
    shieldShape.lineTo(1.16, 1.28);
    shieldShape.lineTo(-1.16, 1.28);
    shieldShape.closePath();

    const shieldGeom = new THREE.ExtrudeGeometry(shieldShape, {
      depth: 0.14,
      bevelEnabled: true,
      bevelThickness: 0.015,
      bevelSize: 0.015,
      bevelSegments: 2
    });
    shieldGeom.center();

    const plaqueMesh = new THREE.Mesh(shieldGeom, vermilionShieldMat);
    plaqueMesh.position.set(0, 2.15, 0.42);
    plaqueMesh.castShadow = true;
    plaqueMesh.receiveShadow = true;
    cauldronGroup.add(plaqueMesh);

    // 4. Inner Dark-Copper Bowl Shell
    const bowlPoints = [
      new THREE.Vector2(0.0, 0.0),
      new THREE.Vector2(1.4, 0.04),
      new THREE.Vector2(2.75, 0.25),
      new THREE.Vector2(3.85, 0.66),
      new THREE.Vector2(4.42, 1.06),
      new THREE.Vector2(4.26, 1.08),
      new THREE.Vector2(3.50, 0.70),
      new THREE.Vector2(0.0, 0.46)
    ];
    const bowlGeom = new THREE.LatheGeometry(bowlPoints, 96);
    const bowlMesh = new THREE.Mesh(bowlGeom, darkCopperBowlMat);
    bowlMesh.position.set(0, 3.76, 0);
    bowlMesh.castShadow = true;
    bowlMesh.receiveShadow = true;
    cauldronGroup.add(bowlMesh);

    // 5. TRUE 3D SCULPTED GOLD CLOUD-SCROLL FILIGREE CAGE AROUND THE BOWL
    // Builds physical 3D metallic spiral tubes hugging the exact curvature of the bowl
    const filigreeGroup = new THREE.Group();
    filigreeGroup.position.set(0, 3.76, 0);
    cauldronGroup.add(filigreeGroup);

    // Top & Bottom Structural Rim Rings
    const topRim = new THREE.Mesh(new THREE.TorusGeometry(4.36, 0.048, 16, 120), sculptedGoldBronzeMat);
    topRim.rotation.x = Math.PI / 2;
    topRim.position.y = 1.06;
    filigreeGroup.add(topRim);

    const midRib = new THREE.Mesh(new THREE.TorusGeometry(3.58, 0.028, 12, 100), sculptedGoldBronzeMat);
    midRib.rotation.x = Math.PI / 2;
    midRib.position.y = 0.56;
    filigreeGroup.add(midRib);

    const lowRim = new THREE.Mesh(new THREE.TorusGeometry(2.35, 0.035, 12, 90), sculptedGoldBronzeMat);
    lowRim.rotation.x = Math.PI / 2;
    lowRim.position.y = 0.19;
    filigreeGroup.add(lowRim);

    // Helper to project (theta, heightRatio) onto the outer bowl surface with slight outward relief
    function bowlSurfacePoint(theta, t, relief = 0.045) {
      // Interpolate radius & y along the outer bowl curve
      const r = 1.4 + t * 3.04 + relief;
      const y = 0.04 + Math.pow(t, 1.48) * 1.01;
      return new THREE.Vector3(Math.sin(theta) * r, y, Math.cos(theta) * r);
    }

    // Generate 24 interlocking 3D spiral cloud scrolls all the way around the bowl
    const numSpirals = 24;
    for (let i = 0; i < numSpirals; i++) {
      const baseTheta = (i / numSpirals) * Math.PI * 2;
      const dir = i % 2 === 0 ? 1 : -1;

      // Upper large 3D spiral scroll
      const ptsUpper = [];
      const turns = 2.15;
      const steps = 42;
      for (let s = 0; s <= steps; s++) {
        const frac = s / steps;
        const angle = frac * Math.PI * 2 * turns;
        const spiralRad = frac * 0.115;
        const theta = baseTheta + Math.cos(angle) * spiralRad * dir;
        const t = 0.68 + Math.sin(angle) * 0.24 * frac;
        ptsUpper.push(bowlSurfacePoint(theta, Math.max(0.15, Math.min(0.96, t)), 0.045));
      }
      const upperCurve = new THREE.CatmullRomCurve3(ptsUpper);
      const upperTube = new THREE.Mesh(
        new THREE.TubeGeometry(upperCurve, 36, 0.032, 8, false),
        sculptedGoldBronzeMat
      );
      filigreeGroup.add(upperTube);

      // Lower nested 3D spiral scroll
      const ptsLower = [];
      const lowBaseTheta = baseTheta + (Math.PI / numSpirals);
      for (let s = 0; s <= 32; s++) {
        const frac = s / 32;
        const angle = frac * Math.PI * 2 * 1.85;
        const spiralRad = frac * 0.085;
        const theta = lowBaseTheta - Math.cos(angle) * spiralRad * dir;
        const t = 0.34 + Math.sin(angle) * 0.17 * frac;
        ptsLower.push(bowlSurfacePoint(theta, Math.max(0.10, Math.min(0.62, t)), 0.042));
      }
      const lowerCurve = new THREE.CatmullRomCurve3(ptsLower);
      const lowerTube = new THREE.Mesh(
        new THREE.TubeGeometry(lowerCurve, 28, 0.026, 8, false),
        sculptedGoldBronzeMat
      );
      filigreeGroup.add(lowerTube);
    }

    // --- Stadium Floodlight Fixtures & Diagonal Cyan-White Beams ---
    const beamMeshes = [];
    const fixtureMat = new THREE.MeshBasicMaterial({ color: 0xeafcff });

    function createStadiumFloodlight(x, y, z, targetX, targetY, beamRadius, beamLength, opacity) {
      const housing = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.36, 0.45, 24),
        new THREE.MeshStandardMaterial({ color: 0x161d26, metalness: 0.85, roughness: 0.28 })
      );
      housing.position.set(x, y, z);
      housing.lookAt(targetX, targetY, 0);
      housing.rotateX(Math.PI / 2);
      scene.add(housing);

      const lens = new THREE.Mesh(new THREE.CircleGeometry(0.36, 24), fixtureMat);
      lens.position.set(x, y, z + 0.23);
      lens.lookAt(targetX, targetY, 0);
      scene.add(lens);

      const coneGeom = new THREE.ConeGeometry(beamRadius, beamLength, 36, 1, true);
      coneGeom.translate(0, -beamLength / 2, 0);
      const coneMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        uniforms: {
          uColor: { value: new THREE.Color(0x9be2ff) },
          uOpacity: { value: opacity }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mvPos.xyz;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vec3 viewDir = normalize(vViewPos);
            float edgeFade = pow(abs(dot(vNormal, viewDir)), 1.6);
            float verticalFade = smoothstep(0.0, 0.78, vUv.y) * smoothstep(1.0, 0.86, vUv.y);
            gl_FragColor = vec4(uColor, edgeFade * verticalFade * uOpacity);
          }
        `
      });
      const cone = new THREE.Mesh(coneGeom, coneMat);
      cone.position.set(x, y, z + 0.2);
      cone.lookAt(targetX, targetY, 0);
      cone.rotateX(Math.PI / 2);
      scene.add(cone);
      beamMeshes.push({ cone, baseRotZ: cone.rotation.z, phase: Math.random() * Math.PI * 2 });
    }

    createStadiumFloodlight(-8.4, 9.4, -13.0, -14.8, 5.2, 2.8, 15, 0.23);
    createStadiumFloodlight(-0.6, 8.1, -13.2, -7.2, 4.5, 2.4, 14, 0.21);
    createStadiumFloodlight(7.8, 9.4, -13.0, 1.4, 4.6, 3.0, 16, 0.25);
    createStadiumFloodlight(11.2, 5.8, -12.0, 4.2, 1.2, 2.9, 14, 0.27);

    // Balanced Photographic Key, Fill & Rim Lighting
    const hemiLight = new THREE.HemisphereLight(0xd4e8ff, 0x56626e, 1.15);
    scene.add(hemiLight);

    const frontKeyLight = new THREE.DirectionalLight(0xfff4e4, 2.1);
    frontKeyLight.position.set(3.2, 9.5, 12.0);
    frontKeyLight.castShadow = true;
    scene.add(frontKeyLight);

    const coolRightSpot = new THREE.SpotLight(0xb5ebff, 42, 32, Math.PI / 5, 0.65, 1.0);
    coolRightSpot.position.set(10, 7.5, 4);
    coolRightSpot.target.position.set(1.5, 0.5, 0);
    scene.add(coolRightSpot);
    scene.add(coolRightSpot.target);

    const fireLight = new THREE.PointLight(0xff8414, 0, 26, 1.25);
    fireLight.position.set(0, 5.5, 0.85);
    scene.add(fireLight);

    // =========================================================================
    // MULTI-TONGUE PHOTOGRAPHIC FIRE SHADER (Breaks into Separate Flame Licks)
    // =========================================================================
    const fireUniforms = {
      uTime: { value: 0 },
      uHeat: { value: 0 }
    };

    const fireMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: fireUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uHeat;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.52;
          for (int i = 0; i < 6; i++) {
            v += a * noise(p);
            p *= 2.12;
            a *= 0.49;
          }
          return v;
        }

        void main() {
          if (uHeat <= 0.005) discard;

          vec2 uv = vUv;
          float nx = (uv.x - 0.5) * 2.0; // -1 to 1 across bowl
          float ny = uv.y;              // 0 at bowl rim to 1 at top

          float maxH = mix(0.10, 0.96, uHeat);
          float hNorm = ny / maxH;
          if (hNorm > 1.05) discard;

          // Domain-warped high-frequency turbulence to create distinct sharp flame tongues
          vec2 warpUv = vec2(nx * 5.2, ny * 3.4 - uTime * 3.8);
          float warp = fbm(warpUv);
          vec2 detailUv = vec2((nx + (warp - 0.5) * 0.38) * 7.5, ny * 5.2 - uTime * 4.8);
          float tongues = fbm(detailUv);

          // Combine broad flame envelope with sharp individual vertical licks
          float spread = mix(0.28, 0.86, sqrt(uHeat));
          float bowlEnvelope = smoothstep(spread, spread * 0.25, abs(nx));
          float heightCarve = tongues * 1.18 - pow(hNorm, 0.78) * 0.92;

          // Base embers bed inside the bowl rim
          float baseBed = smoothstep(0.18, 0.0, ny) * bowlEnvelope * 0.85;
          float flameBody = smoothstep(0.04, 0.36, heightCarve) * bowlEnvelope * smoothstep(0.0, 0.06, ny);

          float intensity = max(baseBed, flameBody) * smoothstep(0.0, 0.10, uHeat);
          if (intensity <= 0.01) discard;

          // Realistic natural gas/torch color spectrum (bright yellow-white tongues with warm orange edges)
          vec3 col = mix(vec3(0.95, 0.28, 0.02), vec3(1.0, 0.65, 0.10), smoothstep(0.12, 0.45, intensity));
          col = mix(col, vec3(1.0, 0.92, 0.45), smoothstep(0.42, 0.72, intensity));
          col = mix(col, vec3(1.0, 0.99, 0.94), smoothstep(0.70, 0.95, intensity));

          gl_FragColor = vec4(col * 1.38, clamp(intensity * 1.35, 0.0, 1.0));
        }
      `
    });

    const firePlaneGeom = new THREE.PlaneGeometry(8.1, 4.9);
    const firePlane1 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane1.position.set(0, 7.12, 0.08);
    cauldronGroup.add(firePlane1);

    const firePlane2 = new THREE.Mesh(firePlaneGeom, fireMat);
    firePlane2.position.set(0, 7.12, -0.08);
    firePlane2.rotation.y = 0.18;
    firePlane2.scale.x = -1; // mirror second layer so flame tongues never look repetitive
    cauldronGroup.add(firePlane2);

    // --- 3D Rising Sparks ---
    const sparkCount = 220;
    const sparkGeom = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);
    const sparkVel = [];

    for (let i = 0; i < sparkCount; i++) {
      sparkPos[i * 3] = (Math.random() - 0.5) * 6.5;
      sparkPos[i * 3 + 1] = 4.8 + Math.random() * 5.0;
      sparkPos[i * 3 + 2] = (Math.random() - 0.5) * 1.5;
      sparkVel.push({
        vx: (Math.random() - 0.5) * 0.032,
        vy: 0.03 + Math.random() * 0.07,
        vz: (Math.random() - 0.5) * 0.02
      });
    }
    sparkGeom.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));

    const sparkMat = new THREE.PointsMaterial({
      color: 0xffd973,
      size: 0.08,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sparkPoints = new THREE.Points(sparkGeom, sparkMat);
    cauldronGroup.add(sparkPoints);

    // --- Responsive Framing: Cauldron = 1/2 Screen Height, >= 1/2 Screen Width ---
    function updateFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);

      const dist = camera.position.z;
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeightAtZero = 2 * Math.tan(vFovRad / 2) * dist;
      const visibleWidthAtZero = visibleHeightAtZero * camera.aspect;

      const scaleY = (visibleHeightAtZero * 0.50) / 4.86;
      const scaleX = Math.max(scaleY, (visibleWidthAtZero * 0.56) / 8.84);

      cauldronGroup.scale.set(scaleX, scaleY, scaleY);
      cauldronGroup.position.y = 3.25 - (visibleHeightAtZero * 0.46);
      arenaFloor.position.y = cauldronGroup.position.y;
    }
    window.addEventListener('resize', updateFraming);
    updateFraming();

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      heatValue += (targetHeat - heatValue) * 0.05;
      const heatNorm = heatValue / 100;

      if (heatValue >= 95) {
        sloganBanner.classList.add('visible');
      } else {
        sloganBanner.classList.remove('visible');
      }

      fireUniforms.uTime.value = elapsed;
      fireUniforms.uHeat.value = heatNorm;

      const flicker = Math.sin(elapsed * 21.0) * 0.14 + Math.cos(elapsed * 33.0) * 0.09;
      fireLight.intensity = heatNorm > 0.01 ? (heatNorm * 44 + flicker * 8 * heatNorm) : 0;

      sparkMat.opacity = Math.min(0.95, heatNorm * 1.15);
      const posArr = sparkGeom.attributes.position.array;
      const spread = 3.6 * Math.sqrt(Math.max(0.05, heatNorm));
      const maxSparkY = 4.85 + heatNorm * 5.0;

      for (let i = 0; i < sparkCount; i++) {
        posArr[i * 3] += sparkVel[i].vx + Math.sin(elapsed * 3 + i) * 0.008;
        posArr[i * 3 + 1] += sparkVel[i].vy * (0.4 + heatNorm * 0.9);
        posArr[i * 3 + 2] += sparkVel[i].vz;

        if (posArr[i * 3 + 1] > maxSparkY || heatNorm < 0.02) {
          posArr[i * 3] = (Math.random() - 0.5) * 2 * spread;
          posArr[i * 3 + 1] = 4.72 + Math.random() * 0.3;
          posArr[i * 3 + 2] = (Math.random() - 0.5) * 1.2;
        }
      }
      sparkGeom.attributes.position.needsUpdate = true;

      beamMeshes.forEach((b) => {
        b.cone.rotation.z = b.baseRotZ + Math.sin(elapsed * 0.35 + b.phase) * 0.025;
      });

      composer.render();
    }

    animate();
  </script>
</body>
</html>
