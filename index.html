<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50th Anniversary Ceremony Cauldron Screen</title>
  <style>
    /* Reset and Core Layout */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050101;
      color: #fff;
      font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Cinematic Background Overlay */
    .bg-ambience {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 70%, #1c0505 0%, #000 75%);
      z-index: 1;
      opacity: 0.8;
      transition: opacity 2s ease;
    }

    /* Screen Frame / Theater borders for ceremony */
    .viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 4vh 2vw;
    }

    /* stage spotlight beams simulating live event */
    .spotlights {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    .beam {
      position: absolute;
      top: -20%;
      width: 15vw;
      height: 150vh;
      background: radial-gradient(ellipse at top, rgba(255, 230, 180, 0.15) 0%, rgba(255, 230, 180, 0) 70%);
      transform-origin: top center;
      animation: sweep 12s ease-in-out infinite alternate;
    }
    .beam-left { left: 15%; transform: rotate(-25deg); animation-delay: -3s; }
    .beam-right { right: 15%; transform: rotate(25deg); }
    @keyframes sweep {
      0% { transform: rotate(-20deg) scaleX(0.8); opacity: 0.2; }
      50% { transform: rotate(0deg) scaleX(1.2); opacity: 0.5; }
      100% { transform: rotate(20deg) scaleX(0.8); opacity: 0.2; }
    }

    /* Slogan Banner container */
    .banner-container {
      width: 90%;
      text-align: center;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3vw;
      opacity: 0;
      transform: translateY(-30px) scale(0.95);
      transition: all 2.5s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .banner-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Slogan details matching image style */
    .laurel {
      height: 12vh;
      min-height: 80px;
      opacity: 0.9;
    }
    .slogan-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .slogan-title {
      font-size: 5vh;
      font-weight: 900;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff7d6 0%, #ffdf6d 40%, #cca03c 70%, #fff7d6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 191, 0, 0.5));
      margin-bottom: 1.5vh;
      transform: scale(0.95);
      transition: transform 1.5s ease;
    }
    .visible .slogan-title {
      transform: scale(1);
    }

    /* Main Visuals area: Cauldron Canvas overlay */
    .cauldron-wrapper {
      position: relative;
      width: 100%;
      height: 65%;
      flex-grow: 1;
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }
    canvas#stage-canvas {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
    }

    /* 2D Grand Cauldron drawing parameters container (CSS sizing layer overlay) */
    .interactive-overlay {
      position: absolute;
      bottom: 0;
      width: 450px;
      height: 350px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    /* console backstage UI panel */
    .backstage-console {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 320px;
      background: rgba(18, 10, 10, 0.95);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 12px;
      padding: 18px;
      z-index: 100;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 68, 0, 0.15);
      font-family: monospace;
      color: #9f8c8c;
      transform: translateX(350px);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .backstage-console.visible {
      transform: translateX(0);
    }
    .backstage-toggle {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #3a1a1a;
      border: 1px solid rgba(255, 215, 0, 0.45);
      color: #ffd700;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 101;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .backstage-toggle:hover {
      background: #6a2a2a;
      box-shadow: 0 0 12px #ff4500;
    }

    /* UI components inside control panel */
    .console-header {
      font-size: 0.85rem;
      color: #ffd700;
      margin-bottom: 12px;
      border-bottom: 1px dashed rgba(255, 215, 0, 0.3);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .console-section {
      margin-bottom: 15px;
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 5px;
    }
    .slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #2b1212;
      outline: none;
      cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffd700;
      border: 2px solid #ff4500;
      cursor: pointer;
    }
    .quick-preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 5px;
    }
    .console-btn {
      background: #201010;
      border: 1px solid #ff4500;
      color: #f7a5a5;
      padding: 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .console-btn:hover {
      background: #4a1515;
      color: #fff;
    }
    .console-btn.active {
      background: #ff4500;
      border-color: #ffd700;
      color: #fff;
      font-weight: bold;
    }
    .audio-status-box {
      font-size: 0.75rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px;
      border-radius: 4px;
      margin-top: 8px;
    }
  </style>
</head>
