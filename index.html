<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - 50th Anniversary Cauldron</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070202;
      color: #fff;
      font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .bg-ambience {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 62%, #3a0d0d 0%, #060101 78%);
      z-index: 1;
      opacity: 0.85;
      transition: opacity 1.5s ease;
    }

    .spotlights {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .beam {
      position: absolute;
      top: -20%;
      width: 20vw;
      height: 150vh;
      background: radial-gradient(ellipse at top, rgba(255, 232, 185, 0.2) 0%, rgba(255, 232, 185, 0) 70%);
      transform-origin: top center;
      animation: sweep 12s ease-in-out infinite alternate;
    }
    .beam-left { left: 16%; transform: rotate(-25deg); animation-delay: -3s; }
    .beam-right { right: 16%; transform: rotate(25deg); }
    @keyframes sweep {
      0% { transform: rotate(-20deg) scaleX(0.85); opacity: 0.35; }
      50% { transform: rotate(0deg) scaleX(1.2); opacity: 0.65; }
      100% { transform: rotate(20deg) scaleX(0.85); opacity: 0.35; }
    }

    canvas#stage-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 3;
    }

    .banner-container {
      position: fixed;
      top: 4.5vh;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3vw;
      opacity: 0;
      transform: translateY(-30px) scale(0.95);
      transition: all 2s cubic-bezier(0.19, 1, 0.22, 1);
      pointer-events: none;
    }
    .banner-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .laurel {
      height: 12vh;
      min-height: 80px;
    }
    .slogan-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .slogan-title {
      font-size: 4.8vh;
      font-weight: 900;
      letter-spacing: 0.32em;
      background: linear-gradient(135deg, #fff7d6 0%, #ffdf6d 40%, #cca03c 70%, #fff7d6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 191, 0, 0.75));
      margin-bottom: 1.2vh;
    }

    #setup-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(25, 12, 12, 0.9);
      border: 1px solid rgba(255, 215, 0, 0.5);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    #setup-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="setup-badge">
    <div>Press <b>F</b> for Fullscreen &bull; Press <b>H</b> to hide/show this box</div>
    <div>Backstage Control: <b>/backstage.html</b> &bull; Remote Sync ID: <b id="peer-id-display" style="color:#fff;">Loading...</b></div>
  </div>

  <div class="bg-ambience" id="ambient-overlay"></div>

  <div class="spotlights">
    <div class="beam beam-left"></div>
    <div class="beam beam-right"></div>
  </div>

  <div class="banner-container" id="ceremony-slogan">
    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 20 50 C 15 75 35 95 60 95 C 85 95 105 75 100 50" fill="none" stroke="gold" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 20 60 A 40 40 0 0 0 100 60" fill="none" stroke="gold" stroke-width="1.5" />
      <g stroke="gold" fill="gold">
        <path d="M 20 50 C 15 45 10 45 12 55 C 15 50 18 48 20 50 Z" />
        <path d="M 25 65 C 18 62 14 65 17 73 C 20 68 23 66 25 65 Z" />
        <path d="M 35 80 C 28 80 26 85 31 92 C 33 87 35 84 35 80 Z" />
        <path d="M 100 50 C 105 45 110 45 108 55 C 105 50 102 48 100 50 Z" />
        <path d="M 95 65 C 102 62 106 65 103 73 C 100 68 97 66 95 65 Z" />
        <path d="M 85 80 C 92 80 94 85 89 92 C 87 87 85 84 85 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff5be" text-anchor="middle" style="filter:drop-shadow(0 0 5px gold);">50</text>
    </svg>

    <div class="slogan-box">
      <h1 class="slogan-title">五十載耆康安老</h1>
      <h1 class="slogan-title" style="font-size: 5.1vh; margin-bottom:0;">以初心關顧同行</h1>
    </div>

    <svg class="laurel" viewBox="0 0 120 120">
      <path d="M 20 50 C 15 75 35 95 60 95 C 85 95 105 75 100 50" fill="none" stroke="gold" stroke-width="2.5" stroke-dasharray="2,2" />
      <path d="M 20 60 A 40 40 0 0 0 100 60" fill="none" stroke="gold" stroke-width="1.5" />
      <g stroke="gold" fill="gold">
        <path d="M 20 50 C 15 45 10 45 12 55 C 15 50 18 48 20 50 Z" />
        <path d="M 25 65 C 18 62 14 65 17 73 C 20 68 23 66 25 65 Z" />
        <path d="M 35 80 C 28 80 26 85 31 92 C 33 87 35 84 35 80 Z" />
        <path d="M 100 50 C 105 45 110 45 108 55 C 105 50 102 48 100 50 Z" />
        <path d="M 95 65 C 102 62 106 65 103 73 C 100 68 97 66 95 65 Z" />
        <path d="M 85 80 C 92 80 94 85 89 92 C 87 87 85 84 85 80 Z" />
      </g>
      <text x="50%" y="56" font-family="Georgia, serif" font-weight="900" font-size="30" fill="#fff5be" text-anchor="middle" style="filter:drop-shadow(0 0 5px gold);">50</text>
    </svg>
  </div>

  <canvas id="stage-canvas"></canvas>

  <script>
    let heatValue = 0;
    let targetHeat = 0;

    const canvas = document.getElementById('stage-canvas');
    const ctx = canvas.getContext('2d');
    const sloganBanner = document.getElementById('ceremony-slogan');
    const ambientBg = document.getElementById('ambient-overlay');
    const setupBadge = document.getElementById('setup-badge');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setupBadge.classList.add('hidden');
      }
      if (e.key === 'h' || e.key === 'H') {
        setupBadge.classList.toggle('hidden');
      }
    });

    function handleCommand(data) {
      if (typeof data.heat === 'number') {
        targetHeat = Math.max(0, Math.min(100, data.heat));
      }
      if (data.hideBadge) setupBadge.classList.add('hidden');
    }

    // 1. Same-Device Sync
    try {
      const channel = new BroadcastChannel('cauldron_ceremony_sync');
      channel.onmessage = (event) => handleCommand(event.data);
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'cauldron_state' && e.newValue) {
        handleCommand(JSON.parse(e.newValue));
      }
    });

    // 2. Cross-Device Wi-Fi Sync
    try {
      if (typeof Peer !== 'undefined') {
        const roomCode = 'cauldron-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomCode);
        peer.on('open', (id) => {
          document.getElementById('peer-id-display').textContent = id.replace('cauldron-', '');
        });
        peer.on('connection', (conn) => {
          setupBadge.classList.add('hidden');
          conn.on('data', (data) => handleCommand(data));
        });
        peer.on('error', () => {
          document.getElementById('peer-id-display').textContent = 'Local Mode';
        });
      } else {
        document.getElementById('peer-id-display').textContent = 'Local Mode';
      }
    } catch (err) {
      document.getElementById('peer-id-display').textContent = 'Local Mode';
    }

    const particles = [];
    const sparks = [];

    // Scaled so the cauldron spans ~42% of the viewport height and commands the stage
    function getCauldronMetrics() {
      const targetHeight = canvas.height * 0.42;
      const baseHeight = 250; // total internal coordinate height from rim (0) to bottom plinth (250)
      const scale = Math.max(1.1, Math.min(targetHeight / baseHeight, (canvas.width * 0.48) / 480));
      const cX = canvas.width / 2;
      const cY = canvas.height - (baseHeight * scale) - (canvas.height * 0.03);
      return { cX, cY, scale };
    }

    function createFireParticle() {
      const { cX, cY, scale } = getCauldronMetrics();
      const widthRange = 185 * scale * (heatValue / 100);
      return {
        x: cX + (Math.random() - 0.5) * widthRange,
        y: cY + (Math.random() - 0.5) * 14 * scale,
        vx: (Math.random() - 0.5) * 2.6 * scale,
        vy: (-Math.random() * (5.2 + (heatValue / 10)) - 2.2) * scale,
        size: (Math.random() * 34 + 15) * scale,
        alpha: 1,
        decay: Math.random() * 0.017 + 0.006,
        colorSeed: Math.random()
      };
    }

    function createSparkParticle() {
      const { cX, cY, scale } = getCauldronMetrics();
      return {
        x: cX + (Math.random() - 0.5) * 210 * scale,
        y: cY,
        vx: (Math.random() - 0.5) * 7.5 * scale,
        vy: (-Math.random() * 10.5 - 4) * scale,
        size: (Math.random() * 4.5 + 1.5) * scale,
        alpha: 1,
        decay: Math.random() * 0.01 + 0.005
      };
    }

    function render() {
      heatValue += (targetHeat - heatValue) * 0.05;
      ambientBg.style.opacity = 0.72 + (heatValue / 350);

      if (heatValue >= 95) {
        sloganBanner.classList.add('visible');
      } else {
        sloganBanner.classList.remove('visible');
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Flame particles spawn behind the cauldron rim for natural depth
      const fireSpawnCount = Math.floor(heatValue / 2.6);
      for (let i = 0; i < fireSpawnCount; i++) particles.push(createFireParticle());

      const sparkSpawnRate = heatValue > 90 ? 20 : Math.floor(heatValue / 6);
      for (let i = 0; i < sparkSpawnRate; i++) sparks.push(createSparkParticle());

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.05;
        s.alpha -= s.decay;
        if (s.alpha <= 0) { sparks.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(255, ${160 + Math.random() * 95}, 0, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }

        let g = p.colorSeed < 0.4 ? Math.floor(185 + Math.random() * 70)
              : p.colorSeed < 0.85 ? Math.floor(65 + Math.random() * 80) : 0;

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        grad.addColorStop(0, `rgba(255, ${g}, 0, ${p.alpha * 0.95})`);
        grad.addColorStop(0.5, `rgba(255, ${Math.max(0, g - 60)}, 0, ${p.alpha * 0.45})`);
        grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Draw Grand Monumental Red & Gold Olympic Cauldron
      const { cX, cY, scale } = getCauldronMetrics();
      ctx.save();
      ctx.translate(cX, cY);
      ctx.scale(scale, scale);

      // Ceremonial halo behind the cauldron
      const rimGlow = ctx.createRadialGradient(0, 80, 30, 0, 80, 340);
      rimGlow.addColorStop(0, `rgba(255, 195, 110, ${0.24 + heatValue / 450})`);
      rimGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = rimGlow;
      ctx.beginPath();
      ctx.arc(0, 80, 340, 0, Math.PI * 2);
      ctx.fill();

      // --- 3-Tiered Grand Ceremonial Plinth ---
      // Tier 3 (Bottom wide base)
      const tier3Grad = ctx.createLinearGradient(-240, 0, 240, 0);
      tier3Grad.addColorStop(0, '#140a0a');
      tier3Grad.addColorStop(0.5, '#2b1616');
      tier3Grad.addColorStop(1, '#140a0a');
      ctx.fillStyle = tier3Grad;
      ctx.fillRect(-240, 224, 480, 26);
      ctx.strokeStyle = '#e5aa3e';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(-240, 224, 480, 26);

      // Tier 2 (Middle step)
      ctx.fillStyle = '#221111';
      ctx.fillRect(-205, 202, 410, 22);
      ctx.strokeStyle = '#cca03c';
      ctx.lineWidth = 2;
      ctx.strokeRect(-205, 202, 410, 22);

      // Tier 1 (Upper gold-trimmed platform)
      ctx.fillStyle = '#2e1616';
      ctx.fillRect(-175, 182, 350, 20);
      ctx.strokeStyle = '#ffd866';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(-175, 182, 350, 20);
      ctx.fillStyle = '#e5aa3e';
      ctx.fillRect(-175, 182, 350, 5);

      // --- Sculpted Metallic Side Pillars ---
      const pillarGradL = ctx.createLinearGradient(-120, 0, -50, 0);
      pillarGradL.addColorStop(0, '#1f1614');
      pillarGradL.addColorStop(0.5, '#463732');
      pillarGradL.addColorStop(1, '#1b1311');
      ctx.fillStyle = pillarGradL;
      ctx.strokeStyle = '#9c8256';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-125, 24); ctx.lineTo(-98, 182);
      ctx.lineTo(-60, 182); ctx.lineTo(-76, 24);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      const pillarGradR = ctx.createLinearGradient(50, 0, 120, 0);
      pillarGradR.addColorStop(0, '#1b1311');
      pillarGradR.addColorStop(0.5, '#463732');
      pillarGradR.addColorStop(1, '#1f1614');
      ctx.fillStyle = pillarGradR;
      ctx.beginPath();
      ctx.moveTo(76, 24); ctx.lineTo(60, 182);
      ctx.lineTo(98, 182); ctx.lineTo(125, 24);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // --- Central Imperial Red & Gold Shield Pedestal ---
      const redPedestalGrad = ctx.createLinearGradient(-62, 0, 62, 0);
      redPedestalGrad.addColorStop(0, '#6e0b0b');
      redPedestalGrad.addColorStop(0.5, '#bd1919');
      redPedestalGrad.addColorStop(1, '#6e0b0b');
      ctx.fillStyle = redPedestalGrad;
      ctx.beginPath();
      ctx.moveTo(-62, 24); ctx.lineTo(-44, 182);
      ctx.lineTo(44, 182); ctx.lineTo(62, 24);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffd866';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Inner gold frame on red shield
      ctx.strokeStyle = 'rgba(255, 216, 102, 0.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-50, 34); ctx.lineTo(-35, 170);
      ctx.lineTo(35, 170); ctx.lineTo(50, 34);
      ctx.closePath(); ctx.stroke();

      // Anniversary Emblem & Calligraphy on Pedestal
      ctx.fillStyle = '#fff0b3';
      ctx.font = 'bold 26px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('50', 0, 74);

      ctx.fillStyle = '#ffe28a';
      ctx.font = 'bold 17px "PingFang HK", "Microsoft JhengHei", sans-serif';
      ctx.fillText('五十載', 0, 108);
      ctx.fillText('耆康安老', 0, 134);

      // --- Golden Collar Connecting Pedestal to Bowl ---
      ctx.fillStyle = '#d4a63e';
      ctx.fillRect(-36, 68, 72, 10);
      ctx.strokeStyle = '#fff0b3';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-36, 68, 72, 10);

      // --- Grand Olympic Bowl Interior ---
      ctx.fillStyle = '#380c0c';
      ctx.beginPath();
      ctx.ellipse(0, 6, 205, 24, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffd866';
      ctx.lineWidth = 3;
      ctx.stroke();

      // --- Grand Imperial Red & Gold Cauldron Bowl Exterior ---
      const bowlGrad = ctx.createLinearGradient(-220, 0, 220, 0);
      bowlGrad.addColorStop(0, '#6b0a0a');
      bowlGrad.addColorStop(0.25, '#b81818');
      bowlGrad.addColorStop(0.5, '#d62222');
      bowlGrad.addColorStop(0.75, '#b81818');
      bowlGrad.addColorStop(1, '#6b0a0a');

      ctx.fillStyle = bowlGrad;
      ctx.beginPath();
      ctx.moveTo(-220, 0);
      ctx.bezierCurveTo(-195, 84, 195, 84, 220, 0);
      ctx.bezierCurveTo(130, 18, -130, 18, -220, 0);
      ctx.closePath();
      ctx.fill();

      // Double Metallic Gold Rim & Lower Trim
      ctx.strokeStyle = '#ffd866';
      ctx.lineWidth = 5;
      ctx.stroke();

      // Embossed Gold Cloud-Scroll Filigree Across the Bowl
      ctx.strokeStyle = '#ffe58f';
      ctx.lineWidth = 3.2;
      for (let i = -165; i <= 165; i += 41) {
        const yOffset = 34 - Math.pow(i / 220, 2) * 14;
        ctx.beginPath();
        ctx.arc(i, yOffset, 13, 0, Math.PI * 1.65, i % 82 === 0);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(i + (i % 82 === 0 ? -4 : 4), yOffset, 6, 0, Math.PI * 1.5, i % 82 !== 0);
        ctx.stroke();
      }

      ctx.restore();

      // Stage Floor Reflection Glow when lit
      if (heatValue > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const groundGrad = ctx.createRadialGradient(cX, cY + 245 * scale, 15, cX, cY + 245 * scale, 380 * scale);
        groundGrad.addColorStop(0, `rgba(255, 75, 0, ${heatValue / 120})`);
        groundGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = groundGrad;
        ctx.beginPath();
        ctx.ellipse(cX, cY + 245 * scale, 420 * scale, 60 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
